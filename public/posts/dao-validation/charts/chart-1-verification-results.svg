<svg
  viewBox="0 0 560 380"
  xmlns="http://www.w3.org/2000/svg"
  style="max-width:100%;height:auto;font-family:'Inter',system-ui,sans-serif"
  role="img"
  aria-label="NuSMV verification results: before the fix, the attacker's contract reached 14 ETH (2 ETH stolen); after the fix, exactly 12 ETH (attack blocked)."
>
  <title>NuSMV Verification: User ETH Balance Under Attack</title>
  <desc>A horizontal bar chart comparing the user's final ETH balance in the attack scenario before and after the fix. Before the fix the balance is 14 ETH (2 ETH more than the expected 12), confirming the vulnerability. After the fix the balance is exactly 12 ETH, confirming the attack is blocked. The expected correct balance is 12 ETH (10 principal + 2 reward).</desc>

  <!-- Background -->
  <rect width="560" height="380" fill="transparent"/>

  <!-- Title -->
  <text x="280" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor">User ETH Balance Under Attack Scenario</text>
  <text x="280" y="52" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.55">NuSMV model-checking result: before fix vs. after fix</text>

  <!-- Y-axis labels -->
  <text x="120" y="118" text-anchor="end" font-size="13" fill="currentColor" opacity="0.8">Before fix</text>
  <text x="120" y="198" text-anchor="end" font-size="13" fill="currentColor" opacity="0.8">After fix</text>
  <text x="120" y="278" text-anchor="end" font-size="13" fill="currentColor" opacity="0.8">Expected</text>

  <!-- Grid lines -->
  <g stroke="currentColor" opacity="0.08">
    <line x1="130" y1="80" x2="520" y2="80"/>
    <line x1="130" y1="160" x2="520" y2="160"/>
    <line x1="130" y1="240" x2="520" y2="240"/>
    <line x1="130" y1="320" x2="520" y2="320"/>
  </g>

  <!-- X-axis -->
  <line x1="130" y1="320" x2="520" y2="320" stroke="currentColor" opacity="0.3"/>

  <!-- X-axis labels -->
  <text x="130" y="345" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.5">0</text>
  <text x="220" y="345" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.5">4</text>
  <text x="310" y="345" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.5">8</text>
  <text x="400" y="345" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.5">12</text>
  <text x="490" y="345" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.5">16</text>

  <!-- Expected reference line at 12 ETH -->
  <line x1="400" y1="80" x2="400" y2="320" stroke="#22c55e" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
  <text x="405" y="75" font-size="9" fill="#22c55e" opacity="0.8">12 ETH expected</text>

  <!-- Bar 1: Before fix (14 ETH) -->
  <rect x="130" y="95" width="337" height="30" rx="4" fill="#f97316"/>
  <text x="472" y="115" font-size="12" font-weight="700" fill="white">14 ETH</text>

  <!-- Bar 2: After fix (12 ETH) -->
  <rect x="130" y="175" width="280" height="30" rx="4" fill="#22c55e"/>
  <text x="415" y="195" font-size="12" font-weight="700" fill="white">12 ETH</text>

  <!-- Bar 3: Expected (12 ETH) -->
  <rect x="130" y="255" width="280" height="30" rx="4" fill="#38bdf8" opacity="0.4"/>
  <text x="415" y="275" font-size="12" font-weight="700" fill="currentColor" opacity="0.7">12 ETH</text>

  <!-- Annotation: stolen amount -->
  <line x1="400" y1="95" x2="400" y2="125" stroke="#f97316" stroke-width="1.5" opacity="0.7"/>
  <line x1="467" y1="95" x2="467" y2="125" stroke="#f97316" stroke-width="1.5" opacity="0.7"/>
  <line x1="400" y1="110" x2="467" y2="110" stroke="#f97316" stroke-width="1.5" opacity="0.7"/>
  <text x="433" y="88" text-anchor="middle" font-size="10" font-weight="600" fill="#f97316">+2 ETH stolen</text>

  <!-- Legend -->
  <g transform="translate(130, 360)">
    <rect width="10" height="10" rx="2" fill="#f97316"/>
    <text x="16" y="10" font-size="9" fill="currentColor" opacity="0.6">Before fix (vulnerable)</text>
    <rect x="140" width="10" height="10" rx="2" fill="#22c55e"/>
    <text x="156" y="10" font-size="9" fill="currentColor" opacity="0.6">After fix (secure)</text>
    <rect x="270" width="10" height="10" rx="2" fill="#38bdf8" opacity="0.4"/>
    <text x="286" y="10" font-size="9" fill="currentColor" opacity="0.6">Expected (correct)</text>
  </g>

  <!-- Source -->
  <text x="280" y="372" text-anchor="middle" font-size="9" fill="currentColor" opacity="0.35">Source: NuSMV verification of The DAO splitDAO model (author, 2019)</text>
</svg>
