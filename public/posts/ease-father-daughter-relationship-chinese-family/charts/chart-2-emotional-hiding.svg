<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-label="Horizontal bar chart showing the bidirectional emotional gap: parents want connection but model restraint, while teens hide struggles">
  <title>The Bidirectional Emotional Gap in Chinese Families</title>

  <!-- Background -->
  <rect width="640" height="420" fill="transparent"/>

  <!-- Title -->
  <text x="320" y="36" text-anchor="middle" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#e0e0e0">The Bidirectional Emotional Gap in Chinese Families</text>

  <!-- Subtitle -->
  <text x="320" y="58" text-anchor="middle" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#999">Parents want closeness, but model restraint — and teens hide their struggles</text>

  <!-- Bar 1: Parents who want deeper connection but don't know how (81.3%) -->
  <text x="80" y="115" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#ccc">Parents want deeper connection but don't know how</text>
  <rect x="80" y="125" width="390" height="32" rx="6" fill="#0d9488"/>
  <text x="480" y="147" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#0d9488">81.3%</text>

  <!-- Bar 2: Parents who rarely discuss emotions (61.8%) -->
  <text x="80" y="195" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#ccc">Parents who rarely discuss emotions openly</text>
  <rect x="80" y="205" width="297" height="32" rx="6" fill="#f59e0b"/>
  <text x="387" y="227" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#f59e0b">61.8%</text>

  <!-- Bar 3: Teens who hide mental health struggles (52.1%) -->
  <text x="80" y="275" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#ccc">Teens who hide mental health struggles from parents</text>
  <rect x="80" y="285" width="252" height="32" rx="6" fill="#ef4444"/>
  <text x="342" y="307" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#ef4444">52.1%</text>

  <!-- X-axis -->
  <line x1="80" y1="345" x2="540" y2="345" stroke="#555" stroke-width="1.5"/>
  <text x="80" y="365" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#aaa">0%</text>
  <text x="215" y="365" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#aaa">25%</text>
  <text x="350" y="365" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#aaa">50%</text>
  <text x="480" y="365" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#aaa">75%</text>
  <text x="540" y="365" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#aaa">100%</text>

  <!-- Legend -->
  <rect x="80" y="385" width="14" height="14" rx="3" fill="#0d9488"/>
  <text x="100" y="397" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#aaa">Parent-side gap</text>
  <rect x="230" y="385" width="14" height="14" rx="3" fill="#ef4444"/>
  <text x="250" y="397" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#aaa">Teen-side gap</text>

  <!-- Source -->
  <text x="580" y="410" text-anchor="end" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#777">Source: Beijing Normal University Faculty of Psychology, 2024; China Youth Daily, 2024</text>
</svg>