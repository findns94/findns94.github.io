<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" role="img" aria-label="Line chart: China quantitative fund AUM growth 2019 to 2025 in billion yuan. 2019: 200, 2020: 400, 2021: 800, 2022: 1050, 2023: 1300, 2024: 1500+, 2025: 1600 est.">
  <rect width="560" height="380" fill="#0f172a" rx="12"/>
  <text x="280" y="36" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="16" font-weight="600">China Quantitative Fund AUM Growth</text>
  <text x="280" y="56" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11">Billion RMB, 2019 – 2025 est.</text>
  <!-- grid -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="70" y1="80" x2="70" y2="300"/>
    <line x1="70" y1="300" x2="520" y2="300"/>
    <line x1="70" y1="153.3" x2="520" y2="153.3" stroke-dasharray="2.0 4"/>
    <line x1="70" y1="226.7" x2="520" y2="226.7" stroke-dasharray="2.0 4"/>
  </g>
  <!-- y axis labels -->
  <g font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">
    <text x="62" y="84" text-anchor="end">1,600</text>
    <text x="62" y="157.3" text-anchor="end">800</text>
    <text x="62" y="230.7" text-anchor="end">400</text>
    <text x="62" y="304" text-anchor="end">0</text>
  </g>
  <!-- line path: map x 2019..2025 -> 70..520 (step 90), y value -> 300..80 (range 1600) -->
  <!-- points: 2019=200,2020=400,2021=800,2022=1050,2023=1300,2024=1500,2025=1600 -->
  <!-- y = 300 - (val/1600)*220 -->
  <polyline fill="none" stroke="#3b82f6" stroke-width="3" stroke-linejoin="round" points="70,269 160,238 250,153 340,112.3 430,71.5 520,38 610,22" clip-path="inset(0 90px 0 0)"/>
  <!-- redraw within bounds: x max 520 -->
  <polyline fill="none" stroke="#3b82f6" stroke-width="3" stroke-linejoin="round" points="70,269 160,238 250,153.3 340,112.6 430,72 520,38"/>
  <!-- area fill -->
  <polygon points="70,269 160,238 250,153.3 340,112.6 430,72 520,38 520,300 70,300" fill="url(#blueGrad)" opacity="0.25"/>
  <defs>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- dots + value labels -->
  <g font-family="system-ui,sans-serif" font-size="11" fill="#e2e8f0" font-weight="600">
    <circle cx="70" cy="269" r="4" fill="#3b82f6"/><text x="70" y="260" text-anchor="middle">200</text>
    <circle cx="160" cy="238" r="4" fill="#3b82f6"/><text x="160" y="229" text-anchor="middle">400</text>
    <circle cx="250" cy="153.3" r="4" fill="#3b82f6"/><text x="250" y="144" text-anchor="middle">800</text>
    <circle cx="340" cy="112.6" r="4" fill="#3b82f6"/><text x="340" y="103" text-anchor="middle">1050</text>
    <circle cx="430" cy="72" r="4" fill="#3b82f6"/><text x="430" y="63" text-anchor="middle">1300</text>
    <circle cx="520" cy="38" r="4" fill="#3b82f6"/><text x="520" y="29" text-anchor="middle">1500+</text>
  </g>
  <!-- x axis labels -->
  <g font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">
    <text x="70" y="318" text-anchor="middle">2019</text>
    <text x="160" y="318" text-anchor="middle">2020</text>
    <text x="250" y="318" text-anchor="middle">2021</text>
    <text x="340" y="318" text-anchor="middle">2022</text>
    <text x="430" y="318" text-anchor="middle">2023</text>
    <text x="520" y="318" text-anchor="middle">2024</text>
  </g>
  <text x="280" y="358" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="10">Source: China Asset Management Association / private-placement data, 2024–2025</text>
</svg>
