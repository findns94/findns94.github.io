<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" role="img" aria-label="Horizontal bar chart: GitHub stars of Python China-quant libraries. Tushare 16000, AKShare 21900, FinGPT 21100, Baostock 7000, Backtrader 14500">
