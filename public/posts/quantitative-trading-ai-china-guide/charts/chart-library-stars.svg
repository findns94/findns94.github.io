    <line x1="150" y1="137.5" x2="520" y2="137.5"/>
    <line x1="150" y1="195" x2="520" y2="195"/>
    <line x1="150" y1="252.5" x2="520" y2="252.5"/>
  </g>
  <!-- bars: max 22000 mapped to width 370 -->
  <g font-family="system-ui,sans-serif">
    <!-- AKShare 21900 -->
    <text x="142" y="103" text-anchor="end" fill="#e2e8f0" font-size="12">AKShare</text>
    <rect x="150" y="90" width="368" height="22" rx="4" fill="#3b82f6"/>
    <text x="524" y="106" fill="#e2e8f0" font-size="12" font-weight="600">21,900</text>
    <!-- FinGPT 21100 -->
    <text x="142" y="160.5" text-anchor="end" fill="#e2e8f0" font-size="12">FinGPT</text>
    <rect x="150" y="147.5" width="354" height="22" rx="4" fill="#8b5cf6"/>
    <text x="508" y="163.5" fill="#e2e8f0" font-size="12" font-weight="600">21,100</text>
    <!-- Tushare 16000 -->
    <text x="142" y="218" text-anchor="end" fill="#e2e8f0" font-size="12">Tushare</text>
