<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" role="img" aria-label="Donut chart: A-share daily trading volume by investor type. Retail investors 82%, Institutional investors 12%, Quantitative/HFT programs 6%">
  <rect width="560" height="380" fill="#0f172a" rx="12"/>
  <text x="280" y="36" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="16" font-weight="600">A-Share Daily Trading Volume by Investor Type</text>
  <text x="280" y="56" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11">China A-share market, 2024</text>
  <!-- Donut segments via stroke-dasharray on circles -->
  <g transform="translate(200,200)">
    <circle r="110" fill="none" stroke="#3b82f6" stroke-width="40" stroke-dasharray="566 139" stroke-dashoffset="0"/>
    <circle r="110" fill="none" stroke="#22c55e" stroke-width="40" stroke-dasharray="87 618" stroke-dashoffset="-566"/>
    <circle r="110" fill="none" stroke="#f59e0b" stroke-width="40" stroke-dasharray="44 661" stroke-dashoffset="-653"/>
    <text x="0" y="-6" text-anchor="middle" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="30" font-weight="700">82%</text>
    <text x="0" y="18" text-anchor="middle" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="12">Retail volume</text>
  </g>
  <!-- Legend -->
  <g transform="translate(380,140)" font-family="system-ui,sans-serif" font-size="13">
    <rect x="0" y="0" width="16" height="16" rx="3" fill="#3b82f6"/>
    <text x="24" y="14" fill="#e2e8f0" font-weight="600">Retail investors</text>
    <text x="24" y="30" fill="#94a3b8" font-size="11">82% of daily volume</text>
    <rect x="0" y="56" width="16" height="16" rx="3" fill="#22c55e"/>
    <text x="24" y="70" fill="#e2e8f0" font-weight="600">Institutional</text>
    <text x="24" y="86" fill="#94a3b8" font-size="11">12% of daily volume</text>
    <rect x="0" y="112" width="16" height="16" rx="3" fill="#f59e0b"/>
    <text x="24" y="126" fill="#e2e8f0" font-weight="600">Quant / HFT</text>
    <text x="24" y="142" fill="#94a3b8" font-size="11">~6% (est. share)</text>
  </g>
  <text x="280" y="358" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="10">Source: CSDC / SSE investor structure data, 2024</text>
</svg>
