<svg viewBox="0 0 560 380" xmlns="http://www.w3.org/2000/svg" style="max-width: 100%; height: auto; font-family: 'Inter', system-ui, sans-serif" role="img" aria-label="Donut chart showing first-time contributor subsystem distribution in kernel 7.1">
  <title>First-Time Contributor Subsystem Distribution — Kernel 7.1</title>
  <desc>Donut chart showing: Documentation 78, net 66, misc drivers 52, drivers/net 49, drivers/staging 47, other 340</desc>

  <!-- Donut segments (approximated as arcs) -->
  <!-- Total: 78+66+52+49+47+340 = 632 -->
  <!-- Documentation: 78/632 = 12.3% -->
  <!-- net: 66/632 = 10.4% -->
  <!-- misc drivers: 52/632 = 8.2% -->
  <!-- drivers/net: 49/632 = 7.8% -->
  <!-- drivers/staging: 47/632 = 7.4% -->
  <!-- other: 340/632 = 53.8% -->

  <!-- C = 2*pi*120 = 753.98. Each dash is exactly fraction*C so slices tile exactly 360 degrees. -->
  <!-- Documentation 12.3%, net 10.4%, misc drivers 8.2%, drivers/net 7.8%, drivers/staging 7.4%, Other 53.8% -->
  <circle cx="220" cy="180" r="120" fill="none" stroke="#22c55e" stroke-width="35" stroke-dasharray="92.7 753.98" stroke-dashoffset="0" />
  <circle cx="220" cy="180" r="120" fill="none" stroke="#38bdf8" stroke-width="35" stroke-dasharray="78.4 753.98" stroke-dashoffset="-92.7" />
  <circle cx="220" cy="180" r="120" fill="none" stroke="#a78bfa" stroke-width="35" stroke-dasharray="61.8 753.98" stroke-dashoffset="-171.1" />
  <circle cx="220" cy="180" r="120" fill="none" stroke="#f97316" stroke-width="35" stroke-dasharray="58.8 753.98" stroke-dashoffset="-232.9" />
  <circle cx="220" cy="180" r="120" fill="none" stroke="#ef4444" stroke-width="35" stroke-dasharray="55.8 753.98" stroke-dashoffset="-291.7" />
  <circle cx="220" cy="180" r="120" fill="none" stroke="#64748b" stroke-width="35" stroke-dasharray="405.5 753.98" stroke-dashoffset="-347.5" />

  <!-- Center text -->
  <text x="220" y="172" text-anchor="middle" font-size="28" font-weight="900" fill="white">530</text>
  <text x="220" y="195" text-anchor="middle" font-size="10" fill="#94a3b8">first-timers</text>

  <!-- Legend -->
  <g transform="translate(380, 80)">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="#22c55e" />
    <text x="18" y="10" font-size="10" fill="currentColor" opacity="0.8">Documentation (78)</text>

    <rect x="0" y="22" width="12" height="12" rx="2" fill="#38bdf8" />
    <text x="18" y="32" font-size="10" fill="currentColor" opacity="0.8">net (66)</text>

    <rect x="0" y="44" width="12" height="12" rx="2" fill="#a78bfa" />
    <text x="18" y="54" font-size="10" fill="currentColor" opacity="0.8">misc drivers (52)</text>

    <rect x="0" y="66" width="12" height="12" rx="2" fill="#f97316" />
    <text x="18" y="76" font-size="10" fill="currentColor" opacity="0.8">drivers/net (49)</text>

    <rect x="0" y="88" width="12" height="12" rx="2" fill="#ef4444" />
    <text x="18" y="98" font-size="10" fill="currentColor" opacity="0.8">drivers/staging (47)</text>

    <rect x="0" y="110" width="12" height="12" rx="2" fill="#64748b" />
    <text x="18" y="120" font-size="10" fill="currentColor" opacity="0.8">Other (340)</text>
  </g>

  <text x="280" y="365" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.35">Source: LWN.net, "Who Wrote 7.1" (2026)</text>
</svg>