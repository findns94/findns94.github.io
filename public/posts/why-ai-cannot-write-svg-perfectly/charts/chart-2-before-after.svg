<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" role="img" aria-label="Side-by-side comparison: stroke-dasharray method with gaps (left) vs path-based method without gaps (right).">
<title>Stroke-dasharray vs Path-based Rendering</title>
<desc>A before/after comparison showing the gap problem with stroke-dasharray and the clean result with path-based rendering.</desc>

<!-- Background -->
<rect x="0" y="0" width="560" height="380" fill="#1a1a2e" rx="12"/>

<!-- Title -->
<text x="280" y="36" text-anchor="middle" fill="#e0e0e0" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="600">Stroke-dasharray vs Path-based</text>
<text x="280" y="56" text-anchor="middle" fill="#888888" font-family="'Inter', system-ui, sans-serif" font-size="11">Two approaches to rendering donut charts</text>

<!-- Left: Before (stroke-dasharray with gaps) -->
<text x="140" y="80" text-anchor="middle" fill="#e74c3c" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="600">Before: Stroke-dasharray</text>

<!-- Donut with gaps (simulated) -->
<g transform="translate(140, 210)">
  <!-- Background circle -->
  <circle r="100" fill="none" stroke="#333333" stroke-width="36"/>
  <!-- Segments with visible gaps -->
  <circle r="100" fill="none" stroke="#f97316" stroke-width="36" stroke-dasharray="180 753.98" transform="rotate(-90)"/>
  <circle r="100" fill="none" stroke="#38bdf8" stroke-width="36" stroke-dasharray="67 753.98" transform="rotate(-234)"/>
  <circle r="100" fill="none" stroke="#a78bfa" stroke-width="36" stroke-dasharray="90 753.98" transform="rotate(-288)"/>
  <circle r="100" fill="none" stroke="#22c55e" stroke-width="36" stroke-dasharray="45 753.98" transform="rotate(-360)"/>
  <circle r="100" fill="none" stroke="#fb923c" stroke-width="36" stroke-dasharray="67 753.98" transform="rotate(-396)"/>
  <!-- Center -->
  <circle r="58" fill="#1a1a2e"/>
  <text x="0" y="5" text-anchor="middle" fill="#e74c3c" font-size="11" font-weight="700">Gaps!</text>
</g>
<text x="140" y="340" text-anchor="middle" fill="#e74c3c" font-family="'Inter', system-ui, sans-serif" font-size="10">Visible gaps between segments</text>

<!-- Right: After (path-based, no gaps) -->
<text x="420" y="80" text-anchor="middle" fill="#27ae60" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="600">After: Path-based</text>

<!-- Donut without gaps (using paths) -->
<g transform="translate(420, 210)">
  <!-- Background circle -->
  <circle r="100" fill="none" stroke="#333333" stroke-width="36"/>
  <!-- Segments using path (perfect tiling) -->
  <path d="M 0 -100 A 100 100 0 0 1 95.1 -30.9 L 54.2 -17.7 A 58 58 0 0 0 0 -58 Z" fill="#f97316"/>
  <path d="M 95.1 -30.9 A 100 100 0 0 1 95.1 30.9 L 54.2 17.7 A 58 58 0 0 0 54.2 -17.7 Z" fill="#38bdf8"/>
  <path d="M 95.1 30.9 A 100 100 0 0 1 0 100 L 0 58 A 58 58 0 0 0 54.2 17.7 Z" fill="#a78bfa"/>
  <path d="M 0 100 A 100 100 0 0 1 -95.1 30.9 L -54.2 17.7 A 58 58 0 0 0 0 58 Z" fill="#22c55e"/>
  <path d="M -95.1 30.9 A 100 100 0 0 1 0 -100 L 0 -58 A 58 58 0 0 0 -54.2 17.7 Z" fill="#fb923c"/>
  <!-- Center -->
  <circle r="58" fill="#1a1a2e"/>
  <text x="0" y="5" text-anchor="middle" fill="#27ae60" font-size="11" font-weight="700">Perfect!</text>
</g>
<text x="420" y="340" text-anchor="middle" fill="#27ae60" font-family="'Inter', system-ui, sans-serif" font-size="10">No gaps, perfect tiling</text>

<!-- Arrow between -->
<path d="M 270 210 L 290 210" stroke="#888888" stroke-width="2" marker-end="url(#arrow)"/>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#888888"/>
  </marker>
</defs>

<!-- Source -->
<text x="280" y="365" text-anchor="middle" fill="#666666" font-family="'Inter', system-ui, sans-serif" font-size="9">Source: Firsthand testing of SVG rendering methods, 2026</text>
</svg>
