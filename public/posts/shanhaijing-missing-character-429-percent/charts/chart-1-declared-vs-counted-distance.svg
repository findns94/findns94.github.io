<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 652" width="760" height="652" role="img" aria-label="Dumbbell chart of declared versus counted distance for all 26 mountain chains of the Shanhaijing. Twenty-five chains sit within a few hundred li of each other. The North Third Chain of the Northern Mountains is the single outlier: 12,440 li counted against a declared 2,350 li, a gap of 10,090 li or 429 percent. Reading the declared value straight from the source text gives 12,350 li, which leaves a gap of only 90 li.">
<title>Declared vs. Counted Distance, All 26 Shanhaijing Mountain Chains</title>
<desc>Dumbbell chart of the 26 mountain chains in the Wuzang Shan Jing. Each row shows the distance declared by the chain summary sentence (grey dot) and the distance obtained by summing the individual entries (blue dot). Twenty-five of the 26 rows are short. The North Third Chain of the Northern Mountains is the exception: 12,440 li counted against a declared 2,350 li, a gap of +10,090 li or 429 percent. An amber hollow marker on that row shows the declared figure of 12,350 li exactly as the source text spells it, which leaves a gap of only 90 li. Source: Shanhaijing chain summaries and route reconciliation, findns.cc/shanhaijing, retrieved 2026-10-21.</desc>
