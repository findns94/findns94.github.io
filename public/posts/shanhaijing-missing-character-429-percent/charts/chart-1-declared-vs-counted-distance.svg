  }
  text { fill: var(--fg); font-family: 'Inter', system-ui, sans-serif; }
  .tick { fill: var(--fg-min); opacity: 0.6; }
  .lbl { fill: var(--fg-min); opacity: 0.9; }
  .op35 { fill: var(--fg-min); opacity: 0.35; }
  .grid { stroke: var(--track); stroke-width: 1; }
  .rowlabel { fill: var(--fg-min); opacity: 0.85; }
</style>
