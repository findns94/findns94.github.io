<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" style="max-width:100%;height:auto;font-family:'Inter',system-ui,sans-serif" role="img" aria-label="Horizontal bar chart showing 2024 returns by strategy in China A-shares. CSI Quality Dividend Index returned plus 22.1 percent, High ROE top quintile plus 19 to 21 percent, ROE plus Low P/B combo plus 18.4 percent, CSI 300 benchmark plus 14.6 percent, and Pure low-P/B plus 8.2 percent which underperformed the benchmark by 640 basis points.">
  <title>2024 Returns by Strategy — China A-Shares</title>
  <desc>Comparison of 2024 total returns for five strategies. CSI Quality Dividend Index (930955): +22.1%. High ROE top quintile: +19-21%. ROE + Low P/B combo: +18.4%. CSI 300 benchmark: +14.6%. Pure low-P/B: +8.2% (underperformed benchmark by 640bp). Sources: Huatai Securities, China Securities Index Co., CICC, 2024.</desc>

  <!-- Y axis (strategy labels on left) -->
  <line x1="150" y1="30" x2="150" y2="330" stroke="currentColor" opacity="0.3"/>
  <!-- X axis -->
  <line x1="150" y1="330" x2="530" y2="330" stroke="currentColor" opacity="0.3"/>

  <!-- X axis labels -->
  <text x="150" y="350" text-anchor="middle" font-size="9" fill="currentColor" opacity="0.7">0%</text>
  <text x="245" y="350" text-anchor="middle" font-size="9" fill="currentColor" opacity="0.7">5%</text>
  <text x="340" y="350" text-anchor="middle" font-size="9" fill="currentColor" opacity="0.7">10%</text>
  <text x="435" y="350" text-anchor="middle" font-size="9" fill="currentColor" opacity="0.7">15%</text>
  <text x="530" y="350" text-anchor="middle" font-size="9" fill="currentColor" opacity="0.7">20%+</text>

  <!-- X gridlines -->
  <line x1="150" y1="30" x2="150" y2="330" stroke="currentColor" opacity="0.06"/>
  <line x1="245" y1="30" x2="245" y2="330" stroke="currentColor" opacity="0.06"/>
  <line x1="340" y1="30" x2="340" y2="330" stroke="currentColor" opacity="0.06"/>
  <line x1="435" y1="30" x2="435" y2="330" stroke="currentColor" opacity="0.06"/>
  <line x1="530" y1="30" x2="530" y2="330" stroke="currentColor" opacity="0.06"/>

  <!-- Benchmark reference line at 14.6% -> x = 150 + (380*0.146) = 205.5 -->
  <line x1="205.5" y1="30" x2="205.5" y2="330" stroke="#f97316" stroke-width="1" opacity="0.5" stroke-dasharray="4,3"/>
  <text x="205.5" y="22" text-anchor="middle" font-size="8.5" fill="#f97316" opacity="0.8">CSI 300: 14.6%</text>

  <!-- Bar scale: 1% = 380/25 = 15.2px. Bar start x=150. -->
  <!-- Row height = 50px, bar height = 28px -->
  <!-- Row 1 (y top 40): CSI Quality Dividend 22.1% -> width = 22.1*15.2 = 336 -->
  <text x="142" y="58" text-anchor="end" font-size="10" fill="currentColor" opacity="0.85">CSI Quality Dividend</text>
  <rect x="150" y="40" width="336" height="28" rx="4" fill="#22c55e" opacity="0.9"/>
  <text x="492" y="58" text-anchor="start" font-size="11" fill="#22c55e" font-weight="700">+22.1%</text>

  <!-- Row 2 (y top 100): High ROE quintile 20% avg -> width = 20*15.2 = 304 -->
  <text x="142" y="118" text-anchor="end" font-size="10" fill="currentColor" opacity="0.85">High ROE (top quintile)</text>
  <rect x="150" y="100" width="304" height="28" rx="4" fill="#4ade80" opacity="0.8"/>
  <text x="460" y="118" text-anchor="start" font-size="11" fill="#4ade80" font-weight="700">+19-21%</text>

  <!-- Row 3 (y top 160): ROE + Low P/B combo 18.4% -> width = 18.4*15.2 = 280 -->
  <text x="142" y="178" text-anchor="end" font-size="10" fill="currentColor" opacity="0.85">ROE + Low P/B Combo</text>
  <rect x="150" y="160" width="280" height="28" rx="4" fill="#38bdf8" opacity="0.85"/>
  <text x="436" y="178" text-anchor="start" font-size="11" fill="#38bdf8" font-weight="700">+18.4%</text>

  <!-- Row 4 (y top 220): CSI 300 benchmark 14.6% -> width = 14.6*15.2 = 222 -->
  <text x="142" y="238" text-anchor="end" font-size="10" fill="currentColor" opacity="0.85">CSI 300 (benchmark)</text>
  <rect x="150" y="220" width="222" height="28" rx="4" fill="#f97316" opacity="0.7"/>
  <text x="378" y="238" text-anchor="start" font-size="11" fill="#f97316" font-weight="700">+14.6%</text>

  <!-- Row 5 (y top 280): Pure low-P/B 8.2% -> width = 8.2*15.2 = 125 -->
  <text x="142" y="298" text-anchor="end" font-size="10" fill="currentColor" opacity="0.85">Pure Low P/B</text>
  <rect x="150" y="280" width="125" height="28" rx="4" fill="#ef4444" opacity="0.8"/>
  <text x="281" y="298" text-anchor="start" font-size="11" fill="#ef4444" font-weight="700">+8.2%</text>

  <!-- Source -->
  <text x="150" y="370" font-size="8.5" fill="currentColor" opacity="0.45">Sources: Huatai Securities, China Securities Index Co., CICC. 2024.</text>
</svg>
