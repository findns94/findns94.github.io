<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-label="The three-phase shooting workflow: Plan your story arc, Capture B-roll and moments, Record your narration">
<title>The Three-Phase Travel Vlog Shooting Workflow</title>
<desc>A horizontal workflow diagram showing three phases of shooting a travel vlog: 1) Plan your story arc (morning, midday, evening), 2) Capture B-roll and moments (establishing shots, details, people), 3) Record your narration (voiceover, on-camera pieces).</desc>
<style>
  :root { --fg: #1f2937; --fg-min: #374151; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #f3f4f6; --fg-min: #9ca3af; }
  }
  text { fill: var(--fg); }
  .op5 { fill: var(--fg-min); opacity: 0.5; }
  .phase-title { font-weight: 700; }
  .phase-desc { fill: var(--fg-min); opacity: 0.85; }
  .accent { fill: #f59e0b; }
  .phase-bg { fill: #f59e0b; fill-opacity: 0.06; }
  @media (prefers-color-scheme: dark) {
    .phase-bg { fill: #1e293b; fill-opacity: 0.4; }
  }
  .arrow { fill: #f59e0b; opacity: 0.4; }
  .num { fill: #f59e0b; font-weight: 800; }
</style>
<text x="320" y="26" font-size="15" font-weight="700" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif">The Three-Phase Shooting Workflow</text>

<!-- Phase 1 -->
<g transform="translate(20, 50)">
  <rect width="175" height="175" rx="12" class="phase-bg" stroke="#f59e0b" stroke-opacity="0.2" stroke-width="1"/>
  <text class="num" x="20" y="36" font-size="28" font-family="'Segoe UI', system-ui, sans-serif">01</text>
  <g font-family="'Segoe UI', system-ui, sans-serif">
    <text class="phase-title" x="20" y="62" font-size="14">Plan Story Arc</text>
    <text class="phase-desc" x="20" y="84" font-size="11">Morning hook, midday</text>
    <text class="phase-desc" x="20" y="100" font-size="11">exploration, evening</text>
    <text class="phase-desc" x="20" y="116" font-size="11">reflection. Three-act</text>
    <text class="phase-desc" x="20" y="132" font-size="11">structure works.</text>
  </g>
  <!-- Story arc icon -->
  <g transform="translate(115, 135)" class="accent">
    <path d="M5 25 Q20 2 35 14 Q50 26 60 10" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="5" cy="25" r="3" fill="#f59e0b"/>
    <circle cx="35" cy="14" r="3" fill="#f59e0b"/>
    <circle cx="60" cy="10" r="3" fill="#f59e0b"/>
  </g>
</g>

<!-- Arrow 1 -->
<g transform="translate(200, 120)" class="arrow">
  <path d="M0 15 L30 15 M22 9 L30 15 L22 21" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- Phase 2 -->
<g transform="translate(240, 50)">
  <rect width="175" height="175" rx="12" class="phase-bg" stroke="#f59e0b" stroke-opacity="0.2" stroke-width="1"/>
  <text class="num" x="20" y="36" font-size="28" font-family="'Segoe UI', system-ui, sans-serif">02</text>
  <g font-family="'Segoe UI', system-ui, sans-serif">
    <text class="phase-title" x="20" y="62" font-size="14">Capture B-Roll</text>
    <text class="phase-desc" x="20" y="84" font-size="11">Establishing wide shots,</text>
    <text class="phase-desc" x="20" y="100" font-size="11">detail close-ups, local</text>
    <text class="phase-desc" x="20" y="116" font-size="11">life, transitions.</text>
    <text class="phase-desc" x="20" y="132" font-size="11">Shoot 10x what you need.</text>
  </g>
  <!-- Camera icon -->
  <g transform="translate(120, 130)" class="accent">
    <rect x="0" y="8" width="40" height="26" rx="5" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="20" cy="21" r="8" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="20" cy="21" r="3" fill="#f59e0b" opacity="0.5"/>
  </g>
</g>

<!-- Arrow 2 -->
<g transform="translate(420, 120)" class="arrow">
  <path d="M0 15 L30 15 M22 9 L30 15 L22 21" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- Phase 3 -->
<g transform="translate(460, 50)">
  <rect width="155" height="175" rx="12" class="phase-bg" stroke="#f59e0b" stroke-opacity="0.2" stroke-width="1"/>
  <text class="num" x="20" y="36" font-size="28" font-family="'Segoe UI', system-ui, sans-serif">03</text>
  <g font-family="'Segoe UI', system-ui, sans-serif">
    <text class="phase-title" x="20" y="62" font-size="14">Record Narration</text>
    <text class="phase-desc" x="20" y="84" font-size="11">Voiceover in quiet</text>
    <text class="phase-desc" x="20" y="100" font-size="11">space, on-camera</text>
    <text class="phase-desc" x="20" y="116" font-size="11">pieces to camera.</text>
    <text class="phase-desc" x="20" y="132" font-size="11">Authentic &gt; scripted.</text>
  </g>
  <!-- Mic icon -->
  <g transform="translate(100, 130)" class="accent">
    <rect x="14" y="0" width="12" height="28" rx="6" fill="#f59e0b" fill-opacity="0.3" stroke="#f59e0b" stroke-width="1.5"/>
    <path d="M8 22 Q8 34 20 34 Q32 34 32 22" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="20" y1="34" x2="20" y2="42" stroke="#f59e0b" stroke-width="1.5"/>
  </g>
</g>

<text class="op5" x="320" y="248" text-anchor="middle" font-size="10" font-family="'Segoe UI', system-ui, sans-serif">Source: creator workflow surveys &amp; filmmaking best practices, 2025</text>
</svg>
