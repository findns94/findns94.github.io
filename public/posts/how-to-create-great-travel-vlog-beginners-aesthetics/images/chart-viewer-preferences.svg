<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-label="What viewers value most in travel vlogs: Authenticity 78%, Visual quality 72%, Useful tips 68%, Story/narrative 61%, Personality 54%">
<title>What Viewers Value Most in Travel Vlogs</title>
<desc>Horizontal bar chart showing the percentage of travel video viewers who rank each element as important: Authenticity (78%), Visual quality (72%), Useful tips (68%), Story/narrative (61%), and Personality (54%).</desc>
<style>
  :root { --fg: #1f2937; --fg-min: #374151; --grid: rgba(0,0,0,0.06); }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #f3f4f6; --fg-min: #9ca3af; --grid: rgba(255,255,255,0.06); }
  }
  text { fill: var(--fg); }
  .tick { fill: var(--fg-min); opacity: 0.55; }
  .lbl { fill: var(--fg-min); opacity: 0.9; }
  .val { font-weight: 700; }
  .val-d { fill: var(--fg); }
  .val-l { fill: #ffffff; }
  .op5 { fill: var(--fg-min); opacity: 0.5; }
  .line-grid { stroke: var(--grid); stroke-width: 0.3; }
  .muted { fill: #64748b; }
  .accent { fill: #f59e0b; }
</style>
<text x="380" y="28" font-size="15" font-weight="700" text-anchor="middle">What Viewers Value Most in Travel Vlogs</text>
<text x="380" y="44" font-size="10" text-anchor="middle" class="op5">% of viewers who rank each element as "important" · Source: Google/ThinkGoogle, 2025</text>
<g>
  <line class="line-grid" x1="180" y1="60"  x2="580" y2="60"/>
  <line class="line-grid" x1="180" y1="108" x2="580" y2="108"/>
  <line class="line-grid" x1="180" y1="156" x2="580" y2="156"/>
  <line class="line-grid" x1="180" y1="204" x2="580" y2="204"/>
  <line class="line-grid" x1="180" y1="252" x2="580" y2="252"/>
  <line class="line-grid" x1="180" y1="300" x2="580" y2="300"/>
</g>
<text class="tick" x="174" y="64"  text-anchor="end" font-size="10">0</text>
<text class="tick" x="174" y="112" text-anchor="end" font-size="10">20</text>
<text class="tick" x="174" y="160" text-anchor="end" font-size="10">40</text>
<text class="tick" x="174" y="208" text-anchor="end" font-size="10">60</text>
<text class="tick" x="174" y="256" text-anchor="end" font-size="10">80</text>
<text class="tick" x="180" y="336" text-anchor="middle" font-size="10">0</text>
<text class="tick" x="280" y="336" text-anchor="middle" font-size="10">20</text>
<text class="tick" x="380" y="336" text-anchor="middle" font-size="10">40</text>
<text class="tick" x="480" y="336" text-anchor="middle" font-size="10">60</text>
<text class="tick" x="580" y="336" text-anchor="middle" font-size="10">80</text>
<g font-family="'Segoe UI', system-ui, sans-serif" font-size="12">
  <!-- Authenticity 78% -> (78/80)*400 = 390 -->
  <text class="lbl" x="170" y="74" text-anchor="end">Authenticity</text>
  <rect class="accent" x="180" y="62" width="390" height="20" rx="4"/>
  <text class="val val-l" x="562" y="77" text-anchor="end">78%</text>
  <!-- Visual quality 72% -> (72/80)*400 = 360 -->
  <text class="lbl" x="170" y="122" text-anchor="end">Visual quality</text>
  <rect class="muted" x="180" y="110" width="360" height="20" rx="4"/>
  <text class="val val-l" x="532" y="125" text-anchor="end">72%</text>
  <!-- Useful tips 68% -> (68/80)*400 = 340 -->
  <text class="lbl" x="170" y="170" text-anchor="end">Useful tips</text>
  <rect class="muted" x="180" y="158" width="340" height="20" rx="4"/>
  <text class="val val-l" x="512" y="173" text-anchor="end">68%</text>
  <!-- Story/narrative 61% -> (61/80)*400 = 305 -->
  <text class="lbl" x="170" y="218" text-anchor="end">Story / narrative</text>
  <rect class="muted" x="180" y="206" width="305" height="20" rx="4"/>
  <text class="val val-l" x="477" y="221" text-anchor="end">61%</text>
  <!-- Personality 54% -> (54/80)*400 = 270 -->
  <text class="lbl" x="170" y="266" text-anchor="end">Personality</text>
  <rect class="muted" x="180" y="254" width="270" height="20" rx="4"/>
  <text class="val val-l" x="442" y="269" text-anchor="end">54%</text>
</g>
<text class="op5" x="380" y="358" text-anchor="middle" font-size="10">Source: Google/ThinkGoogle Travel Insights, 2025</text>
</svg>
