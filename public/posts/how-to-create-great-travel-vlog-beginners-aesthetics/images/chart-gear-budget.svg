<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-label="Recommended beginner travel vlog gear budget: Camera/Smartphone 40%, Audio 25%, Stabilization 20%, Lighting 10%, Accessories 5%">
<title>Recommended Beginner Travel Vlog Gear Budget Allocation</title>
<desc>Donut chart showing how a beginner should allocate their travel vlog gear budget: Camera or Smartphone (40%), Audio (25%), Stabilization like gimbal (20%), Lighting (10%), and Accessories (5%).</desc>
<style>
  :root { --fg: #1f2937; --fg-min: #374151; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #f3f4f6; --fg-min: #9ca3af; }
  }
  text { fill: var(--fg); }
  .op5 { fill: var(--fg-min); opacity: 0.5; }
  .legend { fill: var(--fg-min); opacity: 0.9; }
  .accent { fill: #f59e0b; }
</style>
<text x="320" y="28" font-size="15" font-weight="700" text-anchor="middle">Beginner Travel Vlog Gear Budget</text>
<text x="320" y="44" font-size="10" text-anchor="middle" class="op5">Recommended allocation · Source: industry gear guides, 2025</text>
<g transform="translate(230, 200)">
  <!-- Donut segments: total 360 degrees -->
  <!-- Camera 40% = 144deg, Audio 25% = 90deg, Stabilization 20% = 72deg, Lighting 10% = 36deg, Accessories 5% = 18deg -->
  <!-- C = 2*pi*120 = 753.98. Each dash is exactly fraction*C so the five slices tile exactly 360 degrees. -->
  <circle r="120" fill="none" stroke="#f59e0b" stroke-width="40" stroke-dasharray="301.6 753.98" stroke-dashoffset="0" transform="rotate(-90)"/>
  <circle r="120" fill="none" stroke="#6366f1" stroke-width="40" stroke-dasharray="188.5 753.98" stroke-dashoffset="-301.6" transform="rotate(-90)"/>
  <circle r="120" fill="none" stroke="#10b981" stroke-width="40" stroke-dasharray="150.8 753.98" stroke-dashoffset="-490.1" transform="rotate(-90)"/>
  <circle r="120" fill="none" stroke="#ef4444" stroke-width="40" stroke-dasharray="75.4 753.98" stroke-dashoffset="-640.9" transform="rotate(-90)"/>
  <circle r="120" fill="none" stroke="#8b5cf6" stroke-width="40" stroke-dasharray="37.7 753.98" stroke-dashoffset="-716.3" transform="rotate(-90)"/>
  <circle r="70" fill="#0f172a" opacity="0.15"/>
  <text text-anchor="middle" y="-6" font-size="11" font-weight="600" fill="#9ca3af">Total</text>
  <text text-anchor="middle" y="16" font-size="20" font-weight="800" fill="#22c55e">$500–1K</text>
</g>
<g font-family="'Segoe UI', system-ui, sans-serif" font-size="12">
  <rect x="480" y="100" width="14" height="14" rx="3" fill="#f59e0b"/>
  <text class="legend" x="502" y="112">Camera / Smartphone — 40%</text>
  <rect x="480" y="128" width="14" height="14" rx="3" fill="#6366f1"/>
  <text class="legend" x="502" y="140">Audio (mic) — 25%</text>
  <rect x="480" y="156" width="14" height="14" rx="3" fill="#10b981"/>
  <text class="legend" x="502" y="168">Stabilization (gimbal) — 20%</text>
  <rect x="480" y="184" width="14" height="14" rx="3" fill="#ef4444"/>
  <text class="legend" x="502" y="196">Lighting — 10%</text>
  <rect x="480" y="212" width="14" height="14" rx="3" fill="#8b5cf6"/>
  <text class="legend" x="502" y="224">Accessories — 5%</text>
</g>
<text class="op5" x="320" y="358" text-anchor="middle" font-size="10">Source: industry gear guides &amp; creator surveys, 2025</text>
</svg>
