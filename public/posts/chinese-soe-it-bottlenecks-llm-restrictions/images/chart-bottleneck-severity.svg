<svg viewBox="0 0 560 380" xmlns="http://www.w3.org/2000/svg" style="max-width: 100%; height: auto; font-family: 'Inter', system-ui, sans-serif" role="img" aria-label="Horizontal bar chart showing the four IT bottleneck severity scores for Chinese SOEs in 2026">
  <title>Chinese SOE IT Bottleneck Severity Scores (2026)</title>
  <desc>Bar chart showing: Domestic GPU scarcity 8.7/10, Data silo accessibility 7.9/10, AI talent gap 7.4/10, Model capability gap 6.8/10</desc>

  <!-- Grid lines -->
  <line x1="180" y1="50" x2="180" y2="320" stroke="currentColor" opacity="0.08" />
  <line x1="260" y1="50" x2="260" y2="320" stroke="currentColor" opacity="0.08" />
  <line x1="340" y1="50" x2="340" y2="320" stroke="currentColor" opacity="0.08" />
  <line x1="420" y1="50" x2="420" y2="320" stroke="currentColor" opacity="0.08" />
  <line x1="500" y1="50" x2="500" y2="320" stroke="currentColor" opacity="0.08" />

  <!-- X axis line -->
  <line x1="120" y1="320" x2="540" y2="320" stroke="currentColor" opacity="0.3" />

  <!-- Bar 1: GPU scarcity 8.7 -->
  <rect x="120" y="70" width="365" height="40" rx="4" fill="#ef4444" />
  <text x="115" y="95" text-anchor="end" font-size="11" fill="currentColor" opacity="0.8">Domestic GPU scarcity</text>
  <text x="500" y="95" font-size="12" font-weight="800" fill="white">8.7</text>

  <!-- Bar 2: Data silos 7.9 -->
  <rect x="120" y="130" width="332" height="40" rx="4" fill="#f97316" />
  <text x="115" y="155" text-anchor="end" font-size="11" fill="currentColor" opacity="0.8">Data silo accessibility</text>
  <text x="467" y="155" font-size="12" font-weight="800" fill="white">7.9</text>

  <!-- Bar 3: Talent gap 7.4 -->
  <rect x="120" y="190" width="311" height="40" rx="4" fill="#38bdf8" />
  <text x="115" y="215" text-anchor="end" font-size="11" fill="currentColor" opacity="0.8">AI talent gap</text>
  <text x="446" y="215" font-size="12" font-weight="800" fill="white">7.4</text>

  <!-- Bar 4: Model capability 6.8 -->
  <rect x="120" y="250" width="286" height="40" rx="4" fill="#a78bfa" />
  <text x="115" y="275" text-anchor="end" font-size="11" fill="currentColor" opacity="0.8">Model capability gap</text>
  <text x="421" y="275" font-size="12" font-weight="800" fill="white">6.8</text>

  <!-- Scale label -->
  <text x="330" y="350" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.5">Severity Score (0-10) — Higher = More Constraining</text>
  <text x="280" y="372" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.35">Source: CAICT SOE Digital Transformation Survey; China Enterprise Confederation (2025)</text>
</svg>