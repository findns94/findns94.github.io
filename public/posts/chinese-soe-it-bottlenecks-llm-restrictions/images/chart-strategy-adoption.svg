<svg viewBox="0 0 560 380" xmlns="http://www.w3.org/2000/svg" style="max-width: 100%; height: auto; font-family: 'Inter', system-ui, sans-serif" role="img" aria-label="Grouped bar chart showing adoption rates of three SOE AI strategies in 2025 versus projected 2028">
  <title>SOE AI Strategy Adoption: 2025 vs Projected 2028</title>
  <desc>Grouped bar chart comparing: Private infrastructure 22% to 45%, Domestic cloud partnership 38% to 52%, Edge deployment 15% to 38%</desc>

  <!-- Grid lines -->
  <line x1="100" y1="60" x2="100" y2="290" stroke="currentColor" opacity="0.08" />
  <line x1="100" y1="120" x2="500" y2="120" stroke="currentColor" opacity="0.06" />
  <line x1="100" y1="180" x2="500" y2="180" stroke="currentColor" opacity="0.06" />
  <line x1="100" y1="240" x2="500" y2="240" stroke="currentColor" opacity="0.06" />

  <!-- Y axis labels -->
  <text x="95" y="65" text-anchor="end" font-size="9" fill="currentColor" opacity="0.5">60%</text>
  <text x="95" y="125" text-anchor="end" font-size="9" fill="currentColor" opacity="0.5">45%</text>
  <text x="95" y="185" text-anchor="end" font-size="9" fill="currentColor" opacity="0.5">30%</text>
  <text x="95" y="245" text-anchor="end" font-size="9" fill="currentColor" opacity="0.5">15%</text>
  <text x="95" y="295" text-anchor="end" font-size="9" fill="currentColor" opacity="0.5">0%</text>

  <!-- Group 1: Private Infrastructure -->
  <rect x="130" y="198" width="50" height="92" rx="4" fill="#38bdf8" />
  <rect x="190" y="135" width="50" height="155" rx="4" fill="#0284c7" />
  <text x="155" y="295" text-anchor="middle" font-size="8" fill="currentColor" opacity="0.6">22%</text>
  <text x="215" y="305" text-anchor="middle" font-size="8" fill="currentColor" opacity="0.6">45%</text>

  <!-- Group 2: Domestic Cloud -->
  <rect x="270" y="156" width="50" height="134" rx="4" fill="#a78bfa" />
  <rect x="330" y="114" width="50" height="176" rx="4" fill="#7c3aed" />
  <text x="295" y="295" text-anchor="middle" font-size="8" fill="currentColor" opacity="0.6">38%</text>
  <text x="355" y="305" text-anchor="middle" font-size="8" fill="currentColor" opacity="0.6">52%</text>

  <!-- Group 3: Edge Deployment -->
  <rect x="410" y="222" width="50" height="68" rx="4" fill="#22c55e" />
  <rect x="470" y="174" width="50" height="116" rx="4" fill="#16a34a" />
  <text x="435" y="295" text-anchor="middle" font-size="8" fill="currentColor" opacity="0.6">15%</text>
  <text x="495" y="305" text-anchor="middle" font-size="8" fill="currentColor" opacity="0.6">38%</text>

  <!-- Category labels -->
  <text x="215" y="330" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.7">Private Infrastructure</text>
  <text x="355" y="330" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.7">Domestic Cloud</text>
  <text x="495" y="330" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.7">Edge Deployment</text>

  <!-- Legend -->
  <rect x="160" y="345" width="12" height="12" rx="2" fill="#38bdf8" />
  <text x="178" y="355" font-size="9" fill="currentColor" opacity="0.6">2025 (Current)</text>
  <rect x="290" y="345" width="12" height="12" rx="2" fill="#0284c7" />
  <text x="308" y="355" font-size="9" fill="currentColor" opacity="0.6">2028 (Projected)</text>

  <text x="280" y="372" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.35">Source: IDC China Enterprise AI Survey; CAICT (2025)</text>
</svg>