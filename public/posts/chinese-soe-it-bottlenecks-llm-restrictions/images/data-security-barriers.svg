<svg viewBox="0 0 560 420" xmlns="http://www.w3.org/2000/svg" style="max-width: 100%; height: auto; font-family: 'Inter', system-ui, sans-serif" role="img" aria-label="Diagram showing three overlapping regulatory barriers that prevent Chinese SOEs from using external LLM APIs">
  <title>Three Regulatory Barriers Blocking External LLM API Usage for Chinese SOEs</title>
  <desc>Three-circle Venn diagram showing: Data Security Law (data localization), Generative AI Measures (licensing), and State Secrets Law (confidentiality) — with the overlap labeled "No External API Access"</desc>

  <!-- Background -->
  <rect width="560" height="420" rx="8" fill="transparent" />

  <!-- Three overlapping circles -->
  <!-- Circle 1: Data Security Law (left) -->
  <circle cx="180" cy="170" r="110" fill="#ef4444" opacity="0.12" stroke="#ef4444" stroke-width="2" stroke-opacity="0.4" />
  <text x="180" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#ef4444" opacity="0.9">Data Security Law</text>
  <text x="180" y="118" text-anchor="middle" font-size="9" fill="currentColor" opacity="0.6">Data localization</text>
  <text x="180" y="132" text-anchor="middle" font-size="9" fill="currentColor" opacity="0.6">requirements</text>
  <text x="180" y="146" text-anchor="middle" font-size="9" fill="currentColor" opacity="0.6">(重要数据)</text>

  <!-- Circle 2: Gen AI Measures (right) -->
  <circle cx="380" cy="170" r="110" fill="#f97316" opacity="0.12" stroke="#f97316" stroke-width="2" stroke-opacity="0.4" />
  <text x="380" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#f97316" opacity="0.9">Gen AI Measures</text>
  <text x="380" y="118" text-anchor="middle" font-size="9" fill="currentColor" opacity="0.6">Public AI services</text>
  <text x="380" y="132" text-anchor="middle" font-size="9" fill="currentColor" opacity="0.6">require licensing</text>
  <text x="380" y="146" text-anchor="middle" font-size="9" fill="currentColor" opacity="0.6">(生成式AI暂行办法)</text>

  <!-- Circle 3: State Secrets Law (bottom center) -->
  <circle cx="280" cy="270" r="110" fill="#a78bfa" opacity="0.12" stroke="#a78bfa" stroke-width="2" stroke-opacity="0.4" />
  <text x="280" y="240" text-anchor="middle" font-size="11" font-weight="700" fill="#a78bfa" opacity="0.9">State Secrets Law</text>
  <text x="280" y="258" text-anchor="middle" font-size="9" fill="currentColor" opacity="0.6">Criminal liability for</text>
  <text x="280" y="272" text-anchor="middle" font-size="9" fill="currentColor" opacity="0.6">mishandling classified data</text>
  <text x="280" y="286" text-anchor="middle" font-size="9" fill="currentColor" opacity="0.6">(保守国家秘密法)</text>

  <!-- Center overlap label -->
  <rect x="210" y="185" width="140" height="50" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <text x="280" y="205" text-anchor="middle" font-size="10" font-weight="800" fill="#f8fafc">No External</text>
  <text x="280" y="222" text-anchor="middle" font-size="10" font-weight="800" fill="#f8fafc">API Access</text>

  <!-- Bottom annotation -->
  <text x="280" y="370" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.5">73% of SOE IT leaders cite data security as the top AI adoption barrier</text>
  <text x="280" y="390" text-anchor="middle" font-size="9" fill="currentColor" opacity="0.35">Source: CAICT SOE AI Adoption Survey (2025)</text>
</svg>