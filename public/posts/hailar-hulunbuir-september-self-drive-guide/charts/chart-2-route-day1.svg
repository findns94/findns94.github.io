<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Chart: Day 1 itinerary timeline from Hailar Airport to Genhe showing departure, fuel stops, lunch, arrival, and afternoon activities">
  <title>Day 1 Itinerary: Hailar Airport to Genhe Wetland Park</title>
  <desc>Timeline chart showing the Day 1 driving route from Hailar Airport departing at 10:00 AM, passing through Ewenki Banner and Yakeshi for fuel and lunch, arriving in Genhe city, then visiting the wetland park in the afternoon.</desc>
  <style>
    text { font-family: 'Inter', system-ui, sans-serif; fill: currentColor; }
    .line { stroke: currentColor; stroke-width: 2; opacity: 0.3; }
    .stop { font-weight: 600; }
  </style>
  <rect width="800" height="500" fill="transparent"/>
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-size="16" font-weight="600">Day 1: Hailar Airport → Genhe Wetland Park</text>
  <text x="400" y="55" text-anchor="middle" font-size="12" opacity="0.7">~240 km via G332 · 3.5 hours driving · Depart 10:00 AM</text>
  <!-- Timeline line -->
  <line x1="80" y1="250" x2="750" y2="250" stroke="#3A86FF" stroke-width="3" opacity="0.6"/>
  <!-- Stop 1: Hailar Airport -->
  <circle cx="100" cy="250" r="8" fill="#3A86FF"/>
  <text x="100" y="220" text-anchor="middle" font-size="13" class="stop">Hailar Airport</text>
  <text x="100" y="238" text-anchor="middle" font-size="11" opacity="0.7">10:00 Depart</text>
  <!-- Stop 2: Ewenki Banner -->
  <circle cx="220" cy="250" r="6" fill="#E85D04"/>
  <text x="220" y="220" text-anchor="middle" font-size="11" class="stop">Ewenki Banner</text>
  <text x="220" y="238" text-anchor="middle" font-size="10" opacity="0.7">~30km · Fuel stop</text>
  <!-- Stop 3: Yakeshi -->
  <circle cx="370" cy="250" r="8" fill="#2A9D8F"/>
  <text x="370" y="220" text-anchor="middle" font-size="13" class="stop">Yakeshi City</text>
  <text x="370" y="238" text-anchor="middle" font-size="11" opacity="0.7">~130km · Lunch + Fuel</text>
  <text x="370" y="290" text-anchor="middle" font-size="10" fill="#2A9D8F">Recommended stop</text>
  <!-- Stop 4: Genhe City -->
  <circle cx="510" cy="250" r="8" fill="#2A9D8F"/>
  <text x="510" y="220" text-anchor="middle" font-size="13" class="stop">Genhe City</text>
  <text x="510" y="238" text-anchor="middle" font-size="11" opacity="0.7">~230km · Arrive 13:30</text>
  <!-- Stop 5: Wetland Park -->
  <circle cx="630" cy="250" r="8" fill="#E85D04"/>
  <text x="630" y="220" text-anchor="middle" font-size="13" class="stop">Wetland Park</text>
  <text x="630" y="238" text-anchor="middle" font-size="11" opacity="0.7">14:30-16:30 · Photo</text>
  <!-- Evening -->
  <circle cx="730" cy="250" r="6" fill="#6C757D"/>
  <text x="730" y="220" text-anchor="middle" font-size="11" class="stop">Dinner</text>
  <text x="730" y="238" text-anchor="middle" font-size="10" opacity="0.7">Hot pot / Iron pot stew</text>
  <!-- Distance markers -->
  <text x="160" y="275" text-anchor="middle" font-size="9" opacity="0.5">30km</text>
  <text x="295" y="275" text-anchor="middle" font-size="9" opacity="0.5">100km</text>
  <text x="440" y="275" text-anchor="middle" font-size="9" opacity="0.5">100km</text>
  <text x="570" y="275" text-anchor="middle" font-size="9" opacity="0.5">~10km</text>
  <!-- Driving time indicators -->
  <rect x="100" y="310" width="120" height="20" fill="#3A86FF" opacity="0.15" rx="4"/>
  <text x="160" y="324" text-anchor="middle" font-size="9">Drive ~25 min</text>
  <rect x="220" y="310" width="150" height="20" fill="#3A86FF" opacity="0.15" rx="4"/>
  <text x="295" y="324" text-anchor="middle" font-size="9">Drive ~1 hr 15 min</text>
  <rect x="370" y="310" width="140" height="20" fill="#3A86FF" opacity="0.15" rx="4"/>
  <text x="440" y="324" text-anchor="middle" font-size="9">Drive ~1 hr 15 min</text>
  <rect x="510" y="310" width="120" height="20" fill="#3A86FF" opacity="0.15" rx="4"/>
  <text x="570" y="324" text-anchor="middle" font-size="9">Drive ~10 min</text>
  <!-- Key info box -->
  <rect x="80" y="360" width="660" height="100" fill="transparent" stroke="currentColor" stroke-width="1" opacity="0.2" rx="8"/>
  <text x="100" y="385" font-size="12" font-weight="600">Key Stops Summary:</text>
  <text x="100" y="405" font-size="11">⛽ Fuel: Fill up in Hailar, top up at Yakeshi (130km mark, most reliable station)</text>
  <text x="100" y="425" font-size="11">🍽 Lunch: Yakeshi city — local iron pot stew or hand-grab mutton (~60-90 RMB/person)</text>
  <text x="100" y="445" font-size="11">📸 Photo: Wetland Park overlook deck — best light 15:00-17:00 for golden hour on the river bends</text>
  <!-- Source -->
  <text x="400" y="485" text-anchor="middle" font-size="9" opacity="0.5">Source: Amap/Baidu Maps route data, 2025; Genhe Tourism Bureau</text>
</svg>