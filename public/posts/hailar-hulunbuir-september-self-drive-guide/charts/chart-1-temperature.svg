<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Chart: Hailar mid-September daily temperature range showing high and low temperatures with 15-20°C diurnal swing">
  <title>Hailar Mid-September Daily Temperature Range</title>
  <desc>Line chart showing average daily high and low temperatures in Hailar during September. Highs range from 20°C early month to 12°C late month. Lows range from 6°C to near 0°C. The diurnal temperature swing reaches 15-20°C.</desc>
  <style>
    text { font-family: 'Inter', system-ui, sans-serif; fill: currentColor; }
    .axis { stroke: currentColor; stroke-width: 1; opacity: 0.3; }
    .grid { stroke: currentColor; stroke-width: 0.5; opacity: 0.15; }
  </style>
  <!-- Background -->
  <rect width="800" height="450" fill="transparent"/>
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-size="16" font-weight="600">Hailar Daily Temperature in September</text>
  <text x="400" y="55" text-anchor="middle" font-size="12" opacity="0.7">Diurnal swing: 15-20°C — pack for all seasons in one day</text>
  <!-- Y-axis -->
  <line x1="70" y1="80" x2="70" y2="370" class="axis"/>
  <text x="60" y="85" text-anchor="end" font-size="11">25°C</text>
  <text x="60" y="150" text-anchor="end" font-size="11">20°C</text>
  <text x="60" y="215" text-anchor="end" font-size="11">15°C</text>
  <text x="60" y="280" text-anchor="end" font-size="11">10°C</text>
  <text x="60" y="345" text-anchor="end" font-size="11">5°C</text>
  <text x="60" y="375" text-anchor="end" font-size="11">0°C</text>
  <!-- Grid lines -->
  <line x1="70" y1="150" x2="750" y2="150" class="grid"/>
  <line x1="70" y1="215" x2="750" y2="215" class="grid"/>
  <line x1="70" y1="280" x2="750" y2="280" class="grid"/>
  <line x1="70" y1="345" x2="750" y2="345" class="grid"/>
  <!-- X-axis -->
  <line x1="70" y1="370" x2="750" y2="370" class="axis"/>
  <text x="120" y="395" text-anchor="middle" font-size="11">Sep 1</text>
  <text x="230" y="395" text-anchor="middle" font-size="11">Sep 5</text>
  <text x="340" y="395" text-anchor="middle" font-size="11">Sep 10</text>
  <text x="450" y="395" text-anchor="middle" font-size="11">Sep 15</text>
  <text x="560" y="395" text-anchor="middle" font-size="11">Sep 20</text>
  <text x="670" y="395" text-anchor="middle" font-size="11">Sep 25</text>
  <text x="730" y="395" text-anchor="middle" font-size="11">Sep 30</text>
  <!-- High temperature line (orange/red) -->
  <polyline points="120,130 175,135 230,140 285,148 340,155 395,165 450,175 505,185 560,195 615,205 670,215 730,225" fill="none" stroke="#E85D04" stroke-width="2.5"/>
  <!-- Low temperature line (blue) -->
  <polyline points="120,290 175,295 230,300 285,308 340,315 395,325 450,335 505,342 560,350 615,355 670,360 730,365" fill="none" stroke="#3A86FF" stroke-width="2.5"/>
  <!-- Fill between lines (temperature swing area) -->
  <polygon points="120,130 175,135 230,140 285,148 340,155 395,165 450,175 505,185 560,195 615,205 670,215 730,225 730,365 670,360 615,355 560,350 505,342 450,335 395,325 340,315 285,308 230,300 175,295 120,290" fill="#E85D04" opacity="0.08"/>
  <!-- Legend -->
  <circle cx="250" cy="420" r="5" fill="#E85D04"/>
  <text x="260" y="424" font-size="11">Daily High</text>
  <circle cx="370" cy="420" r="5" fill="#3A86FF"/>
  <text x="380" y="424" font-size="11">Daily Low</text>
  <rect x="500" y="415" width="12" height="12" fill="#E85D04" opacity="0.2"/>
  <text x="518" y="424" font-size="11">Diurnal Swing (15-20°C)</text>
  <!-- Frost risk zone -->
  <rect x="540" y="355" width="210" height="20" fill="#3A86FF" opacity="0.1" rx="3"/>
  <text x="645" y="369" text-anchor="middle" font-size="10" fill="#3A86FF">Frost Risk Zone</text>
  <!-- Source -->
  <text x="400" y="445" text-anchor="middle" font-size="9" opacity="0.5">Source: China Meteorological Administration historical data, 2020-2025 average</text>
</svg>