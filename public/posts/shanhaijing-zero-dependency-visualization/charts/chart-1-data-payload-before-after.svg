<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-label="Grouped horizontal bar chart comparing the raw JSON payload each Shanhaijing view had to download before the split (6,322.8 KB from a single data.json) with the per-view file it downloads after the split; the panorama view drops to 722.1 KB, the map view to 720.9 KB, and the hub overview to zero.">
<title>First-paint JSON payload before and after splitting data.json</title>
<desc>Before the split, all six Shanhaijing views fetched the same 6,322.8 KB data.json. After the split, panorama fetches 722.1 KB (539.1 KB panorama-data.json + 183.0 KB panorama-layout.json), map fetches 720.9 KB, search 755.5 KB, knowledge graph 5,543.7 KB, entity detail 5,856.3 KB, and the hub overview fetches nothing because entity type counts are frozen into a TypeScript constant at build time. Gzipped sizes are annotated on each bar.</desc>
<rect x="0" y="0" width="780" height="470" fill="#1a1a2e" rx="12"/>
<text x="390.0" y="34" text-anchor="middle" fill="#e0e0e0" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="600">One 6.2 MB file, six views: payload before vs after splitting</text>
<text x="390.0" y="55" text-anchor="middle" fill="#888888" font-family="'Inter', system-ui, sans-serif" font-size="11">Raw JSON downloaded per Shanhaijing view (KB, linear scale). Gzipped size annotated on each bar.</text>
<line x1="322.6" y1="86" x2="322.6" y2="368" stroke="#33334d" stroke-width="1" stroke-dasharray="3 4"/>
<text x="322.6" y="384" text-anchor="middle" fill="#666680" font-family="'Inter', system-ui, sans-serif" font-size="9">2,000</text>
