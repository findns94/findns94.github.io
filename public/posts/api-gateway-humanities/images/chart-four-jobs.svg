<svg viewBox="0 0 560 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lollipop chart showing the four core jobs of an API gateway and how they map onto humanities metaphors: authentication maps to bouncers, rate limiting to switchboards, protocol translation to interpreters, and logging to archives">
  <rect width="560" height="380" fill="#0d1117" rx="12"/>
  <text x="280" y="32" fill="#c9d1d9" font-family="system-ui,sans-serif" font-size="15" font-weight="600" text-anchor="middle">The Four Jobs of an API Gateway</text>
  <text x="280" y="50" fill="#8b949e" font-family="system-ui,sans-serif" font-size="11" text-anchor="middle">And the humanities metaphors each one maps onto</text>

  <!-- y axis baseline -->
  <line x1="200" y1="80" x2="200" y2="300" stroke="#30363d" stroke-width="1"/>

  <!-- Job 1: Authentication -->
  <line x1="200" y1="110" x2="470" y2="110" stroke="#58a6ff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="470" cy="110" r="9" fill="#58a6ff" stroke="#0d1117" stroke-width="2"/>
  <text x="190" y="114" fill="#c9d1d9" font-family="system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="end">Authentication</text>
  <text x="485" y="114" fill="#e6edf3" font-family="system-ui,sans-serif" font-size="13" font-weight="700">bouncer</text>

  <!-- Job 2: Rate limiting -->
  <line x1="200" y1="160" x2="430" y2="160" stroke="#f0883e" stroke-width="3" stroke-linecap="round"/>
  <circle cx="430" cy="160" r="9" fill="#f0883e" stroke="#0d1117" stroke-width="2"/>
  <text x="190" y="164" fill="#c9d1d9" font-family="system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="end">Rate limiting</text>
  <text x="445" y="164" fill="#e6edf3" font-family="system-ui,sans-serif" font-size="13" font-weight="700">switchboard</text>

  <!-- Job 3: Protocol translation -->
  <line x1="200" y1="210" x2="395" y2="210" stroke="#d2a8ff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="395" cy="210" r="9" fill="#d2a8ff" stroke="#0d1117" stroke-width="2"/>
  <text x="190" y="214" fill="#c9d1d9" font-family="system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="end">Translation</text>
  <text x="410" y="214" fill="#e6edf3" font-family="system-ui,sans-serif" font-size="13" font-weight="700">interpreter</text>

  <!-- Job 4: Logging -->
  <line x1="200" y1="260" x2="360" y2="260" stroke="#3fb950" stroke-width="3" stroke-linecap="round"/>
  <circle cx="360" cy="260" r="9" fill="#3fb950" stroke="#0d1117" stroke-width="2"/>
  <text x="190" y="264" fill="#c9d1d9" font-family="system-ui,sans-serif" font-size="13" font-weight="600" text-anchor="end">Logging</text>
  <text x="375" y="264" fill="#e6edf3" font-family="system-ui,sans-serif" font-size="13" font-weight="700">archive</text>

  <!-- metaphor label -->
  <text x="280" y="325" fill="#8b949e" font-family="system-ui,sans-serif" font-size="11" text-anchor="middle">98% of organizations experienced API security problems in 12 months (Salt Security, 2024) — these four jobs are why gateways exist.</text>

  <!-- legend -->
  <rect x="40" y="344" width="12" height="12" rx="2" fill="#58a6ff"/>
  <text x="58" y="355" fill="#c9d1d9" font-family="system-ui,sans-serif" font-size="11">Outbound metaphor strength (relative)</text>
</svg>
