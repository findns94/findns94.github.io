<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 560 380"
  style="max-width: 100%; height: auto; font-family: 'Inter', system-ui, sans-serif"
  role="img"
  aria-labelledby="chart-title chart-desc"
>
  <title id="chart-title">Prediction Confidence Drop After Adversarial Perturbation</title>
  <desc id="chart-desc">Grouped lollipop chart comparing original versus adversarial top-1 prediction confidence across two test cases. For the PTB language model, the "was" to "being" substitution drops top-1 confidence from 0.082 to 0.041. For the seq2seq corrector, the "s" to "b" substitution drops top-1 confidence from 0.71 to 0.33. Both adversarial perturbations roughly halve the model's confidence in its top prediction. Source: Author's experiment, PTB and seq2seq adversarial tests, 2018.</desc>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor">Prediction Confidence Drop After Adversarial Perturbation</text>

  <!-- Legend -->
  <circle cx="410" cy="50" r="6" fill="#f97316"/>
  <text x="422" y="54" font-size="11" fill="currentColor" opacity="0.8">Original</text>
  <circle cx="482" cy="50" r="6" fill="#38bdf8"/>
  <text x="494" y="54" font-size="11" fill="currentColor" opacity="0.8">Adversarial</text>

  <!-- Y axis -->
  <line x1="200" y1="80" x2="200" y2="340" stroke="currentColor" opacity="0.3"/>

  <!-- Vertical grid lines at 0, 0.2, 0.4, 0.6, 0.8 -->
  <line x1="200" y1="80" x2="200" y2="340" stroke="currentColor" opacity="0.08"/>
  <line x1="282.5" y1="80" x2="282.5" y2="340" stroke="currentColor" opacity="0.08"/>
  <line x1="365" y1="80" x2="365" y2="340" stroke="currentColor" opacity="0.08"/>
  <line x1="447.5" y1="80" x2="447.5" y2="340" stroke="currentColor" opacity="0.08"/>
  <line x1="530" y1="80" x2="530" y2="340" stroke="currentColor" opacity="0.08"/>

  <!-- X axis value labels -->
  <text x="200" y="356" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.8">0.0</text>
  <text x="282.5" y="356" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.8">0.2</text>
  <text x="365" y="356" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.8">0.4</text>
  <text x="447.5" y="356" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.8">0.6</text>
  <text x="530" y="356" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.8">0.8</text>

  <!-- X axis label -->
  <text x="365" y="372" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.8">Top-1 Prediction Confidence</text>

  <!-- Row 1: was to being (PTB) -->
  <text x="195" y="178" text-anchor="end" font-size="11" fill="currentColor" opacity="0.8">was to being (PTB)</text>
  <!-- Original: 0.082 -->
  <line x1="200" y1="166" x2="234" y2="166" stroke="#f97316" stroke-width="2"/>
  <circle cx="234" cy="166" r="6" fill="#f97316"/>
  <text x="243" y="170" font-size="10" fill="currentColor" opacity="0.8">0.082</text>
  <!-- Adversarial: 0.041 -->
  <line x1="200" y1="190" x2="217" y2="190" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="217" cy="190" r="6" fill="#38bdf8"/>
  <text x="226" y="194" font-size="10" fill="currentColor" opacity="0.8">0.041</text>

  <!-- Row 2: s to b (seq2seq) -->
  <text x="195" y="298" text-anchor="end" font-size="11" fill="currentColor" opacity="0.8">s to b (seq2seq)</text>
  <!-- Original: 0.71 -->
  <line x1="200" y1="286" x2="493" y2="286" stroke="#f97316" stroke-width="2"/>
  <circle cx="493" cy="286" r="6" fill="#f97316"/>
  <text x="502" y="290" font-size="10" fill="currentColor" opacity="0.8">0.71</text>
  <!-- Adversarial: 0.33 -->
  <line x1="200" y1="310" x2="336" y2="310" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="336" cy="310" r="6" fill="#38bdf8"/>
  <text x="345" y="314" font-size="10" fill="currentColor" opacity="0.8">0.33</text>

  <!-- Source -->
  <text x="280" y="372" text-anchor="middle" font-size="10" fill="var(--chart-muted, currentColor)">Source: Author's experiment, PTB and seq2seq adversarial tests, 2018</text>
</svg>
