<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Shanghai School District Housing — Is It Worth Buying in 2026?">
  <title>Shanghai School District Housing — 10-Year Outlook for Young Couples, 2026-2036</title>
  <desc>A stylized Shanghai skyline at dusk with a graduation cap, representing the 2026 school-district housing landscape and education policy intersection.</desc>
  <style>
    :root {
      --fg: #f3f4f6;
      --fg-min: #94a3b8;
      --grid: rgba(255,255,255,0.06);
      --axis: rgba(255,255,255,0.25);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --fg: #0f172a;
        --fg-min: #475569;
        --grid: rgba(15,23,42,0.06);
        --axis: rgba(15,23,42,0.25);
      }
    }
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      fill: var(--fg);
    }
    .tick   { fill: var(--fg-min); opacity: 0.55; }
    .lbl    { fill: var(--fg-min); opacity: 0.85; }
    .op40   { fill: var(--fg-min); opacity: 0.4; }
    .op60   { fill: var(--fg-min); opacity: 0.6; }
    .line-grid { stroke: var(--grid); stroke-width: 0.4; }
    .axis     { stroke: var(--axis); stroke-width: 1; }
  </style>
  <defs>
    <!-- sky gradient: deep navy → blue -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#16243a"/>
      <stop offset="1"   stop-color="#1e3a5f"/>
    </linearGradient>
    <!-- warm horizon glow -->
    <radialGradient id="glow" cx="50%" cy="78%" r="55%">
      <stop offset="0"   stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#f59e0b" stop-opacity="0.07"/>
      <stop offset="1"   stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <!-- water / ground gradient -->
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#0e1a2b"/>
      <stop offset="1"   stop-color="#060c16"/>
    </linearGradient>
    <!-- gold accent gradient for the cap -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#fbbf24"/>
      <stop offset="1"   stop-color="#f59e0b"/>
    </linearGradient>
    <!-- subtle text sheen -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#fef3c7"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1"   stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="1200" height="630" fill="url(#sky)"/>
  <!-- horizon glow -->
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- faint grid lines (chart-style texture) -->
  <g class="line-grid">
    <line x1="0" y1="120"  x2="1200" y2="120"/>
    <line x1="0" y1="200"  x2="1200" y2="200"/>
    <line x1="0" y1="280"  x2="1200" y2="280"/>
    <line x1="0" y1="360"  x2="1200" y2="360"/>
    <line x1="200" y1="0"  x2="200" y2="630"/>
    <line x1="400" y1="0"  x2="400" y2="630"/>
    <line x1="600" y1="0"  x2="600" y2="630"/>
    <line x1="800" y1="0"  x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- stars / sparkles in sky -->
  <g fill="#fbbf24" opacity="0.5">
    <circle cx="140"  cy="90"  r="1.4"/>
    <circle cx="260"  cy="60"  r="1"/>
    <circle cx="410"  cy="110" r="1.4"/>
    <circle cx="580"  cy="50"  r="1"/>
    <circle cx="760"  cy="95"  r="1.4"/>
    <circle cx="920"  cy="65"  r="1"/>
    <circle cx="1080" cy="120" r="1"/>
    <circle cx="1140" cy="80"  r="1.4"/>
    <circle cx="80"   cy="160" r="1"/>
    <circle cx="340"  cy="40"  r="1"/>
    <circle cx="1010" cy="45"  r="1.2"/>
  </g>

  <!-- ===== Shanghai skyline silhouette ===== -->
  <!-- distant skyline (background layer) -->
  <g fill="#0a1018">
    <rect x="0"    y="410" width="55"  height="110"/>
    <rect x="65"   y="390" width="45"  height="130"/>
    <rect x="120"  y="405" width="60"  height="115"/>
    <rect x="190"  y="370" width="40"  height="160"/>
    <rect x="240"  y="395" width="70"  height="135"/>
    <rect x="320"  y="380" width="50"  height="150"/>
    <rect x="380"  y="400" width="55"  height="130"/>
    <rect x="1010" y="405" width="50"  height="125"/>
    <rect x="1070" y="385" width="45"  height="145"/>
    <rect x="1125" y="410" width="60"  height="120"/>
    <rect x="1185" y="395" width="15"  height="135"/>
  </g>

  <!-- Lujiazui core: Oriental Pearl + Shanghai Tower + Jin Mao -->
  <g>
    <!-- Shanghai Tower (twisting taper) -->
    <polygon points="660,540 652,200 672,200 695,540"
             fill="#14213a" stroke="#2a3a55" stroke-width="0.6"/>
    <polygon points="656,270 682,270 684,284 654,284" fill="#1c2e4a"/>
    <polygon points="654,350 686,350 688,366 652,366" fill="#1c2e4a"/>
    <polygon points="652,430 688,430 690,446 650,446" fill="#1c2e4a"/>
    <!-- Oriental Pearl -->
    <rect x="743" y="290" width="12" height="230" fill="#16243a" stroke="#2a3a55" stroke-width="0.5"/>
    <rect x="736" y="340" width="26" height="7"  fill="#1a2a44"/>
    <rect x="731" y="410" width="36" height="9"  fill="#1a2a44"/>
    <circle cx="749" cy="300" r="20" fill="#1c2e4a"/>
    <circle cx="749" cy="300" r="13" fill="#f59e0b" opacity="0.85"/>
    <circle cx="749" cy="300" r="6"  fill="#fef3c7"/>
    <!-- Jin Mao -->
    <polygon points="820,540 816,220 830,220 848,540"
             fill="#1a2a44" stroke="#2a3a55" stroke-width="0.5"/>
    <rect x="813" y="320" width="38" height="5" fill="#14213a"/>
    <rect x="813" y="400" width="38" height="5" fill="#14213a"/>
  </g>

  <!-- mid-rise block (right side) -->
  <g fill="#111b30" opacity="0.95">
    <rect x="890"  y="370" width="42" height="170"/>
    <rect x="942"  y="345" width="50" height="195"/>
    <rect x="1002" y="385" width="36" height="155"/>
    <rect x="1048" y="355" width="55" height="185"/>
    <rect x="1110" y="380" width="40" height="160"/>
    <rect x="1155" y="350" width="45" height="190"/>
  </g>

  <!-- mid-rise block (left side) -->
  <g fill="#111b30" opacity="0.95">
    <rect x="450" y="380" width="40" height="160"/>
    <rect x="500" y="355" width="48" height="185"/>
    <rect x="558" y="390" width="36" height="150"/>
    <rect x="600" y="365" width="42" height="175"/>
  </g>

  <!-- building window lights -->
  <g fill="#fbbf24" opacity="0.5">
    <rect x="736" y="450" width="2" height="2"/><rect x="741" y="460" width="2" height="2"/>
    <rect x="746" y="470" width="2" height="2"/><rect x="753" y="455" width="2" height="2"/>
    <rect x="758" y="475" width="2" height="2"/><rect x="763" y="485" width="2" height="2"/>
    <rect x="822" y="270" width="2" height="2"/><rect x="830" y="290" width="2" height="2"/>
    <rect x="838" y="310" width="2" height="2"/><rect x="828" y="340" width="2" height="2"/>
    <rect x="952" y="380" width="2" height="2"/><rect x="962" y="400" width="2" height="2"/>
    <rect x="972" y="420" width="2" height="2"/><rect x="1012" y="415" width="2" height="2"/>
    <rect x="1058" y="390" width="2" height="2"/><rect x="1072" y="410" width="2" height="2"/>
    <rect x="1086" y="430" width="2" height="2"/><rect x="1120" y="415" width="2" height="2"/>
    <rect x="1165" y="385" width="2" height="2"/><rect x="1175" y="405" width="2" height="2"/>
    <rect x="460" y="410" width="2" height="2"/><rect x="470" y="430" width="2" height="2"/>
    <rect x="510" y="390" width="2" height="2"/><rect x="522" y="415" width="2" height="2"/>
    <rect x="568" y="420" width="2" height="2"/><rect x="578" y="440" width="2" height="2"/>
  </g>

  <!-- ground / water -->
  <rect x="0" y="540" width="1200" height="90" fill="url(#ground)"/>
  <!-- reflection shimmer -->
  <g stroke="#2a3a55" stroke-width="0.6" opacity="0.45">
    <line x1="620" y1="555" x2="720" y2="555"/>
    <line x1="600" y1="575" x2="760" y2="575"/>
    <line x1="620" y1="595" x2="740" y2="595"/>
    <line x1="600" y1="615" x2="760" y2="615"/>
  </g>

  <!-- ===== School building silhouette (left foreground) ===== -->
  <g transform="translate(70,360)">
    <!-- main body -->
    <rect x="0" y="40" width="120" height="140" fill="#0c1422" stroke="#2a3a55" stroke-width="0.6"/>
    <!-- central tower / entrance block -->
    <rect x="35" y="0" width="50" height="180" fill="#0c1422" stroke="#2a3a55" stroke-width="0.6"/>
    <!-- pediment / roof triangle -->
    <polygon points="35,0 60,-22 85,0" fill="#0c1422" stroke="#2a3a55" stroke-width="0.6"/>
    <!-- columns -->
    <g fill="#16243a">
      <rect x="12"  y="60" width="6" height="100"/>
      <rect x="28"  y="60" width="6" height="100"/>
      <rect x="86"  y="60" width="6" height="100"/>
      <rect x="102" y="60" width="6" height="100"/>
    </g>
    <!-- windows -->
    <g fill="#fbbf24" opacity="0.45">
      <rect x="14"  y="70" width="8" height="10"/>
      <rect x="30"  y="70" width="8" height="10"/>
      <rect x="88"  y="70" width="8" height="10"/>
      <rect x="104" y="70" width="8" height="10"/>
      <rect x="14"  y="95" width="8" height="10"/>
      <rect x="30"  y="95" width="8" height="10"/>
      <rect x="88"  y="95" width="8" height="10"/>
      <rect x="104" y="95" width="8" height="10"/>
      <rect x="14"  y="120" width="8" height="10"/>
      <rect x="30"  y="120" width="8" height="10"/>
      <rect x="88"  y="120" width="8" height="10"/>
      <rect x="104" y="120" width="8" height="10"/>
    </g>
    <!-- door -->
    <rect x="52" y="130" width="16" height="50" fill="#1a2a44"/>
    <!-- small flag on tower -->
    <line x1="60" y1="-22" x2="60" y2="-40" stroke="#94a3b8" stroke-width="1"/>
    <polygon points="60,-40 78,-36 60,-32" fill="#f59e0b" opacity="0.85"/>
  </g>

  <!-- ===== Graduation cap (top-right, floating) ===== -->
  <g transform="translate(1010,110) rotate(12)">
    <!-- cap board (diamond) -->
    <polygon points="0,0 42,-16 84,0 42,16"
             fill="#0f172a" stroke="url(#gold)" stroke-width="2"/>
    <!-- button -->
    <circle cx="42" cy="0" r="3.5" fill="#f59e0b"/>
    <!-- tassel string -->
    <path d="M42,0 Q62,8 70,28" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <!-- tassel end -->
    <g fill="#f59e0b">
      <rect x="67" y="28" width="6" height="3" rx="1"/>
      <line x1="70" y1="31" x2="68" y2="40" stroke="#f59e0b" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="70" y1="31" x2="70" y2="41" stroke="#f59e0b" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="70" y1="31" x2="72" y2="40" stroke="#f59e0b" stroke-width="1.4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ===== Main title: Shanghai School District Housing ===== -->
  <g>
    <!-- soft glow behind text -->
    <text x="600" y="215" text-anchor="middle"
          font-size="52" font-weight="800" letter-spacing="1"
          fill="#f59e0b" opacity="0.08">IS SCHOOL DISTRICT HOUSING</text>
    <text x="600" y="270" text-anchor="middle"
          font-size="52" font-weight="800" letter-spacing="1"
          fill="#f59e0b" opacity="0.08">STILL WORTH BUYING?</text>
    <!-- main text -->
    <text x="600" y="213" text-anchor="middle"
          font-size="52" font-weight="800" letter-spacing="1"
          fill="url(#sheen)">IS SCHOOL DISTRICT HOUSING</text>
    <text x="600" y="268" text-anchor="middle"
          font-size="52" font-weight="800" letter-spacing="1"
          fill="url(#sheen)">STILL WORTH BUYING?</text>
    <!-- gold underline accent -->
    <line x1="280" y1="288" x2="920" y2="288" stroke="url(#gold)" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- subtitle -->
  <text x="600" y="320" text-anchor="middle"
        font-size="22" font-weight="500" letter-spacing="3"
        fill="#fbbf24" opacity="0.92">SHANGHAI · 10-YEAR OUTLOOK FOR YOUNG COUPLES</text>

  <!-- year badge -->
  <g>
    <rect x="490" y="340" width="220" height="30" rx="15"
          fill="none" stroke="#f59e0b" stroke-width="1.2" opacity="0.7"/>
    <text x="600" y="360" text-anchor="middle"
          font-size="14" font-weight="700" letter-spacing="2"
          fill="#fbbf24">2026 — 2036 FORECAST</text>
  </g>

  <!-- footer meta line -->
  <g>
    <line x1="60" y1="592" x2="1140" y2="592" class="axis" opacity="0.4"/>
    <text x="80" y="610" font-size="11" letter-spacing="1" class="lbl">Education Policy · School Zoning · Price Trends · Investment Analysis</text>
    <text x="1120" y="610" text-anchor="end" font-size="11" letter-spacing="1" class="op60">findns.cc</text>
  </g>
</svg>
