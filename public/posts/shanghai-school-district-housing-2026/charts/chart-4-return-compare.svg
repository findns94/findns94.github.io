<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-label="School District Housing vs Non-District + Investment: 10-Year Cumulative Return Comparison">
  <title>School District Housing vs Alternative Strategy: 10-Year Cumulative Return, 2026-2036</title>
  <desc>Grouped stacked bar chart comparing two strategies over 10 years. Strategy A (school district housing): property appreciation 1.3M + rental income 780k = 2.08M. Strategy B (non-district housing + invest difference): property appreciation 1.0M + rental income 960k + investment returns 950k = 2.91M.</desc>
  <style>
    :root { --fg: #1f2937; --fg-min: #374151; --grid: rgba(0,0,0,0.08); --axis: rgba(0,0,0,0.32); }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #f3f4f6; --fg-min: #9ca3af; --grid: rgba(255,255,255,0.08); --axis: rgba(255,255,255,0.32); }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; fill: var(--fg); }
    .tick { fill: var(--fg-min); opacity: 0.55; }
    .lbl  { fill: var(--fg-min); opacity: 0.8; }
    .op35 { fill: var(--fg-min); opacity: 0.35; }
    .line-grid { stroke: var(--grid); stroke-width: 0.3; }
    .axis     { stroke: var(--axis); stroke-width: 1; }
  </style>

  <!-- Title -->
  <text x="320" y="24" text-anchor="middle" font-size="14" font-weight="600">School District Housing vs Alternative Strategy: 10-Year Return (CNY 10k)</text>

  <!-- Grid lines -->
  <g class="line-grid">
    <line x1="60" y1="80"  x2="620" y2="80"/>
    <line x1="60" y1="130" x2="620" y2="130"/>
    <line x1="60" y1="180" x2="620" y2="180"/>
    <line x1="60" y1="230" x2="620" y2="230"/>
    <line x1="60" y1="280" x2="620" y2="280"/>
  </g>

  <!-- Y-axis -->
  <line class="axis" x1="60" y1="330" x2="620" y2="330"/>
  <line class="axis" x1="60" y1="60"  x2="60"  y2="330"/>

  <!-- Y-axis labels -->
  <text class="tick" x="54" y="84"  text-anchor="end" font-size="10">300</text>
  <text class="tick" x="54" y="134" text-anchor="end" font-size="10">250</text>
  <text class="tick" x="54" y="184" text-anchor="end" font-size="10">200</text>
  <text class="tick" x="54" y="234" text-anchor="end" font-size="10">150</text>
  <text class="tick" x="54" y="284" text-anchor="end" font-size="10">100</text>
  <text class="tick" x="54" y="334" text-anchor="end" font-size="10">0</text>

  <!-- Y-axis unit label -->
  <text class="lbl" x="54" y="55" text-anchor="end" font-size="9">CNY 10k</text>

  <!-- === Strategy A: School District Housing === -->
  <!-- Bar base: Property appreciation (100k-230k = height 150px from y=180 to y=80... recalc) -->
  <!-- Y mapping: 0=330, 300=80. Each unit = (330-80)/300 = 0.833 px per 10k -->
  <!-- Segment 1: Property appreciation = CNY 1.3M -->
  <rect x="140" y="221.7" width="90" height="108.3" fill="#f59e0b" fill-opacity="0.8" rx="3"/>
  <text x="185" y="216" text-anchor="middle" font-size="9" fill="#f59e0b" font-weight="600">CNY 1.3M</text>

  <!-- Segment 2: Rental income = CNY 780k -->
  <rect x="140" y="154" width="90" height="67.7" fill="#fbbf24" fill-opacity="0.6" rx="3"/>
  <text x="185" y="180" text-anchor="middle" font-size="9" fill="var(--fg-min)">CNY 780k</text>

  <!-- Total line -->
  <line x1="130" y1="154" x2="240" y2="154" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="240" y="149" font-size="10" fill="#f59e0b" font-weight="700">Total: CNY 2.08M</text>

  <!-- === Strategy B: Non-District + Invest === -->
  <!-- Segment 1: Property appreciation = CNY 1.0M -->
  <rect x="380" y="241.7" width="90" height="88.3" fill="#3b82f6" fill-opacity="0.7" rx="3"/>
  <text x="425" y="236" text-anchor="middle" font-size="9" fill="#3b82f6" font-weight="600">CNY 1.0M</text>

  <!-- Segment 2: Rental income = CNY 960k -->
  <rect x="380" y="162.7" width="90" height="79" fill="#60a5fa" fill-opacity="0.5" rx="3"/>
  <text x="425" y="200" text-anchor="middle" font-size="9" fill="var(--fg-min)">CNY 960k</text>

  <!-- Segment 3: Investment returns = CNY 950k -->
  <rect x="380" y="84.7" width="90" height="78" fill="#10b981" fill-opacity="0.6" rx="3"/>
  <text x="425" y="120" text-anchor="middle" font-size="9" fill="#10b981" font-weight="600">CNY 950k</text>

  <!-- Total line -->
  <line x1="370" y1="84.7" x2="480" y2="84.7" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="480" y="79" font-size="10" fill="#10b981" font-weight="700">Total: CNY 2.91M</text>

  <!-- X-axis labels -->
  <text x="185" y="350" text-anchor="middle" font-size="11" font-weight="600">Strategy A</text>
  <text x="425" y="350" text-anchor="middle" font-size="11" font-weight="600">Strategy B</text>

  <!-- Sub-labels -->
  <text x="185" y="365" text-anchor="middle" font-size="9" class="op35">School District Housing</text>
  <text x="425" y="365" text-anchor="middle" font-size="9" class="op35">Non-District + Invest</text>

  <!-- Difference annotation -->
  <text x="320" y="375" text-anchor="middle" font-size="10" fill="#10b981" font-weight="600">Difference: +CNY 830k (40% more)</text>

  <!-- Legend -->
  <g font-size="10">
    <rect x="80" y="60" width="10" height="10" fill="#f59e0b" fill-opacity="0.8" rx="2"/>
    <text x="95" y="70">Property Appreciation (A)</text>
    <rect x="80" y="75" width="10" height="10" fill="#fbbf24" fill-opacity="0.6" rx="2"/>
    <text x="95" y="85">Rental Income (A)</text>
    <rect x="300" y="60" width="10" height="10" fill="#3b82f6" fill-opacity="0.7" rx="2"/>
    <text x="315" y="70">Property Appreciation (B)</text>
    <rect x="300" y="75" width="10" height="10" fill="#60a5fa" fill-opacity="0.5" rx="2"/>
    <text x="315" y="85">Rental Income (B)</text>
    <rect x="300" y="90" width="10" height="10" fill="#10b981" fill-opacity="0.6" rx="2"/>
    <text x="315" y="100">Investment Returns (B)</text>
  </g>
</svg>
