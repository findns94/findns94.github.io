<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-label="Shanghai Births and Primary School Enrollment Forecast, 2016-2036">
  <title>Shanghai Births and Primary School Enrollment Forecast, 2016-2036</title>
  <desc>Area chart comparing Shanghai annual births (2016-2036) and projected primary school enrollment (2022-2036, lagged 6 years). Both show a significant declining trend, with births dropping from 218k to 65k.</desc>
  <style>
    :root { --fg: #1f2937; --fg-min: #374151; --grid: rgba(0,0,0,0.08); --axis: rgba(0,0,0,0.32); }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #f3f4f6; --fg-min: #9ca3af; --grid: rgba(255,255,255,0.08); --axis: rgba(255,255,255,0.32); }
    }
  </style>

  <!-- Title -->
  <text x="320" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">Shanghai Births and Primary School Enrollment Forecast, 2016-2036</text>

  <!-- Grid lines -->
  <line x1="64" y1="60" x2="630" y2="60" stroke="var(--grid)" stroke-width="1"/>
  <line x1="64" y1="120" x2="630" y2="120" stroke="var(--grid)" stroke-width="1"/>
  <line x1="64" y1="180" x2="630" y2="180" stroke="var(--grid)" stroke-width="1"/>
  <line x1="64" y1="240" x2="630" y2="240" stroke="var(--grid)" stroke-width="1"/>
  <line x1="64" y1="300" x2="630" y2="300" stroke="var(--grid)" stroke-width="1"/>

  <!-- Y-axis labels (0-25, y=340 to y=60, 11.2px/unit) -->
  <text x="54" y="344" text-anchor="end" font-size="11" fill="var(--fg-min)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">0</text>
  <text x="54" y="304" text-anchor="end" font-size="11" fill="var(--fg-min)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">5</text>
  <text x="54" y="248" text-anchor="end" font-size="11" fill="var(--fg-min)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">10</text>
  <text x="54" y="192" text-anchor="end" font-size="11" fill="var(--fg-min)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">15</text>
  <text x="54" y="136" text-anchor="end" font-size="11" fill="var(--fg-min)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">20</text>
  <text x="54" y="80" text-anchor="end" font-size="11" fill="var(--fg-min)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">25</text>

  <!-- Axes -->
  <line x1="64" y1="60" x2="64" y2="340" stroke="var(--axis)" stroke-width="1"/>
  <line x1="64" y1="340" x2="630" y2="340" stroke="var(--axis)" stroke-width="1"/>

  <!-- X-axis labels (11 points, 2016-2036, spacing=56.6) -->
  <text x="64" y="360" text-anchor="middle" font-size="11" fill="var(--fg-min)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">2016</text>
  <text x="120.6" y="360" text-anchor="middle" font-size="11" fill="var(--fg-min)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">2018</text>
  <text x="177.2" y="360" text-anchor="middle" font-size="11" fill="var(--fg-min)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">2020</text>
  <text x="233.8" y="360" text-anchor="middle" font-size="11" fill="var(--fg-min)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">2022</text>
  <text x="290.4" y="360" text-anchor="middle" font-size="11" fill="var(--fg-min)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">2024</text>
  <text x="347" y="360" text-anchor="middle" font-size="11" fill="var(--fg-min)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">2026</text>
  <text x="403.6" y="360" text-anchor="middle" font-size="11" fill="var(--fg-min)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">2028</text>
  <text x="460.2" y="360" text-anchor="middle" font-size="11" fill="var(--fg-min)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">2030</text>
  <text x="516.8" y="360" text-anchor="middle" font-size="11" fill="var(--fg-min)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">2032</text>
  <text x="573.4" y="360" text-anchor="middle" font-size="11" fill="var(--fg-min)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">2034</text>
  <text x="630" y="360" text-anchor="middle" font-size="11" fill="var(--fg-min)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">2036</text>

  <!-- Y-axis unit label -->
  <text x="54" y="50" text-anchor="end" font-size="10" fill="var(--fg-min)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">10k persons</text>

  <!-- Births area (amber) -->
  <polygon points="64,340 64,95.84 120.6,132.8 177.2,202.24 233.8,218.64 290.4,214.56 347,233.6 403.6,244.8 460.2,250.4 516.8,259.36 573.4,263.84 630,267.2 630,340" fill="#f59e0b" fill-opacity="0.15"/>
  <polyline points="64,95.84 120.6,132.8 177.2,202.24 233.8,218.64 290.4,214.56 347,233.6 403.6,244.8 460.2,250.4 516.8,259.36 573.4,263.84 630,267.2" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Enrollment area (blue) -->
  <polygon points="233.8,340 233.8,104.8 290.4,132.8 347,205.6 403.6,216.8 460.2,228 516.8,239.2 573.4,250.4 630,256 630,340" fill="#3b82f6" fill-opacity="0.15"/>
  <polyline points="233.8,104.8 290.4,132.8 347,205.6 403.6,216.8 460.2,228 516.8,239.2 573.4,250.4 630,256" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Key data point markers for births -->
  <circle cx="64" cy="95.84" r="3.5" fill="#f59e0b"/>
  <circle cx="177.2" cy="202.24" r="3.5" fill="#f59e0b"/>
  <circle cx="347" cy="233.6" r="3.5" fill="#f59e0b"/>
  <circle cx="630" cy="267.2" r="3.5" fill="#f59e0b"/>

  <!-- Key data point markers for enrollment -->
  <circle cx="233.8" cy="104.8" r="3.5" fill="#3b82f6"/>
  <circle cx="347" cy="205.6" r="3.5" fill="#3b82f6"/>
  <circle cx="630" cy="256" r="3.5" fill="#3b82f6"/>

  <!-- Annotation: peak births -->
  <text x="64" y="88" text-anchor="middle" font-size="10" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="600">218k</text>
  <text x="630" y="280" text-anchor="middle" font-size="10" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="600">65k</text>

  <!-- Legend -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11">
    <rect x="220" y="38" width="12" height="12" rx="2" fill="#f59e0b" fill-opacity="0.4" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="236" y="49" fill="var(--fg)">Births (Annual)</text>
    <rect x="370" y="38" width="12" height="12" rx="2" fill="#3b82f6" fill-opacity="0.4" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="386" y="49" fill="var(--fg)">Primary School Enrollment</text>
  </g>
</svg>
