<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-label="Shanghai School District Housing Policy Timeline, 2020-2030">
  <title>Shanghai School District Housing Policy Timeline, 2020-2030</title>
  <desc>Grouped bar chart showing progress of three education policy implementations in Shanghai from 2022 to 2030: Multi-school Zone Expansion, Teacher Rotation Coverage, and School Quota Allocation Ratio.</desc>
  <style>
    :root { --fg: #1f2937; --fg-min: #374151; --grid: rgba(0,0,0,0.08); --axis: rgba(0,0,0,0.32); }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #f3f4f6; --fg-min: #9ca3af; --grid: rgba(255,255,255,0.08); --axis: rgba(255,255,255,0.32); }
    }
  </style>

  <!-- Title -->
  <text x="320" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="var(--fg)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">Shanghai School District Housing Policy Timeline, 2020-2030</text>

  <!-- Grid lines -->
  <line x1="64" y1="60" x2="630" y2="60" stroke="var(--grid)" stroke-width="1"/>
  <line x1="64" y1="120" x2="630" y2="120" stroke="var(--grid)" stroke-width="1"/>
  <line x1="64" y1="180" x2="630" y2="180" stroke="var(--grid)" stroke-width="1"/>
  <line x1="64" y1="240" x2="630" y2="240" stroke="var(--grid)" stroke-width="1"/>
  <line x1="64" y1="300" x2="630" y2="300" stroke="var(--grid)" stroke-width="1"/>

  <!-- Y-axis labels (0-100%, y=340 to y=60, 2.8px/%) -->
  <text x="54" y="344" text-anchor="end" font-size="11" fill="var(--fg-min)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">0%</text>
  <text x="54" y="284" text-anchor="end" font-size="11" fill="var(--fg-min)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">20%</text>
  <text x="54" y="228" text-anchor="end" font-size="11" fill="var(--fg-min)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">40%</text>
  <text x="54" y="172" text-anchor="end" font-size="11" fill="var(--fg-min)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">60%</text>
  <text x="54" y="116" text-anchor="end" font-size="11" fill="var(--fg-min)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">80%</text>
  <text x="54" y="60" text-anchor="end" font-size="11" fill="var(--fg-min)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">100%</text>

  <!-- Axes -->
  <line x1="64" y1="60" x2="64" y2="340" stroke="var(--axis)" stroke-width="1"/>
  <line x1="64" y1="340" x2="630" y2="340" stroke="var(--axis)" stroke-width="1"/>

  <!-- X-axis labels (5 groups, centers at 120.6, 233.8, 347, 460.2, 573.4) -->
  <text x="120.6" y="360" text-anchor="middle" font-size="11" fill="var(--fg-min)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">2022</text>
  <text x="233.8" y="360" text-anchor="middle" font-size="11" fill="var(--fg-min)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">2024</text>
  <text x="347" y="360" text-anchor="middle" font-size="11" fill="var(--fg-min)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">2026</text>
  <text x="460.2" y="360" text-anchor="middle" font-size="11" fill="var(--fg-min)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">2028</text>
  <text x="573.4" y="360" text-anchor="middle" font-size="11" fill="var(--fg-min)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">2030</text>

  <!-- Bars: width=20, gap=5, total span=70. Bar1=center-35, Bar2=center-10, Bar3=center+15 -->
  <!-- 2022 group (center 120.6): Multi-school 10%, Teacher 20%, Quota 50% -->
  <rect x="85.6" y="312" width="20" height="28" rx="2" fill="#ef4444"/>
  <rect x="110.6" y="284" width="20" height="56" rx="2" fill="#3b82f6"/>
  <rect x="135.6" y="200" width="20" height="140" rx="2" fill="#10b981"/>

  <!-- 2024 group (center 233.8): Multi-school 25%, Teacher 50%, Quota 55% -->
  <rect x="198.8" y="270" width="20" height="70" rx="2" fill="#ef4444"/>
  <rect x="223.8" y="200" width="20" height="140" rx="2" fill="#3b82f6"/>
  <rect x="248.8" y="186" width="20" height="154" rx="2" fill="#10b981"/>

  <!-- 2026 group (center 347): Multi-school 45%, Teacher 80%, Quota 60% -->
  <rect x="312" y="214" width="20" height="126" rx="2" fill="#ef4444"/>
  <rect x="337" y="116" width="20" height="224" rx="2" fill="#3b82f6"/>
  <rect x="362" y="172" width="20" height="168" rx="2" fill="#10b981"/>

  <!-- 2028 group (center 460.2): Multi-school 65%, Teacher 90%, Quota 65% -->
  <rect x="425.2" y="158" width="20" height="182" rx="2" fill="#ef4444"/>
  <rect x="450.2" y="88" width="20" height="252" rx="2" fill="#3b82f6"/>
  <rect x="475.2" y="158" width="20" height="182" rx="2" fill="#10b981"/>

  <!-- 2030 group (center 573.4): Multi-school 80%, Teacher 95%, Quota 70% -->
  <rect x="538.4" y="116" width="20" height="224" rx="2" fill="#ef4444"/>
  <rect x="563.4" y="74" width="20" height="266" rx="2" fill="#3b82f6"/>
  <rect x="588.4" y="144" width="20" height="196" rx="2" fill="#10b981"/>

  <!-- Legend -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11">
    <rect x="195" y="38" width="12" height="12" rx="2" fill="#ef4444"/>
    <text x="211" y="49" fill="var(--fg)">Multi-school Zone Expansion</text>
    <rect x="365" y="38" width="12" height="12" rx="2" fill="#3b82f6"/>
    <text x="381" y="49" fill="var(--fg)">Teacher Rotation Coverage</text>
    <rect x="535" y="38" width="12" height="12" rx="2" fill="#10b981"/>
    <text x="551" y="49" fill="var(--fg)">School Quota Allocation</text>
  </g>
</svg>
