<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-label="Shanghai School District Housing Premium Forecast Under Three Scenarios, 2026-2036">
  <title>Shanghai School District Housing Premium Forecast Under Three Scenarios, 2026-2036</title>
  <desc>Multi-line chart showing school district housing premium rate forecasts for Optimistic (declines from 25% to 15%), Baseline (25% to 10%), and Pessimistic (25% to 5%) scenarios over 2026-2036.</desc>
  <style>
    :root { --fg: #1f2937; --fg-min: #374151; --grid: rgba(0,0,0,0.08); --axis: rgba(0,0,0,0.32); }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #f3f4f6; --fg-min: #9ca3af; --grid: rgba(255,255,255,0.08); --axis: rgba(255,255,255,0.32); }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; fill: var(--fg); }
    .tick { fill: var(--fg-min); opacity: 0.55; }
    .lbl  { fill: var(--fg-min); opacity: 0.8; }
    .op35 { fill: var(--fg-min); opacity: 0.35; }
    .line-grid { stroke: var(--grid); stroke-width: 0.3; }
    .axis     { stroke: var(--axis); stroke-width: 1; }
  </style>

  <!-- Title -->
  <text x="320" y="24" text-anchor="middle" font-size="14" font-weight="600">Shanghai School District Housing Premium Forecast, 2026-2036</text>

  <!-- Grid lines -->
  <g class="line-grid">
    <line x1="60" y1="70"  x2="620" y2="70"/>
    <line x1="60" y1="130" x2="620" y2="130"/>
    <line x1="60" y1="190" x2="620" y2="190"/>
    <line x1="60" y1="250" x2="620" y2="250"/>
    <line x1="60" y1="310" x2="620" y2="310"/>
  </g>

  <!-- Axes -->
  <line class="axis" x1="60" y1="340" x2="620" y2="340"/>
  <line class="axis" x1="60" y1="50"  x2="60"  y2="340"/>

  <!-- Y-axis labels (0% to 30%) -->
  <text class="tick" x="54" y="344" text-anchor="end" font-size="10">0%</text>
  <text class="tick" x="54" y="314" text-anchor="end" font-size="10">5%</text>
  <text class="tick" x="54" y="254" text-anchor="end" font-size="10">10%</text>
  <text class="tick" x="54" y="194" text-anchor="end" font-size="10">15%</text>
  <text class="tick" x="54" y="134" text-anchor="end" font-size="10">20%</text>
  <text class="tick" x="54" y="74"  text-anchor="end" font-size="10">25%</text>
  <text class="tick" x="54" y="54"  text-anchor="end" font-size="10">30%</text>

  <!-- X-axis labels (2026-2036, 6 points, spacing=112) -->
  <text class="op35" x="60"  y="360" text-anchor="middle" font-size="10">2026</text>
  <text class="op35" x="172" y="360" text-anchor="middle" font-size="10">2028</text>
  <text class="op35" x="284" y="360" text-anchor="middle" font-size="10">2030</text>
  <text class="op35" x="396" y="360" text-anchor="middle" font-size="10">2032</text>
  <text class="op35" x="508" y="360" text-anchor="middle" font-size="10">2034</text>
  <text class="op35" x="620" y="360" text-anchor="middle" font-size="10">2036</text>

  <!-- Y-axis unit label -->
  <text class="lbl" x="54" y="45" text-anchor="end" font-size="9">Premium Rate</text>

  <!-- === Optimistic (green): 25→23→21→19→17→15 === -->
  <!-- Y mapping: 30%=54, 0%=340. Each % = (340-54)/30 = 9.53px -->
  <!-- 25% → y=97.9, 23%→116.9, 21%→136, 19%→155, 17%→174.1, 15%→193.2 -->
  <polyline points="60,97.9 172,116.9 284,136 396,155 508,174.1 620,193.2" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="60" cy="97.9" r="4" fill="#10b981"/>
  <circle cx="172" cy="116.9" r="4" fill="#10b981"/>
  <circle cx="284" cy="136" r="4" fill="#10b981"/>
  <circle cx="396" cy="155" r="4" fill="#10b981"/>
  <circle cx="508" cy="174.1" r="4" fill="#10b981"/>
  <circle cx="620" cy="193.2" r="4" fill="#10b981"/>
  <text x="628" y="190" font-size="9" fill="#10b981" font-weight="600">15%</text>

  <!-- === Baseline (amber): 25→20→16→13→11→10 === -->
  <!-- 25%→97.9, 20%→145.5, 16%→183.7, 13%→212.3, 11%→231.3, 10%→240.9 -->
  <polyline points="60,97.9 172,145.5 284,183.7 396,212.3 508,231.3 620,240.9" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="60" cy="97.9" r="4" fill="#f59e0b"/>
  <circle cx="172" cy="145.5" r="4" fill="#f59e0b"/>
  <circle cx="284" cy="183.7" r="4" fill="#f59e0b"/>
  <circle cx="396" cy="212.3" r="4" fill="#f59e0b"/>
  <circle cx="508" cy="231.3" r="4" fill="#f59e0b"/>
  <circle cx="620" cy="240.9" r="4" fill="#f59e0b"/>
  <text x="628" y="237" font-size="9" fill="#f59e0b" font-weight="600">10%</text>

  <!-- === Pessimistic (red): 25→16→11→8→6→5 === -->
  <!-- 25%→97.9, 16%→183.7, 11%→231.3, 8%→259.9, 6%→279, 5%→288.5 -->
  <polyline points="60,97.9 172,183.7 284,231.3 396,259.9 508,279 620,288.5" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="60" cy="97.9" r="4" fill="#ef4444"/>
  <circle cx="172" cy="183.7" r="4" fill="#ef4444"/>
  <circle cx="284" cy="231.3" r="4" fill="#ef4444"/>
  <circle cx="396" cy="259.9" r="4" fill="#ef4444"/>
  <circle cx="508" cy="279" r="4" fill="#ef4444"/>
  <circle cx="620" cy="288.5" r="4" fill="#ef4444"/>
  <text x="628" y="285" font-size="9" fill="#ef4444" font-weight="600">5%</text>

  <!-- Starting point annotation -->
  <text x="52" y="93" text-anchor="end" font-size="9" fill="var(--fg-min)" font-weight="600">25%</text>
  <circle cx="60" cy="97.9" r="6" fill="none" stroke="var(--fg-min)" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Legend -->
  <g font-size="10">
    <line x1="100" y1="42" x2="130" y2="42" stroke="#10b981" stroke-width="2.5"/>
    <circle cx="115" cy="42" r="3" fill="#10b981"/>
    <text x="135" y="46">Optimistic</text>

    <line x1="220" y1="42" x2="250" y2="42" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="235" cy="42" r="3" fill="#f59e0b"/>
    <text x="255" y="46">Baseline</text>

    <line x1="330" y1="42" x2="360" y2="42" stroke="#ef4444" stroke-width="2.5"/>
    <circle cx="345" cy="42" r="3" fill="#ef4444"/>
    <text x="365" y="46">Pessimistic</text>
  </g>
</svg>
