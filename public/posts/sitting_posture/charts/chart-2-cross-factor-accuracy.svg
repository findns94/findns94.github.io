<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="chart-title chart-desc" style="max-width:100%;height:auto;font-family:'Inter',system-ui,sans-serif">
  <title id="chart-title">Detection Accuracy Across Body Types and Clothing (50 Trials Each)</title>
  <desc id="chart-desc">Grouped bar chart showing how many of 50 improper postures were detected for each test factor. Fat (180cm/105kg): 50/50. Thin (174cm/62kg): 48/50. Tall (180cm/55kg): 48/50. Short (165cm/50kg): 47/50. Thin clothes (170cm/70kg): 50/50. Thick clothes (170cm/70kg): 47/50. Results show the method is invariant to body shape and clothing.</desc>
  <style>
    :root { --fg: #1f2937; --fg-min: #374151; --grid: rgba(0,0,0,0.08); --axis: rgba(0,0,0,0.32); }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #f3f4f6; --fg-min: #9ca3af; --grid: rgba(255,255,255,0.08); --axis: rgba(255,255,255,0.32); }
    }
    text { fill: var(--fg); }
    .tick { fill: var(--fg-min); opacity: 0.55; }
    .lbl { fill: var(--fg-min); opacity: 0.8; }
    .op35 { fill: var(--fg-min); opacity: 0.35; }
    .line-grid { stroke: var(--grid); stroke-width: 0.3; }
    .axis { stroke: var(--axis); stroke-width: 1; }
  </style>
  <!-- Y axis gridlines (0-50) -->
  <line class="line-grid" x1="80" y1="60" x2="600" y2="60"/>
  <line class="line-grid" x1="80" y1="120" x2="600" y2="120"/>
  <line class="line-grid" x1="80" y1="180" x2="600" y2="180"/>
  <line class="line-grid" x1="80" y1="240" x2="600" y2="240"/>
  <line class="line-grid" x1="80" y1="300" x2="600" y2="300"/>
  <!-- Axes -->
  <line class="axis" x1="80" y1="300" x2="600" y2="300"/>
  <line class="axis" x1="80" y1="60" x2="80" y2="300"/>
  <!-- Y axis tick labels -->
  <text class="tick" x="74" y="64" text-anchor="end" font-size="10">50</text>
  <text class="tick" x="74" y="124" text-anchor="end" font-size="10">40</text>
  <text class="tick" x="74" y="184" text-anchor="end" font-size="10">30</text>
  <text class="tick" x="74" y="244" text-anchor="end" font-size="10">20</text>
  <text class="tick" x="74" y="304" text-anchor="end" font-size="10">0</text>
  <!-- Legend -->
  <rect x="80" y="30" width="10" height="10" fill="#22c55e" rx="1"/>
  <text x="95" y="39" font-size="10" fill="#1f2937">Detected</text>
  <rect x="170" y="30" width="10" height="10" fill="#f97316" rx="1"/>
  <text x="185" y="39" font-size="10" fill="#1f2937">Undetected</text>
  <!-- Bar groups. Scale: 50 trials = 240px, so px_per_unit = 240/50 = 4.8 -->
  <!-- baseline y=300. bar_top = 300 - value*4.8, bar_height = value*4.8 -->
  <!-- Group 1: Fat 180/105 -->
  <rect x="105" y="60" width="28" height="240" fill="#22c55e" rx="2"/>
  <rect x="135" y="300" width="28" height="0" fill="#f97316" rx="2"/>
  <text class="lbl" x="134" y="320" text-anchor="middle" font-size="9">Fat</text>
  <text class="lbl" x="134" y="332" text-anchor="middle" font-size="8">180/105</text>
  <!-- Group 2: Thin 174/62 -->
  <rect x="195" y="69.6" width="28" height="230.4" fill="#22c55e" rx="2"/>
  <rect x="225" y="290.4" width="28" height="9.6" fill="#f97316" rx="2"/>
  <text class="lbl" x="224" y="320" text-anchor="middle" font-size="9">Thin</text>
  <text class="lbl" x="224" y="332" text-anchor="middle" font-size="8">174/62</text>
  <!-- Group 3: Tall 180/55 -->
  <rect x="285" y="69.6" width="28" height="230.4" fill="#22c55e" rx="2"/>
  <rect x="315" y="290.4" width="28" height="9.6" fill="#f97316" rx="2"/>
  <text class="lbl" x="314" y="320" text-anchor="middle" font-size="9">Tall</text>
  <text class="lbl" x="314" y="332" text-anchor="middle" font-size="8">180/55</text>
  <!-- Group 4: Short 165/50 -->
  <rect x="375" y="84" width="28" height="216" fill="#22c55e" rx="2"/>
  <rect x="405" y="280.8" width="28" height="19.2" fill="#f97316" rx="2"/>
  <text class="lbl" x="404" y="320" text-anchor="middle" font-size="9">Short</text>
  <text class="lbl" x="404" y="332" text-anchor="middle" font-size="8">165/50</text>
  <!-- Group 5: Thin clothes 170/70 -->
  <rect x="465" y="60" width="28" height="240" fill="#22c55e" rx="2"/>
  <rect x="495" y="300" width="28" height="0" fill="#f97316" rx="2"/>
  <text class="lbl" x="494" y="320" text-anchor="middle" font-size="9">Thin</text>
  <text class="lbl" x="494" y="332" text-anchor="middle" font-size="8">clothes</text>
  <!-- Group 6: Thick clothes 170/70 -->
  <rect x="555" y="84" width="28" height="216" fill="#22c55e" rx="2"/>
  <rect x="585" y="280.8" width="28" height="19.2" fill="#f97316" rx="2"/>
  <text class="lbl" x="584" y="320" text-anchor="middle" font-size="9">Thick</text>
  <text class="lbl" x="584" y="332" text-anchor="middle" font-size="8">clothes</text>
  <!-- Value labels on detected bars -->
  <text x="119" y="56" text-anchor="middle" font-size="9" fill="#111827" font-weight="700">50</text>
  <text x="209" y="65" text-anchor="middle" font-size="9" fill="#111827" font-weight="700">48</text>
  <text x="299" y="65" text-anchor="middle" font-size="9" fill="#111827" font-weight="700">48</text>
  <text x="389" y="80" text-anchor="middle" font-size="9" fill="#111827" font-weight="700">47</text>
  <text x="479" y="56" text-anchor="middle" font-size="9" fill="#111827" font-weight="700">50</text>
  <text x="569" y="80" text-anchor="middle" font-size="9" fill="#111827" font-weight="700">47</text>
  <!-- Source -->
  <text class="op35" x="320" y="385" text-anchor="middle" font-size="10">Source: Original experiment, Table 2. 5 volunteers, 50 trials each. Method invariant to body shape and clothing.</text>
</svg>
