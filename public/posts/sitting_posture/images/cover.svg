<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="cover-title cover-desc">
  <title id="cover-title">Detecting Improper Sitting Posture with a Lateral Motion Camera</title>
  <desc id="cover-desc">Cover image for a blog post about a lateral-view motion-sensing camera system that detects improper sitting posture with 94% accuracy using skeleton thinning, depth averaging, and a 20-degree neck-flexion threshold.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative skeleton figure (silhouette) -->
  <g opacity="0.12" fill="#38bdf8">
    <!-- head -->
    <circle cx="900" cy="180" r="42"/>
    <!-- neck -->
    <rect x="892" y="222" width="16" height="40" rx="4"/>
    <!-- torso -->
    <path d="M860 262 L940 262 L952 420 L848 420 Z" rx="8"/>
    <!-- arm forward (slouched) -->
    <path d="M940 270 Q990 300 1010 360 L990 368 Q970 310 930 280 Z"/>
    <!-- legs -->
    <rect x="858" y="420" width="34" height="120" rx="6"/>
    <rect x="908" y="420" width="34" height="120" rx="6"/>
  </g>
  <!-- Angle arc indicating neck flexion -->
  <g stroke="#f97316" stroke-width="3" fill="none" opacity="0.6">
    <path d="M870 250 A40 40 0 0 1 930 250"/>
    <text x="908" y="240" font-size="18" fill="#f97316" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-weight="700">α &gt; 20°</text>
  </g>
  <!-- Camera indicator -->
  <g opacity="0.5">
    <rect x="180" y="380" width="60" height="40" rx="6" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="210" cy="400" r="12" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <line x1="240" y1="400" x2="340" y2="400" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
  </g>
  <!-- Title block -->
  <text x="80" y="240" font-size="22" fill="#38bdf8" font-family="'Inter', system-ui, sans-serif" font-weight="600" letter-spacing="2">SILVER BULLET RESEARCH</text>
  <text x="80" y="310" font-size="44" fill="#f8fafc" font-family="'Inter', system-ui, sans-serif" font-weight="800">Detecting Improper</text>
  <text x="80" y="365" font-size="44" fill="#f8fafc" font-family="'Inter', system-ui, sans-serif" font-weight="800">Sitting Posture</text>
  <text x="80" y="420" font-size="26" fill="#94a3b8" font-family="'Inter', system-ui, sans-serif" font-weight="500">with a Lateral Motion Camera</text>
  <!-- Key stat highlight -->
  <g>
    <rect x="80" y="470" width="180" height="64" rx="8" fill="url(#accent)" opacity="0.15"/>
    <text x="96" y="512" font-size="40" fill="#f97316" font-family="'Inter', system-ui, sans-serif" font-weight="800">94% Accuracy</text>
  </g>
  <!-- Subtitle / method tags -->
  <g font-family="'Inter', system-ui, sans-serif" font-size="14" fill="#64748b">
    <text x="80" y="570">Skeleton Thinning</text>
    <text x="230" y="570">·</text>
    <text x="245" y="570">Depth Averaging</text>
    <text x="380" y="570">·</text>
    <text x="395" y="570">20° Threshold</text>
  </g>
  <!-- Source / author line -->
  <text x="80" y="605" font-size="11" fill="#475569" font-family="'Inter', system-ui, sans-serif">FindNS94 · Original experiment, 200 trials across 5 volunteers</text>
</svg>
