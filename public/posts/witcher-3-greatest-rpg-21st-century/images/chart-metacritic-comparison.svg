<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-label="RPG Metacritic score comparison: Baldur's Gate 3 96, Elden Ring 96, Skyrim 94, The Witcher 3 93, Cyberpunk 2077 86">
<title>RPG Metacritic Score Comparison (PC)</title>
<desc>Horizontal bar chart comparing Metacritic scores of major 21st-century RPGs: Baldur's Gate 3 (96), Elden Ring (96), Skyrim (94), The Witcher 3 (93), and Cyberpunk 2077 (86).</desc>
<style>
  :root { --fg: #1f2937; --fg-min: #374151; --grid: rgba(0,0,0,0.08); --axis: rgba(0,0,0,0.32); }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #f3f4f6; --fg-min: #9ca3af; --grid: rgba(255,255,255,0.08); --axis: rgba(255,255,255,0.32); }
  }
  text { fill: var(--fg); }
  .tick { fill: var(--fg-min); opacity: 0.55; }
  .lbl { fill: var(--fg-min); opacity: 0.9; }
  .val { font-weight: 700; }
  .val-d { fill: var(--fg); }
  .val-l { fill: #ffffff; }
  .op5 { fill: var(--fg-min); opacity: 0.5; }
  .line-grid { stroke: var(--grid); stroke-width: 0.3; }
  .muted { fill: #64748b; }
  .accent { fill: #f59e0b; }
</style>
<text x="380" y="28" font-size="15" font-weight="700" text-anchor="middle">Metacritic Score (PC)</text>
<text x="380" y="44" font-size="10" text-anchor="middle" class="op5">Higher is better · Source: Metacritic, 2026</text>
<g>
  <line class="line-grid" x1="160" y1="60"  x2="600" y2="60"/>
  <line class="line-grid" x1="160" y1="108" x2="600" y2="108"/>
  <line class="line-grid" x1="160" y1="156" x2="600" y2="156"/>
  <line class="line-grid" x1="160" y1="204" x2="600" y2="204"/>
  <line class="line-grid" x1="160" y1="252" x2="600" y2="252"/>
  <line class="line-grid" x1="160" y1="300" x2="600" y2="300"/>
</g>
<text class="tick" x="154" y="64"  text-anchor="end" font-size="10">80</text>
<text class="tick" x="154" y="112" text-anchor="end" font-size="10">84</text>
<text class="tick" x="154" y="160" text-anchor="end" font-size="10">88</text>
<text class="tick" x="154" y="208" text-anchor="end" font-size="10">92</text>
<text class="tick" x="154" y="256" text-anchor="end" font-size="10">96</text>
<text class="tick" x="160" y="336" text-anchor="middle" font-size="10">80</text>
<text class="tick" x="270" y="336" text-anchor="middle" font-size="10">84</text>
<text class="tick" x="380" y="336" text-anchor="middle" font-size="10">88</text>
<text class="tick" x="490" y="336" text-anchor="middle" font-size="10">92</text>
<text class="tick" x="600" y="336" text-anchor="middle" font-size="10">96</text>
<g font-family="'Segoe UI', system-ui, sans-serif" font-size="12">
  <!-- BG3 96 -> full width 440 -->
  <text class="lbl" x="150" y="74" text-anchor="end">Baldur's Gate 3</text>
  <rect class="muted" x="160" y="62" width="440" height="20" rx="4"/>
  <text class="val val-l" x="592" y="77" text-anchor="end">96</text>
  <!-- Elden Ring 96 -> full width 440 -->
  <text class="lbl" x="150" y="122" text-anchor="end">Elden Ring</text>
  <rect class="muted" x="160" y="110" width="440" height="20" rx="4"/>
  <text class="val val-l" x="592" y="125" text-anchor="end">96</text>
  <!-- Skyrim 94 -> (14/16)*440 = 385 -->
  <text class="lbl" x="150" y="170" text-anchor="end">Skyrim</text>
  <rect class="muted" x="160" y="158" width="385" height="20" rx="4"/>
  <text class="val val-l" x="537" y="173" text-anchor="end">94</text>
  <!-- Witcher 3 93 -> (13/16)*440 = 357.5 -->
  <text class="lbl" x="150" y="218" text-anchor="end">The Witcher 3</text>
  <rect class="accent" x="160" y="206" width="357" height="20" rx="4"/>
  <text class="val val-l" x="509" y="221" text-anchor="end">93</text>
  <!-- CP77 86 -> (6/16)*440 = 165 -->
  <text class="lbl" x="150" y="266" text-anchor="end">Cyberpunk 2077</text>
  <rect class="muted" x="160" y="254" width="165" height="20" rx="4"/>
  <text class="val val-d" x="331" y="269" text-anchor="start">86</text>
</g>
<text class="op5" x="380" y="358" text-anchor="middle" font-size="10">Source: Metacritic.com, 2026</text>
</svg>
