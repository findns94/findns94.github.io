<text x="136.0" y="109.5" text-anchor="end" font-size="11" fill="currentColor" opacity="0.8"><tspan x="136.0" dy="0">20%</tspan></text>
<line x1="145" y1="105.5" x2="202.2" y2="105.5" stroke="currentColor" opacity="0.15" stroke-width="1" />
<circle cx="202.2" cy="105.5" r="6" fill="#f97316" />
<text x="214.2" y="109.5" font-size="11" fill="currentColor">5.3</text>
<text x="136.0" y="164.5" text-anchor="end" font-size="11" fill="currentColor" opacity="0.8"><tspan x="136.0" dy="0">40%</tspan></text>
<line x1="145" y1="160.5" x2="302.7" y2="160.5" stroke="currentColor" opacity="0.15" stroke-width="1" />
<circle cx="302.7" cy="160.5" r="6" fill="#38bdf8" />
<text x="314.7" y="164.5" font-size="11" fill="currentColor">14.6</text>
<text x="136.0" y="219.5" text-anchor="end" font-size="11" fill="currentColor" opacity="0.8"><tspan x="136.0" dy="0">60%</tspan></text>
<line x1="145" y1="215.5" x2="422.5" y2="215.5" stroke="currentColor" opacity="0.15" stroke-width="1" />
