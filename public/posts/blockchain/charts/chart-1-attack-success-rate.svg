  <title id="double-spend-attack-success-rate-by-attacker-hashing-power-title">Double-Spend Attack Success Rate by Attacker Hashing Power</title>
  <desc id="double-spend-attack-success-rate-by-attacker-hashing-power-desc">A lollipop chart showing the probability of a successful double-spend attack under different attacker hashing power ratios, based on simulation experiments. At 20% hashing power the success rate is 5.3% (2/38), at 40% it is 14.6% (7/48), at 60% it is 25.7% (9/35), and at 80% it is 33.8% (22/65).</desc>
  <text x="280.0" y="29" text-anchor="middle" font-size="18" font-weight="800" fill="currentColor">Double-Spend Attack Success Rate by Attacker Hashing Power</text>
  <text x="280.0" y="48.0" text-anchor="middle" font-size="12" fill="var(--chart-muted, currentColor)"><tspan x="280.0" dy="0">Higher hashing power sharply increases attack success probability</tspan></text>
  <line x1="145" y1="298.0" x2="510" y2="298.0" stroke="currentColor" opacity="0.08" />
<line x1="145" y1="243.0" x2="510" y2="243.0" stroke="currentColor" opacity="0.08" />
<line x1="145" y1="188.0" x2="510" y2="188.0" stroke="currentColor" opacity="0.08" />
<line x1="145" y1="133.0" x2="510" y2="133.0" stroke="currentColor" opacity="0.08" />
