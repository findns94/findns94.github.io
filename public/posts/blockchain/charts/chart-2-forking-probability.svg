  <desc id="blockchain-forking-probability-by-network-bandwidth-and-delay-desc">A horizontal bar chart showing the number of blockchain forking occurrences under different network bandwidth and delay configurations. Tested configurations: 1000MB/0ms (0 forks), 100MB/1ms (0 forks), 10MB/0ms (0 forks), 10MB/100ms (0 forks), 10MB/1000ms (4 forks), 1MB/1000ms (12 forks). Each configuration ran 20 mining rounds across 5 nodes.</desc>
