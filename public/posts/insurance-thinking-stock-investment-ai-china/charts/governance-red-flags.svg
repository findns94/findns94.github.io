<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380" role="img" aria-label="Horizontal bar chart showing frequency of governance red flags in A-shares with negative 3-year returns: auditor changes 34%, high pledged shares 28%, cash/revenue mismatch 26%, related-party transactions 22%, frequent dilution 18%">
<title>Governance Red Flags in A-Shares With Negative 3-Year Returns</title>
<desc>Frequency of governance red flags among A-share companies that delivered negative total returns over rolling 3-year periods. Auditor changes: 34%, high pledged shares: 28%, cash/revenue mismatch: 26%, related-party transactions: 22%, frequent dilution via SEOs: 18%. Source: author analysis of A-share company disclosures, 2020-2024.</desc>
<style>
  :root { --fg: #1f2937; --fg-min: #374151; --grid: rgba(0,0,0,0.08); --axis: rgba(0,0,0,0.32); }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #f3f4f6; --fg-min: #9ca3af; --grid: rgba(255,255,255,0.08); --axis: rgba(255,255,255,0.32); }
  }
  text { fill: var(--fg); }
  .tick { fill: var(--fg-min); opacity: 0.55; }
  .lbl { fill: var(--fg-min); opacity: 0.8; }
  .op35 { fill: var(--fg-min); opacity: 0.35; }
  .op70 { fill: var(--fg); opacity: 0.7; }
  .line-grid { stroke: var(--grid); stroke-width: 0.3; }
  .axis { stroke: var(--axis); stroke-width: 1; }
</style>
<text x="280" y="28" text-anchor="middle" font-size="15" font-weight="700">Governance Red Flags in A-Shares With Negative 3-Year Returns</text>
<text class="tick" x="280" y="46" text-anchor="middle" font-size="11">Frequency of red-flag occurrence among underperforming companies</text>
