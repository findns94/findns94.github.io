<line x1="364" y1="268" x2="364" y2="310" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3"/>
<rect x="310" y="296" width="175" height="28" rx="4" fill="#38bdf8" opacity="0.12"/>
<text class="lbl" x="397" y="308" text-anchor="middle" font-size="9" opacity="0.85">Most benefit from first</text>
<text class="lbl" x="397" y="320" text-anchor="middle" font-size="9" opacity="0.85">15-20 stocks (Elton &amp; Gruber, 1977)</text>
<text class="op35" x="280" y="376" text-anchor="middle" font-size="9">Source: Elton &amp; Gruber, Journal of Business (1977); Statman, JFQA (1987)</text>
</svg>
