<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380" role="img" aria-label="Recommended portfolio allocation: 40% Domestic large-cap, 15% Domestic growth, 20% International, 10% Gold, 15% Pension tax saving">
<title>Recommended 10-Year Portfolio Allocation for Shanghai Couples (Age 28-32)</title>
<desc>Donut chart showing recommended asset allocation for a Shanghai young couple investing over 2026-2036. Domestic large-cap 40%, Domestic growth 15%, International (QDII) 20%, Gold 10%, Pension tax saving benefit 15%. Source: author illustration based on the framework in this guide, 2026.</desc>
<style>
  :root { --fg: #1f2937; --fg-min: #374151; --grid: rgba(0,0,0,0.08); --axis: rgba(0,0,0,0.32); }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #f3f4f6; --fg-min: #9ca3af; --grid: rgba(255,255,255,0.08); --axis: rgba(255,255,255,0.32); }
  }
  text { fill: var(--fg); }
  .lbl  { fill: var(--fg-min); opacity: 0.8; }
  .op35 { fill: var(--fg-min); opacity: 0.35; }
  .op85 { fill: var(--fg-min); opacity: 0.85; }
</style>
<g transform="translate(260,190)">
  <circle r="120" stroke="var(--grid)" stroke-width="44" fill="none"/>
  <!-- C = 2*pi*120 = 753.9822. Each dash is exactly fraction*C so dash+gap = C and every arc is exact;
       cumulative rotations decrease by the prior arc so the five slices tile exactly 360 degrees with no seam.
       arcs: 40%=301.5929, 15%=113.0973, 20%=150.7964, 10%=75.3982, 15%=113.0973 -->
  <circle r="120" stroke="#f97316" stroke-width="44" fill="none" stroke-dasharray="301.5929 452.3893" transform="rotate(-90)"/>
  <circle r="120" stroke="#38bdf8" stroke-width="44" fill="none" stroke-dasharray="113.0973 640.8849" transform="rotate(-234)"/>
  <circle r="120" stroke="#a78bfa" stroke-width="44" fill="none" stroke-dasharray="150.7964 603.1858" transform="rotate(-288)"/>
  <circle r="120" stroke="#22c55e" stroke-width="44" fill="none" stroke-dasharray="75.3982 678.5840" transform="rotate(-360)"/>
  <circle r="120" stroke="#fb923c" stroke-width="44" fill="none" stroke-dasharray="113.0973 640.8849" transform="rotate(-396)"/>
</g>
<text x="260" y="180" text-anchor="middle" font-size="13" font-weight="700">Recommended</text>
<text x="260" y="200" text-anchor="middle" font-size="13" font-weight="700">Allocation</text>
<rect x="20" y="330" width="14" height="14" rx="3" fill="#f97316"/>
<text class="op85" x="40" y="342" font-size="11">Domestic large-cap (40%)</text>
<rect x="200" y="330" width="14" height="14" rx="3" fill="#38bdf8"/>
<text class="op85" x="220" y="342" font-size="11">Domestic growth (15%)</text>
<rect x="370" y="330" width="14" height="14" rx="3" fill="#a78bfa"/>
<text class="op85" x="390" y="342" font-size="11">International (20%)</text>
<rect x="20" y="358" width="14" height="14" rx="3" fill="#22c55e"/>
<text class="op85" x="40" y="370" font-size="11">Gold (10%)</text>
<rect x="200" y="358" width="14" height="14" rx="3" fill="#fb923c"/>
<text class="op85" x="220" y="370" font-size="11">Pension tax saving (15%)</text>
<text class="op35" x="280" y="372" text-anchor="middle" font-size="10">Source: Author illustration, 2026</text>
</svg>
