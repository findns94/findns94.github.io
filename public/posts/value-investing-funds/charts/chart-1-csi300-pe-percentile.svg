<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" role="img" aria-label="CSI 300 PE Ratio Historical Percentile (2005-2025)">
  <title>CSI 300 PE Ratio Historical Percentile</title>
  <desc>Line chart showing CSI 300 PE ratio percentile from 2005 to 2025, with undervalued zone below 20% and overvalued above 80%</desc>
  <style>
    text { font-family: 'Inter', system-ui, sans-serif; fill: currentColor; }
    .axis { stroke: #666; stroke-width: 1; }
    .grid { stroke: #333; stroke-width: 0.5; stroke-dasharray: 4,4; }
    .line { stroke: #3b82f6; stroke-width: 2.5; fill: none; }
    .area { fill: rgba(59,130,246,0.1); }
    .zone-low { fill: rgba(34,197,94,0.15); }
    .zone-high { fill: rgba(239,68,68,0.15); }
    .label { font-size: 11px; }
    .title { font-size: 14px; font-weight: 600; }
    .source { font-size: 9px; fill: #888; }
  </style>

  <!-- Background zones -->
  <rect x="60" y="40" width="470" height="60" class="zone-low"/>
  <rect x="60" y="100" width="470" height="200" fill="none"/>
  <rect x="60" y="300" width="470" height="40" class="zone-high"/>

  <!-- Grid lines -->
  <line x1="60" y1="100" x2="530" y2="100" class="grid"/>
  <line x1="60" y1="160" x2="530" y2="160" class="grid"/>
  <line x1="60" y1="220" x2="530" y2="220" class="grid"/>
  <line x1="60" y1="280" x2="530" y2="280" class="grid"/>
  <line x1="60" y1="340" x2="530" y2="340" class="grid"/>

  <!-- Axes -->
  <line x1="60" y1="40" x2="60" y2="340" class="axis"/>
  <line x1="60" y1="340" x2="530" y2="340" class="axis"/>

  <!-- Y-axis labels -->
  <text x="50" y="44" text-anchor="end" class="label">100%</text>
  <text x="50" y="104" text-anchor="end" class="label">80%</text>
  <text x="50" y="164" text-anchor="end" class="label">60%</text>
  <text x="50" y="224" text-anchor="end" class="label">40%</text>
  <text x="50" y="284" text-anchor="end" class="label">20%</text>
  <text x="50" y="344" text-anchor="end" class="label">0%</text>

  <!-- X-axis labels -->
  <text x="80" y="360" text-anchor="middle" class="label">2005</text>
  <text x="140" y="360" text-anchor="middle" class="label">2007</text>
  <text x="200" y="360" text-anchor="middle" class="label">2009</text>
  <text x="260" y="360" text-anchor="middle" class="label">2011</text>
  <text x="320" y="360" text-anchor="middle" class="label">2014</text>
  <text x="380" y="360" text-anchor="middle" class="label">2017</text>
  <text x="440" y="360" text-anchor="middle" class="label">2021</text>
  <text x="500" y="360" text-anchor="middle" class="label">2024</text>

  <!-- PE Percentile line (approximate historical data) -->
  <polyline class="line" points="
    80,300
    100,280
    120,60
    140,320
    170,290
    200,250
    230,180
    260,290
    290,140
    320,290
    350,120
    380,160
    410,200
    440,110
    470,180
    500,260
  "/>

  <!-- Key data points -->
  <circle cx="120" cy="60" r="4" fill="#ef4444"/>
  <circle cx="140" cy="320" r="4" fill="#22c55e"/>
  <circle cx="260" cy="290" r="4" fill="#22c55e"/>
  <circle cx="350" cy="120" r="4" fill="#3b82f6"/>
  <circle cx="440" cy="110" r="4" fill="#3b82f6"/>
  <circle cx="500" cy="260" r="4" fill="#22c55e"/>

  <!-- Zone labels -->
  <text x="80" y="55" class="label" fill="#22c55e">Undervalued (0-20%)</text>
  <text x="80" y="315" class="label" fill="#ef4444">Overvalued (80-100%)</text>

  <!-- Title -->
  <text x="280" y="20" text-anchor="middle" class="title">CSI 300 PE Ratio Historical Percentile (2005-2025)</text>

  <!-- Source -->
  <text x="280" y="375" text-anchor="middle" class="source">Source: Wind, China Securities Index Co., Ltd.</text>
</svg>
