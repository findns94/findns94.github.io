<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 560 380"
  style="max-width: 100%; height: auto; font-family: 'Inter', system-ui, sans-serif"
  role="img"
  aria-label="Lollipop chart: Listing price CNY 5.0M vs intrinsic value CNY 1.85M at 3.5% yield and CNY 1.62M at 4.0% yield."
>
  <title>Listing Price vs. Intrinsic Value — Worked Example</title>
  <desc>A CNY 5.0M Shanghai apartment compared against its intrinsic value at 3.5% and 4.0% required rental yields. Intrinsic value = Net Operating Income / Required Yield. Gross rent CNY 72,000/yr less ~10% costs = CNY 64,800 NOI. At 3.5% yield intrinsic value is CNY 1.85M; at 4.0% it is CNY 1.62M. The listing sits 170-200% above intrinsic value.</desc>
  <text x="280" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor">Listing Price vs. Intrinsic Value — Worked Example</text>
  <line x1="165" y1="280.9" x2="500" y2="280.9" stroke="currentColor" opacity="0.08" />
  <text x="157" y="284.9" text-anchor="end" font-size="10" fill="currentColor" opacity="0.55">CNY 1M</text>
  <line x1="165" y1="231.8" x2="500" y2="231.8" stroke="currentColor" opacity="0.08" />
  <text x="157" y="235.8" text-anchor="end" font-size="10" fill="currentColor" opacity="0.55">CNY 2M</text>
  <line x1="165" y1="182.7" x2="500" y2="182.7" stroke="currentColor" opacity="0.08" />
  <text x="157" y="186.7" text-anchor="end" font-size="10" fill="currentColor" opacity="0.55">CNY 3M</text>
  <line x1="165" y1="133.6" x2="500" y2="133.6" stroke="currentColor" opacity="0.08" />
  <text x="157" y="137.6" text-anchor="end" font-size="10" fill="currentColor" opacity="0.55">CNY 4M</text>
  <line x1="165" y1="84.5" x2="500" y2="84.5" stroke="currentColor" opacity="0.08" />
  <text x="157" y="88.5" text-anchor="end" font-size="10" fill="currentColor" opacity="0.55">CNY 5M</text>
  <line x1="165" y1="330" x2="500" y2="330" stroke="currentColor" opacity="0.3" />
  <line x1="165" y1="105.0" x2="263.7" y2="105.0" stroke="currentColor" opacity="0.15" stroke-width="2" />
  <circle cx="263.7" cy="105.0" r="7" fill="#22c55e" />
  <text x="275.7" y="109.0" font-size="12" font-weight="700" fill="currentColor">CNY 1.62M</text>
  <text x="157.0" y="109.0" text-anchor="end" font-size="11" fill="currentColor" opacity="0.8">Intrinsic @ 4.0% yield</text>
  <line x1="165" y1="195.0" x2="277.7" y2="195.0" stroke="currentColor" opacity="0.15" stroke-width="2" />
  <circle cx="277.7" cy="195.0" r="7" fill="#38bdf8" />
  <text x="289.7" y="199.0" font-size="12" font-weight="700" fill="currentColor">CNY 1.85M</text>
  <text x="157.0" y="199.0" text-anchor="end" font-size="11" fill="currentColor" opacity="0.8">Intrinsic @ 3.5% yield</text>
  <line x1="165" y1="285.0" x2="469.5" y2="285.0" stroke="currentColor" opacity="0.15" stroke-width="2" />
  <circle cx="469.5" cy="285.0" r="7" fill="#f97316" />
  <text x="481.5" y="289.0" font-size="12" font-weight="700" fill="currentColor">CNY 5.00M</text>
  <text x="157.0" y="289.0" text-anchor="end" font-size="11" fill="currentColor" opacity="0.8">Listing price</text>
  <text x="280" y="372" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.35">Author calculation based on Shanghai rental data (Numbeo, 2026)</text>
</svg>