  <line x1="130" y1="83.8" x2="505" y2="83.8" stroke="currentColor" opacity="0.08" />
  <text x="122.0" y="87.8" text-anchor="end" font-size="10" fill="currentColor" opacity="0.55">60x</text>
  <line x1="130" y1="310" x2="505" y2="310" stroke="currentColor" opacity="0.3" />
  <rect x="130.0" y="96.5" width="101.7" height="213.5" rx="4" fill="#f97316" />
