  <text x="122.0" y="276.3" text-anchor="end" font-size="10" fill="currentColor" opacity="0.55">10x</text>
  <line x1="130" y1="234.6" x2="505" y2="234.6" stroke="currentColor" opacity="0.08" />
  <text x="122.0" y="238.6" text-anchor="end" font-size="10" fill="currentColor" opacity="0.55">20x</text>
  <line x1="130" y1="196.9" x2="505" y2="196.9" stroke="currentColor" opacity="0.08" />
  <text x="122.0" y="200.9" text-anchor="end" font-size="10" fill="currentColor" opacity="0.55">30x</text>
  <line x1="130" y1="159.2" x2="505" y2="159.2" stroke="currentColor" opacity="0.08" />
  <text x="122.0" y="163.2" text-anchor="end" font-size="10" fill="currentColor" opacity="0.55">40x</text>
