<svg viewBox="0 0 560 380" role="img" aria-label="Linux Kernel 7.2 vs 6.8 Feature Comparison" xmlns="http://www.w3.org/2000/svg">
  <title>Linux Kernel 7.2 vs 6.8 Feature Comparison</title>
  <desc>Grouped bar chart comparing key features between Linux 7.2 and 6.8: new commits, drivers added, filesystems updated, and security fixes.</desc>
  <style>
    text { font-family: 'Inter', system-ui, sans-serif; fill: currentColor; }
    .bar-72 { fill: #3b82f6; }
    .bar-68 { fill: #6b7280; }
    .axis { stroke: #4b5563; stroke-width: 1; }
    .grid { stroke: #374151; stroke-width: 0.5; stroke-dasharray: 4,4; }
  </style>
  <rect width="560" height="380" fill="transparent"/>
  <text x="280" y="30" text-anchor="middle" font-size="16" font-weight="600">Linux 7.2 vs 6.8: Key Metrics</text>
  <text x="280" y="50" text-anchor="middle" font-size="11" opacity="0.7">Comparison of major changes between kernel versions</text>
  <!-- Y axis -->
  <line x1="60" y1="70" x2="60" y2="290" class="axis"/>
  <!-- X axis -->
  <line x1="60" y1="290" x2="520" y2="290" class="axis"/>
  <!-- Grid lines -->
  <line x1="60" y1="240" x2="520" y2="240" class="grid"/>
  <line x1="60" y1="190" x2="520" y2="190" class="grid"/>
  <line x1="60" y1="140" x2="520" y2="140" class="grid"/>
  <line x1="60" y1="90" x2="520" y2="90" class="grid"/>
  <!-- Y labels -->
  <text x="50" y="294" text-anchor="end" font-size="10">0</text>
  <text x="50" y="244" text-anchor="end" font-size="10">500</text>
  <text x="50" y="194" text-anchor="end" font-size="10">1000</text>
  <text x="50" y="144" text-anchor="end" font-size="10">1500</text>
  <text x="50" y="94" text-anchor="end" font-size="10">2000</text>
  <!-- Group 1: New Commits -->
  <rect x="100" y="118" width="50" height="172" class="bar-68" rx="3"/>
  <rect x="160" y="84" width="50" height="206" class="bar-72" rx="3"/>
  <text x="125" y="305" text-anchor="middle" font-size="10">6.8</text>
  <text x="185" y="305" text-anchor="middle" font-size="10">7.2</text>
  <text x="155" y="320" text-anchor="middle" font-size="11" font-weight="500">Commits</text>
  <text x="125" y="112" text-anchor="middle" font-size="10" class="bar-68" fill="#9ca3af">~1,200</text>
  <text x="185" y="78" text-anchor="middle" font-size="10" class="bar-72" fill="#60a5fa">1,800+</text>
  <!-- Group 2: Drivers -->
  <rect x="250" y="190" width="50" height="100" class="bar-68" rx="3"/>
  <rect x="310" y="158" width="50" height="132" class="bar-72" rx="3"/>
  <text x="275" y="305" text-anchor="middle" font-size="10">6.8</text>
  <text x="335" y="305" text-anchor="middle" font-size="10">7.2</text>
  <text x="305" y="320" text-anchor="middle" font-size="11" font-weight="500">Drivers</text>
  <text x="275" y="184" text-anchor="middle" font-size="10" fill="#9ca3af">~400</text>
  <text x="335" y="152" text-anchor="middle" font-size="10" fill="#60a5fa">~530</text>
  <!-- Group 3: Filesystems -->
  <rect x="400" y="238" width="50" height="52" class="bar-68" rx="3"/>
  <rect x="460" y="218" width="50" height="72" class="bar-72" rx="3"/>
  <text x="425" y="305" text-anchor="middle" font-size="10">6.8</text>
  <text x="485" y="305" text-anchor="middle" font-size="10">7.2</text>
  <text x="455" y="320" text-anchor="middle" font-size="11" font-weight="500">FS Updates</text>
  <text x="425" y="232" text-anchor="middle" font-size="10" fill="#9ca3af">~130</text>
  <text x="485" y="212" text-anchor="middle" font-size="10" fill="#60a5fa">~200</text>
  <!-- Legend -->
  <rect x="160" y="345" width="14" height="14" class="bar-68" rx="2"/>
  <text x="180" y="356" font-size="11">Linux 6.8</text>
  <rect x="280" y="345" width="14" height="14" class="bar-72" rx="2"/>
  <text x="300" y="356" font-size="11">Linux 7.2</text>
  <!-- Source -->
  <text x="280" y="372" text-anchor="middle" font-size="9" opacity="0.5">Source: kernel.org release notes, 2026</text>
</svg>
