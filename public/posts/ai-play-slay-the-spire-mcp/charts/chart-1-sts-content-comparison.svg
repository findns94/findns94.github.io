<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" role="img" aria-label="Chart: Slay the Spire 1 vs Slay the Spire 2 Early Access content volume comparison across three categories. Cards: STS1 375, STS2 250. Relics: STS1 150, STS2 120. Enemies: STS1 160, STS2 110.">
  <title>Slay the Spire 1 vs Slay the Spire 2 Early Access content volume</title>
  <desc>Horizontal bar chart comparing content volume between Slay the Spire 1 (full release) and Slay the Spire 2 (Early Access, March 2025) across three categories: Cards, Relics, and Enemies. STS1 leads in all categories, but STS2 is a moving target that grows with each update.</desc>
  <style>
    text { font-family: 'Inter', system-ui, sans-serif; fill: currentColor; }
    .title { font-size: 15px; font-weight: 700; }
    .subtitle { font-size: 11px; opacity: 0.65; }
    .catlabel { font-size: 12px; font-weight: 600; }
    .valuelabel { font-size: 11px; font-weight: 600; fill: #ffffff; }
    .valuelabel-out { font-size: 11px; font-weight: 600; }
    .legend { font-size: 11px; }
    .source { font-size: 9.5px; opacity: 0.55; }
    .gridline { stroke: currentColor; stroke-opacity: 0.08; stroke-width: 1; }
  </style>

  <!-- Title -->
  <text x="20" y="28" class="title">Slay the Spire 1 vs 2: Content Volume</text>
  <text x="20" y="44" class="subtitle">Full release (STS1) vs Early Access launch (STS2, March 2025). STS2 is a moving target.</text>

  <!-- Legend -->
  <rect x="380" y="22" width="12" height="12" rx="2" fill="#6366f1"/>
  <text x="397" y="32" class="legend">Slay the Spire 1</text>
  <rect x="510" y="22" width="12" height="12" rx="2" fill="#f59e0b"/>
  <text x="527" y="32" class="legend">Slay the Spire 2 (EA)</text>

  <!-- Chart area: baseline x=120, max x=500, scale 380px = 400 units -->
  <!-- Gridlines at 0, 100, 200, 300, 400 -->
  <line x1="120" y1="70" x2="120" y2="300" class="gridline" stroke-opacity="0.18"/>
  <line x1="215" y1="70" x2="215" y2="300" class="gridline"/>
  <line x1="310" y1="70" x2="310" y2="300" class="gridline"/>
  <line x1="405" y1="70" x2="405" y2="300" class="gridline"/>
  <line x1="500" y1="70" x2="500" y2="300" class="gridline"/>

  <!-- X-axis labels -->
  <text x="120" y="316" text-anchor="middle" class="subtitle">0</text>
  <text x="215" y="316" text-anchor="middle" class="subtitle">100</text>
  <text x="310" y="316" text-anchor="middle" class="subtitle">200</text>
  <text x="405" y="316" text-anchor="middle" class="subtitle">300</text>
  <text x="500" y="316" text-anchor="middle" class="subtitle">400</text>

  <!-- Scale: 400 units = 380px, so 1 unit = 0.95px -->
  <!-- Row 1: Cards (STS1=375 -> 356px, STS2=250 -> 238px) -->
  <text x="115" y="101" text-anchor="end" class="catlabel">Cards</text>
  <rect x="120" y="87" width="356" height="18" rx="3" fill="#6366f1"/>
  <text x="481" y="100" class="valuelabel">375</text>
  <rect x="120" y="109" width="238" height="18" rx="3" fill="#f59e0b"/>
  <text x="363" y="122" class="valuelabel">~250</text>

  <!-- Row 2: Relics (STS1=150 -> 143px, STS2=120 -> 114px) -->
  <text x="115" y="155" text-anchor="end" class="catlabel">Relics</text>
  <rect x="120" y="141" width="143" height="18" rx="3" fill="#6366f1"/>
  <text x="268" y="154" class="valuelabel">150</text>
  <rect x="120" y="163" width="114" height="18" rx="3" fill="#f59e0b"/>
  <text x="239" y="176" class="valuelabel">~120</text>

  <!-- Row 3: Enemies (STS1=160 -> 152px, STS2=110 -> 105px) -->
  <text x="115" y="209" text-anchor="end" class="catlabel">Enemies</text>
  <rect x="120" y="195" width="152" height="18" rx="3" fill="#6366f1"/>
  <text x="277" y="208" class="valuelabel">160</text>
  <rect x="120" y="217" width="105" height="18" rx="3" fill="#f59e0b"/>
  <text x="230" y="230" class="valuelabel">~110</text>

  <!-- Note -->
  <text x="20" y="272" class="subtitle">STS2 values are approximate Early Access counts and increase with each content patch.</text>

  <!-- Source -->
  <text x="20" y="338" class="source">Source: Mega Crit Games, Slay the Spire Wiki, community documentation (2025)</text>
</svg>
