<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" role="img" aria-label="Chart: MCP ecosystem growth timeline from November 2024 to mid 2025. Nov 2024: open-sourced with dozens of servers. Jan 2025: 500 servers. Mar 2025: OpenAI adopts MCP. Apr 2025: Google DeepMind adopts MCP. Jun 2025: 1000+ servers milestone.">
  <title>MCP ecosystem growth: server count and adoption milestones, Nov 2024 - Jun 2025</title>
  <desc>Line chart with milestone markers showing the growth of the Model Context Protocol ecosystem. The number of publicly available MCP servers grew from dozens at open-source launch in November 2024 to over 1,000 by mid 2025, with major adoption announcements from OpenAI in March 2025 and Google DeepMind in April 2025.</desc>
  <style>
    text { font-family: 'Inter', system-ui, sans-serif; fill: currentColor; }
    .title { font-size: 15px; font-weight: 700; }
    .subtitle { font-size: 11px; opacity: 0.65; }
    .axislabel { font-size: 10px; opacity: 0.6; }
    .milestone { font-size: 10px; font-weight: 600; }
    .milestone-sub { font-size: 9px; opacity: 0.7; }
    .source { font-size: 9.5px; opacity: 0.55; }
    .gridline { stroke: currentColor; stroke-opacity: 0.08; stroke-width: 1; }
    .dataline { stroke: #6366f1; stroke-width: 2.5; fill: none; }
    .datafill { fill: #6366f1; fill-opacity: 0.08; }
    .datadot { fill: #6366f1; }
    .annoline { stroke: currentColor; stroke-opacity: 0.2; stroke-width: 1; stroke-dasharray: 3 3; }
  </style>

  <!-- Title -->
  <text x="20" y="28" class="title">MCP Ecosystem Growth: Nov 2024 - Jun 2025</text>
  <text x="20" y="44" class="subtitle">Public MCP server count and major adoption milestones. The ecosystem crossed 1,000+ servers in under a year.</text>

  <!-- Chart area: x 80-620, y 70-280 -->
  <!-- Y-axis: 0 to 1200, baseline y=280 -->
  <!-- Gridlines + labels -->
  <line x1="80" y1="280" x2="620" y2="280" class="gridline" stroke-opacity="0.2"/>
  <text x="75" y="284" text-anchor="end" class="axislabel">0</text>

  <line x1="80" y1="228" x2="620" y2="228" class="gridline"/>
  <text x="75" y="232" text-anchor="end" class="axislabel">250</text>

  <line x1="80" y1="176" x2="620" y2="176" class="gridline"/>
  <text x="75" y="180" text-anchor="end" class="axislabel">500</text>

  <line x1="80" y1="124" x2="620" y2="124" class="gridline"/>
  <text x="75" y="128" text-anchor="end" class="axislabel">750</text>

  <line x1="80" y1="72" x2="620" y2="72" class="gridline"/>
  <text x="75" y="76" text-anchor="end" class="axislabel">1000+</text>

  <!-- X-axis: 6 time points, Nov24 to Jun25 -->
  <!-- positions: Nov24=80, Jan25=188, Mar25=296, Apr25=368, May25=440, Jun25=548 -->
  <text x="80" y="300" text-anchor="middle" class="axislabel">Nov 24</text>
  <text x="188" y="300" text-anchor="middle" class="axislabel">Jan 25</text>
  <text x="296" y="300" text-anchor="middle" class="axislabel">Mar 25</text>
  <text x="368" y="300" text-anchor="middle" class="axislabel">Apr 25</text>
  <text x="440" y="300" text-anchor="middle" class="axislabel">May 25</text>
  <text x="548" y="300" text-anchor="middle" class="axislabel">Jun 25</text>

  <!-- Data points (servers count): Nov24=20, Jan25=500, Mar25=700, Apr25=800, May25=900, Jun25=1000 -->
  <!-- y = 280 - (count/1000 * 208) -->
  <!-- Nov24: 20 -> 276; Jan25: 500 -> 176; Mar25: 700 -> 134; Apr25: 800 -> 114; May25: 900 -> 93; Jun25: 1000 -> 72 -->
  <!-- Area fill path -->
  <path d="M 80 276 L 188 176 L 296 134 L 368 114 L 440 93 L 548 72 L 548 280 L 80 280 Z" class="datafill"/>
  <!-- Line -->
  <polyline points="80,276 188,176 296,134 368,114 440,93 548,72" class="dataline"/>

  <!-- Data dots -->
  <circle cx="80" cy="276" r="4" class="datadot"/>
  <circle cx="188" cy="176" r="4" class="datadot"/>
  <circle cx="296" cy="134" r="4" class="datadot"/>
  <circle cx="368" cy="114" r="4" class="datadot"/>
  <circle cx="440" cy="93" r="4" class="datadot"/>
  <circle cx="548" cy="72" r="5" class="datadot"/>

  <!-- Value labels -->
  <text x="80" y="268" text-anchor="middle" class="milestone">~20</text>
  <text x="188" y="168" text-anchor="middle" class="milestone">500</text>
  <text x="296" y="126" text-anchor="middle" class="milestone">700</text>
  <text x="368" y="106" text-anchor="middle" class="milestone">800</text>
  <text x="440" y="85" text-anchor="middle" class="milestone">900</text>
  <text x="548" y="62" text-anchor="middle" class="milestone">1000+</text>

  <!-- Milestone annotations -->
  <!-- OpenAI adoption at Mar25 (up-left, clear of the 500 and 700 labels) -->
  <line x1="296" y1="134" x2="238" y2="98" class="annoline"/>
  <text x="236" y="98" text-anchor="end" class="milestone" fill="#6366f1">OpenAI adopts MCP</text>
  <text x="236" y="110" text-anchor="end" class="milestone-sub">(Agents SDK, Mar 2025)</text>

  <!-- Google adoption at Apr25 (fanned down-right) -->
  <line x1="368" y1="114" x2="404" y2="150" class="annoline"/>
  <text x="406" y="174" class="milestone" fill="#6366f1">Google DeepMind</text>
  <text x="406" y="186" class="milestone-sub">(Gemini, Apr 2025)</text>

  <!-- Microsoft + Amazon note -->
  <text x="20" y="330" class="subtitle">Microsoft integrated MCP into GitHub Copilot and Windows 11; Amazon Bedrock added MCP support in the same period.</text>

  <!-- Source -->
  <text x="20" y="352" class="source">Source: Anthropic, OpenAI, Google DeepMind announcements; awesome-mcp-servers GitHub registry (2025)</text>
</svg>
