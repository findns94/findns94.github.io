<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380" role="img" aria-label="Horizontal bar chart comparing worldwide box office gross of epic mythology films: Nolan's Odyssey leads at 1.119 billion dollars, followed by Troy at 497 million, Clash of the Titans at 493 million, and 300 at 456 million">
<title>Mythology Epic Films by Worldwide Box Office (2026 USD)</title>
<desc>Horizontal bar chart of worldwide box office gross for epic mythology adaptations. The Odyssey (2026): $1.119B. Troy (2004): $497M. Clash of the Titans (2010): $493M. 300 (2007): $456M. The Odyssey nearly doubles the previous genre leader. Source: Box Office Mojo / The Numbers, 2026.</desc>
<style>
  :root { --fg: #1f2937; --fg-min: #374151; --grid: rgba(0,0,0,0.08); --axis: rgba(0,0,0,0.32); }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #f3f4f6; --fg-min: #9ca3af; --grid: rgba(255,255,255,0.08); --axis: rgba(255,255,255,0.32); }
  }
  text { fill: var(--fg); font-family: 'Inter', system-ui, sans-serif; }
  .tick { fill: var(--fg-min); opacity: 0.55; }
  .lbl { fill: var(--fg-min); opacity: 0.8; }
  .op35 { fill: var(--fg-min); opacity: 0.35; }
  .op70 { fill: var(--fg); opacity: 0.7; }
  .line-grid { stroke: var(--grid); stroke-width: 0.3; }
  .axis { stroke: var(--axis); stroke-width: 1; }
</style>
<text x="280" y="28" text-anchor="middle" font-size="15" font-weight="700">Mythology Epic Films by Worldwide Box Office</text>
<text class="tick" x="280" y="46" text-anchor="middle" font-size="11">Gross revenue in millions USD (2026 dollars adjusted)</text>
