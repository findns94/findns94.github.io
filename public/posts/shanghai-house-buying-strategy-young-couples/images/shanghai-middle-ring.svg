<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="Middle-ring Shanghai residential blocks alongside a metro overpass">
  <title>Middle-ring residential architecture along a Shanghai metro overpass</title>
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8eef7"/>
      <stop offset="1" stop-color="#cdd8ea"/>
    </linearGradient>
  </defs>
  <rect width="900" height="360" fill="url(#sky2)"/>

  <!-- metro track / overpass -->
  <rect x="0" y="178" width="900" height="14" fill="#5a6470"/>
  <rect x="0" y="192" width="900" height="4"  fill="#3a424e"/>
  <rect x="60"  y="150" width="8" height="60" fill="#3a424e"/>
  <rect x="220" y="150" width="8" height="60" fill="#3a424e"/>
  <rect x="380" y="150" width="8" height="60" fill="#3a424e"/>
  <rect x="540" y="150" width="8" height="60" fill="#3a424e"/>
  <rect x="700" y="150" width="8" height="60" fill="#3a424e"/>
  <rect x="820" y="150" width="8" height="60" fill="#3a424e"/>
  <!-- train -->
  <rect x="470" y="144" width="120" height="34" rx="6" fill="#2a7de1"/>
  <rect x="480" y="150" width="18" height="14" rx="2" fill="#cfe3f7"/>
  <rect x="504" y="150" width="18" height="14" rx="2" fill="#cfe3f7"/>
  <rect x="528" y="150" width="18" height="14" rx="2" fill="#cfe3f7"/>
  <rect x="552" y="150" width="18" height="14" rx="2" fill="#cfe3f7"/>

  <!-- mid-rise residential towers -->
  <g>
    <!-- block 1 -->
    <rect x="40"  y="200" width="60" height="200" fill="#7d8aa0" stroke="#5a6470" stroke-width="0.6"/>
    <g fill="#f4f0e6" opacity="0.9">
      <rect x="48"  y="210" width="6" height="6"/><rect x="58" y="210" width="6" height="6"/><rect x="68" y="210" width="6" height="6"/><rect x="78" y="210" width="6" height="6"/><rect x="88" y="210" width="6" height="6"/>
      <rect x="48"  y="224" width="6" height="6"/><rect x="58" y="224" width="6" height="6"/><rect x="68" y="224" width="6" height="6"/><rect x="78" y="224" width="6" height="6"/><rect x="88" y="224" width="6" height="6"/>
      <rect x="48"  y="238" width="6" height="6"/><rect x="58" y="238" width="6" height="6"/><rect x="68" y="238" width="6" height="6"/><rect x="78" y="238" width="6" height="6"/><rect x="88" y="238" width="6" height="6"/>
      <rect x="48"  y="252" width="6" height="6"/><rect x="58" y="252" width="6" height="6"/><rect x="68" y="252" width="6" height="6"/><rect x="78" y="252" width="6" height="6"/><rect x="88" y="252" width="6" height="6"/>
      <rect x="48"  y="340" width="6" height="6"/><rect x="58" y="340" width="6" height="6"/><rect x="68" y="340" width="6" height="6"/><rect x="78" y="340" width="6" height="6"/><rect x="88" y="340" width="6" height="6"/>
    </g>
    <!-- block 2 -->
    <rect x="120" y="180" width="70" height="220" fill="#9aa6ba" stroke="#5a6470" stroke-width="0.6"/>
    <g fill="#f6efe1" opacity="0.9">
      <rect x="130" y="194" width="6" height="6"/><rect x="144" y="194" width="6" height="6"/><rect x="158" y="194" width="6" height="6"/><rect x="172" y="194" width="6" height="6"/>
      <rect x="130" y="212" width="6" height="6"/><rect x="144" y="212" width="6" height="6"/><rect x="158" y="212" width="6" height="6"/><rect x="172" y="212" width="6" height="6"/>
      <rect x="130" y="230" width="6" height="6"/><rect x="144" y="230" width="6" height="6"/><rect x="158" y="230" width="6" height="6"/><rect x="172" y="230" width="6" height="6"/>
    </g>
    <!-- block 3 tall -->
    <rect x="240" y="140" width="50" height="260" fill="#6b7790" stroke="#5a6470" stroke-width="0.6"/>
    <g fill="#eef3fa" opacity="0.95">
      <rect x="249" y="154" width="5" height="5"/><rect x="259" y="154" width="5" height="5"/><rect x="269" y="154" width="5" height="5"/><rect x="279" y="154" width="5" height="5"/>
      <rect x="249" y="167" width="5" height="5"/><rect x="259" y="167" width="5" height="5"/><rect x="269" y="167" width="5" height="5"/><rect x="279" y="167" width="5" height="5"/>
      <rect x="249" y="180" width="5" height="5"/><rect x="259" y="180" width="5" height="5"/><rect x="269" y="180" width="5" height="5"/><rect x="279" y="180" width="5" height="5"/>
      <rect x="249" y="280" width="5" height="5"/><rect x="259" y="280" width="5" height="5"/><rect x="269" y="280" width="5" height="5"/><rect x="279" y="280" width="5" height="5"/>
    </g>
    <!-- block 4 -->
    <rect x="320" y="200" width="60" height="200" fill="#a3adc0" stroke="#5a6470" stroke-width="0.6"/>
    <g fill="#f7f1e3" opacity="0.9">
      <rect x="329" y="212" width="6" height="6"/><rect x="341" y="212" width="6" height="6"/><rect x="353" y="212" width="6" height="6"/><rect x="365" y="212" width="6" height="6"/>
      <rect x="329" y="226" width="6" height="6"/><rect x="341" y="226" width="6" height="6"/><rect x="353" y="226" width="6" height="6"/><rect x="365" y="226" width="6" height="6"/>
    </g>
    <!-- block 5 -->
    <rect x="720" y="190" width="70" height="210" fill="#8a96ad" stroke="#5a6470" stroke-width="0.6"/>
    <g fill="#f5eedf" opacity="0.9">
      <rect x="730" y="204" width="6" height="6"/><rect x="744" y="204" width="6" height="6"/><rect x="758" y="204" width="6" height="6"/><rect x="772" y="204" width="6" height="6"/>
      <rect x="730" y="222" width="6" height="6"/><rect x="744" y="222" width="6" height="6"/><rect x="758" y="222" width="6" height="6"/><rect x="772" y="222" width="6" height="6"/>
    </g>
    <!-- block 6 -->
    <rect x="810" y="210" width="55" height="190" fill="#7d8aa0" stroke="#5a6470" stroke-width="0.6"/>
  </g>

  <!-- ground / street -->
  <rect x="0" y="398" width="900" height="122" fill="#3c4654"/>
  <rect x="0" y="398" width="900" height="6" fill="#ffd24d"/>
  <!-- trees -->
  <g fill="#2f7d4f">
    <circle cx="210" cy="385" r="14"/><circle cx="310" cy="385" r="14"/><circle cx="700" cy="385" r="14"/>
  </g>
  <g fill="#5a4632">
    <rect x="208" y="395" width="4" height="12"/><rect x="308" y="395" width="4" height="12"/><rect x="698" y="395" width="4" height="12"/>
  </g>
</svg>
