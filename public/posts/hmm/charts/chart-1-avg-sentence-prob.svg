<svg xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 600 420"
  style="max-width: 100%; height: auto; font-family: 'Inter', system-ui, sans-serif"
  role="img"
  aria-labelledby="chart1-title chart1-desc">
  <title id="chart1-title">Average Sentence Probability by Method (Test Corpus)</title>
  <desc id="chart1-desc">Horizontal bar chart on a logarithmic scale showing average sentence probability on the test corpus for six methods. good_turing_bigram: 7.07E-03 (highest); back_off_trigram: 1.01E-05; good_turing_unigram: 1.36E-06; add_one_unigram: 8.36E-07; hmm: 1.16E-08; add_one_bigram: 1.03E-10 (lowest). The HMM ranks 5th out of 6 methods. Source: Original experiment data, 2019.</desc>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor">Average Sentence Probability by Method (Test Corpus)</text>
  <text x="300" y="42" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.5">Logarithmic scale (10⁻¹⁰ to 10⁻²). Bar length represents orders of magnitude.</text>

  <!-- Log-scale gridlines at decade positions: 10^-10, 10^-8, 10^-6, 10^-4, 10^-2 -->
  <!-- baseline x=160 (10^-10), max x=560 (10^-2) -->
  <line x1="160" y1="56" x2="160" y2="350" stroke="currentColor" opacity="0.3"/>
  <line x1="260" y1="56" x2="260" y2="350" stroke="currentColor" opacity="0.08"/>
  <line x1="360" y1="56" x2="360" y2="350" stroke="currentColor" opacity="0.08"/>
  <line x1="460" y1="56" x2="460" y2="350" stroke="currentColor" opacity="0.08"/>
  <line x1="560" y1="56" x2="560" y2="350" stroke="currentColor" opacity="0.08"/>

  <!-- Gridline labels -->
  <text x="160" y="366" text-anchor="middle" font-size="9" fill="currentColor" opacity="0.45">10⁻¹⁰</text>
  <text x="260" y="366" text-anchor="middle" font-size="9" fill="currentColor" opacity="0.45">10⁻⁸</text>
  <text x="360" y="366" text-anchor="middle" font-size="9" fill="currentColor" opacity="0.45">10⁻⁶</text>
  <text x="460" y="366" text-anchor="middle" font-size="9" fill="currentColor" opacity="0.45">10⁻⁴</text>
  <text x="560" y="366" text-anchor="middle" font-size="9" fill="currentColor" opacity="0.45">10⁻²</text>

  <!-- Bars (sorted descending by value) -->
  <!-- good_turing_bigram: 7.07E-03, log=-2.151, x=160+(7.849/8)*400=552 -->
  <rect x="160" y="60" width="392" height="38" rx="4" fill="#38bdf8"/>
  <text x="152" y="84" text-anchor="end" font-size="10" fill="currentColor" opacity="0.8">good_turing_bigram</text>
  <text x="558" y="84" text-anchor="start" font-size="10" fill="currentColor" opacity="0.8">7.07E-03</text>

  <!-- back_off_trigram: 1.01E-05, log=-4.996, x=160+(5.004/8)*400=410 -->
  <rect x="160" y="110" width="250" height="38" rx="4" fill="#38bdf8"/>
  <text x="152" y="134" text-anchor="end" font-size="10" fill="currentColor" opacity="0.8">back_off_trigram</text>
  <text x="416" y="134" text-anchor="start" font-size="10" fill="currentColor" opacity="0.8">1.01E-05</text>

  <!-- good_turing_unigram: 1.36E-06, log=-5.867, x=160+(4.133/8)*400=367 -->
  <rect x="160" y="160" width="207" height="38" rx="4" fill="#38bdf8"/>
  <text x="152" y="184" text-anchor="end" font-size="10" fill="currentColor" opacity="0.8">good_turing_unigram</text>
  <text x="373" y="184" text-anchor="start" font-size="10" fill="currentColor" opacity="0.8">1.36E-06</text>

  <!-- add_one_unigram: 8.36E-07, log=-6.078, x=160+(3.922/8)*400=356 -->
  <rect x="160" y="210" width="196" height="38" rx="4" fill="#38bdf8"/>
  <text x="152" y="234" text-anchor="end" font-size="10" fill="currentColor" opacity="0.8">add_one_unigram</text>
  <text x="362" y="234" text-anchor="start" font-size="10" fill="currentColor" opacity="0.8">8.36E-07</text>

  <!-- hmm: 1.16E-08, log=-7.936, x=160+(2.064/8)*400=263 (highlighted) -->
  <rect x="160" y="260" width="103" height="38" rx="4" fill="#f97316"/>
  <text x="152" y="284" text-anchor="end" font-size="10" fill="currentColor" opacity="0.8">hmm</text>
  <text x="269" y="284" text-anchor="start" font-size="10" fill="currentColor" opacity="0.8">1.16E-08</text>

  <!-- add_one_bigram: 1.03E-10, log=-9.987, x=160+(0.013/8)*400=160.6, min width 20 -->
  <rect x="160" y="310" width="20" height="38" rx="4" fill="#38bdf8"/>
  <text x="152" y="334" text-anchor="end" font-size="10" fill="currentColor" opacity="0.8">add_one_bigram</text>
  <text x="186" y="334" text-anchor="start" font-size="10" fill="currentColor" opacity="0.8">1.03E-10</text>

  <!-- Source -->
  <text x="300" y="398" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.35">Source: Original experiment data, 2019. Logarithmic x-axis; bar length is proportional to log₁₀(probability).</text>
</svg>
