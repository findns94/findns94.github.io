<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 560 380"
  style="max-width: 100%; height: auto; font-family: 'Inter', system-ui, sans-serif"
  role="img"
  aria-labelledby="chart-title chart-desc">
  <title id="chart-title">China's Deflation Risk Decomposition</title>
  <desc id="chart-desc">Donut chart showing the estimated contribution of five factors to China's current deflationary pressure. Property crisis: 35% (the largest single factor, as real estate accounts for 25-30% of GDP and falling home prices destroy household wealth). Manufacturing overcapacity: 25% (excess capacity in EVs, solar, batteries floods domestic and export markets). Demographics and aging: 20% (323 million citizens over 60 structurally suppress aggregate demand). Export headwinds from tariffs: 12% (US tariffs above 60% redirect excess supply to domestic market). Weak consumer confidence: 8% (precautionary savings suppress spending). Source: synthesis of World Bank China Overview (2025), IMF World Economic Outlook (2025), National Bureau of Statistics of China.</desc>

  <!-- Donut segments -->
  <!-- Center: cx=210, cy=175, outer radius=130, inner radius=80 -->
  <!-- Segments calculated as cumulative percentages: -->
  <!-- Property: 35% -> 0% to 35% -> 0 to 126 degrees -->
  <!-- Overcapacity: 25% -> 35% to 60% -> 126 to 216 degrees -->
  <!-- Demographics: 20% -> 60% to 80% -> 216 to 288 degrees -->
  <!-- Tariffs: 12% -> 80% to 92% -> 288 to 331.2 degrees -->
  <!-- Confidence: 8% -> 92% to 100% -> 331.2 to 360 degrees -->

  <!-- Property crisis: 35% (orange) - 0 to 126 degrees -->
  <path d="M 210 45 A 130 130 0 0 1 315.17 251.42 L 274.72 222.01 A 80 80 0 0 0 210 95 Z" fill="#f97316"/>

  <!-- Manufacturing overcapacity: 25% (sky blue) - 126 to 216 degrees -->
  <path d="M 315.17 251.42 A 130 130 0 0 1 133.58 280.17 L 162.99 239.72 A 80 80 0 0 0 274.72 222.01 Z" fill="#38bdf8"/>

  <!-- Demographics: 20% (purple) - 216 to 288 degrees -->
  <path d="M 133.58 280.17 A 130 130 0 0 1 86.33 134.74 L 134.02 150.28 A 80 80 0 0 0 162.99 239.72 Z" fill="#a78bfa"/>

  <!-- Tariffs: 12% (green) - 288 to 331.2 degrees -->
  <path d="M 86.33 134.74 A 130 130 0 0 1 140.22 63.92 L 167.01 106.55 A 80 80 0 0 0 134.02 150.28 Z" fill="#22c55e"/>

  <!-- Confidence: 8% (amber) - 331.2 to 360 degrees -->
  <path d="M 140.22 63.92 A 130 130 0 0 1 210 45 L 210 95 A 80 80 0 0 0 167.01 106.55 Z" fill="#fbbf24"/>

  <!-- Center text -->
  <text x="210" y="170" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.6">Deflation</text>
  <text x="210" y="190" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.6">Drivers</text>

  <!-- Legend - right side -->
  <rect x="370" y="80" width="12" height="12" rx="2" fill="#f97316"/>
  <text x="388" y="90" font-size="10" fill="currentColor" opacity="0.8">Property crisis (35%)</text>

  <rect x="370" y="106" width="12" height="12" rx="2" fill="#38bdf8"/>
  <text x="388" y="116" font-size="10" fill="currentColor" opacity="0.8">Overcapacity (25%)</text>

  <rect x="370" y="132" width="12" height="12" rx="2" fill="#a78bfa"/>
  <text x="388" y="142" font-size="10" fill="currentColor" opacity="0.8">Demographics (20%)</text>

  <rect x="370" y="158" width="12" height="12" rx="2" fill="#22c55e"/>
  <text x="388" y="168" font-size="10" fill="currentColor" opacity="0.8">Tariffs / exports (12%)</text>

  <rect x="370" y="184" width="12" height="12" rx="2" fill="#fbbf24"/>
  <text x="388" y="194" font-size="10" fill="currentColor" opacity="0.8">Consumer confidence (8%)</text>

  <!-- Insight callout -->
  <rect x="370" y="220" width="170" height="50" rx="6" fill="#f97316" opacity="0.08"/>
  <text x="380" y="240" font-size="9" fill="currentColor" opacity="0.7">Top 2 factors (property +</text>
  <text x="380" y="254" font-size="9" fill="currentColor" opacity="0.7">overcapacity) account for 60%</text>
  <text x="380" y="268" font-size="9" fill="currentColor" opacity="0.7">of deflationary pressure.</text>

  <!-- Source -->
  <text x="280" y="374" text-anchor="middle" font-size="8" fill="var(--chart-muted, currentColor)">Source: World Bank China Overview (2025), IMF WEO (2025), NBS China</text>
</svg>
