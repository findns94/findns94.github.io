<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 560 400"
  style="max-width: 100%; height: auto; font-family: 'Inter', system-ui, sans-serif"
  role="img"
  aria-labelledby="chart-title chart-desc">
  <title id="chart-title">CPI Trajectories: Deflation Onset to Recovery, 5 Countries</title>
  <desc id="chart-desc">Multi-line chart comparing Consumer Price Index (CPI) trajectories from deflation onset to recovery across five countries, with time normalized to years since deflation onset. US Great Depression (1929-1937): CPI fell to -10% at year 3, recovered to +3.5% by year 5. UK Post-WWI (1920-1925): CPI fell to -14% at year 1, recovered to 0% by year 4. France Gold Bloc (1929-1938): CPI fell to -7% at year 3, stayed negative for 7 years, recovered to +5% by year 9. Japan Lost Decades (1990-2015): CPI oscillated near 0% for 15+ years, briefly reached +2.7% at year 24 (Abenomics), then fell back. US GFC (2008-2012): CPI briefly hit -0.4% at year 1, recovered to +2% within 3 years. Source: Bordo, Lane and Redish (2004), Reinhart and Rogoff (2009), Atkeson and Weber (2023).</desc>

  <!-- Legend -->
  <line x1="70" y1="14" x2="94" y2="14" stroke="#f97316" stroke-width="2.5"/>
  <text x="100" y="18" font-size="9" fill="currentColor" opacity="0.8">US 1929-37</text>
  <line x1="175" y1="14" x2="199" y2="14" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="205" y="18" font-size="9" fill="currentColor" opacity="0.8">UK 1920-25</text>
  <line x1="280" y1="14" x2="304" y2="14" stroke="#a78bfa" stroke-width="2.5"/>
  <text x="310" y="18" font-size="9" fill="currentColor" opacity="0.8">France 1929-38</text>
  <line x1="70" y1="30" x2="94" y2="30" stroke="#22c55e" stroke-width="2.5"/>
  <text x="100" y="34" font-size="9" fill="currentColor" opacity="0.8">Japan 1990-2015</text>
  <line x1="175" y1="30" x2="199" y2="30" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="205" y="34" font-size="9" fill="currentColor" opacity="0.8">US 2008-12</text>

  <!-- Y-axis grid lines -->
  <!-- Y-axis: -12 to +16, range=28, px_per_unit=10, zero at y=190 -->
  <line x1="70" y1="30" x2="520" y2="30" stroke="currentColor" opacity="0.08"/>
  <text x="64" y="34" text-anchor="end" font-size="8" fill="currentColor" opacity="0.7">16</text>
  <line x1="70" y1="70" x2="520" y2="70" stroke="currentColor" opacity="0.08"/>
  <text x="64" y="74" text-anchor="end" font-size="8" fill="currentColor" opacity="0.7">12</text>
  <line x1="70" y1="110" x2="520" y2="110" stroke="currentColor" opacity="0.08"/>
  <text x="64" y="114" text-anchor="end" font-size="8" fill="currentColor" opacity="0.7">8</text>
  <line x1="70" y1="150" x2="520" y2="150" stroke="currentColor" opacity="0.08"/>
  <text x="64" y="154" text-anchor="end" font-size="8" fill="currentColor" opacity="0.7">4</text>
  <!-- Zero baseline -->
  <line x1="70" y1="190" x2="520" y2="190" stroke="currentColor" opacity="0.4" stroke-width="1.5"/>
  <text x="64" y="194" text-anchor="end" font-size="8" fill="currentColor" opacity="0.7">0</text>
  <line x1="70" y1="230" x2="520" y2="230" stroke="currentColor" opacity="0.08"/>
  <text x="64" y="234" text-anchor="end" font-size="8" fill="currentColor" opacity="0.7">-4</text>
  <line x1="70" y1="270" x2="520" y2="270" stroke="currentColor" opacity="0.08"/>
  <text x="64" y="274" text-anchor="end" font-size="8" fill="currentColor" opacity="0.7">-8</text>
  <line x1="70" y1="310" x2="520" y2="310" stroke="currentColor" opacity="0.08"/>
  <text x="64" y="314" text-anchor="end" font-size="8" fill="currentColor" opacity="0.7">-12</text>

  <!-- Y-axis label -->
  <text x="18" y="190" text-anchor="middle" font-size="8" fill="currentColor" opacity="0.6" transform="rotate(-90, 18, 190)">CPI (%)</text>

  <!-- X-axis labels: Year 0, 5, 10, 15, 20, 25 -->
  <text x="70" y="340" text-anchor="middle" font-size="8" fill="currentColor" opacity="0.7">0</text>
  <text x="160" y="340" text-anchor="middle" font-size="8" fill="currentColor" opacity="0.7">5</text>
  <text x="250" y="340" text-anchor="middle" font-size="8" fill="currentColor" opacity="0.7">10</text>
  <text x="340" y="340" text-anchor="middle" font-size="8" fill="currentColor" opacity="0.7">15</text>
  <text x="430" y="340" text-anchor="middle" font-size="8" fill="currentColor" opacity="0.7">20</text>
  <text x="520" y="340" text-anchor="middle" font-size="8" fill="currentColor" opacity="0.7">25</text>
  <text x="295" y="358" text-anchor="middle" font-size="8" fill="currentColor" opacity="0.6">Years since deflation onset</text>

  <!-- US Great Depression 1929-1937 (orange) -->
  <!-- Points: (0,0), (1,-2.3), (2,-9), (3,-10), (4,-5), (5,3.5), (6,2.5), (7,1), (8,3.5) -->
  <!-- y = 190 - (value * 10), x = 70 + (year * 18) -->
  <polyline points="70,190 88,213 106,280 124,290 142,240 160,155 178,165 196,180 214,155" fill="none" stroke="#f97316" stroke-width="2.5"/>
  <circle cx="124" cy="290" r="3.5" fill="#f97316"/>
  <text x="130" y="287" font-size="8" fill="#f97316" font-weight="700">-10%</text>

  <!-- UK Post-WWI 1920-1925 (sky blue) -->
  <!-- Points: (0,15), (1,-14), (2,-8), (3,-2), (4,0), (5,0.5) -->
  <polyline points="70,40 88,330 106,270 124,210 142,190 160,185" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="88" cy="330" r="3.5" fill="#38bdf8"/>
  <text x="94" y="344" font-size="8" fill="#38bdf8" font-weight="700">-14%</text>

  <!-- France Gold Bloc 1929-1938 (purple) -->
  <!-- Points: (0,0), (1,-2), (2,-5), (3,-7), (4,-5), (5,-4), (6,-3), (7,-1), (8,2), (9,5) -->
  <polyline points="70,190 88,210 106,240 124,260 142,240 160,230 178,220 196,200 214,170 232,140" fill="none" stroke="#a78bfa" stroke-width="2.5"/>
  <circle cx="124" cy="260" r="3.5" fill="#a78bfa"/>
  <text x="130" y="257" font-size="8" fill="#a78bfa" font-weight="700">-7%</text>

  <!-- Japan 1990-2015 (green) -->
  <!-- Points: (0,3), (5,-0.1), (9,-0.3), (12,-0.9), (15,-0.3), (19,-1.4), (23,0.4), (24,2.7), (25,0.8) -->
  <polyline points="70,160 160,191 232,193 286,199 340,193 412,204 484,186 502,163 520,182" fill="none" stroke="#22c55e" stroke-width="2.5"/>
  <circle cx="412" cy="204" r="3.5" fill="#22c55e"/>
  <text x="418" y="217" font-size="8" fill="#22c55e" font-weight="700">-1.4%</text>
  <circle cx="502" cy="163" r="3.5" fill="#22c55e"/>
  <text x="508" y="160" font-size="8" fill="#22c55e" font-weight="700">+2.7%</text>

  <!-- US GFC 2008-2012 (rose, dashed) -->
  <!-- Points: (0,3.8), (1,-0.4), (2,1.6), (3,3.2), (4,2.1) -->
  <polyline points="70,152 88,194 106,174 124,158 142,169" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="5,3"/>
  <circle cx="88" cy="194" r="3.5" fill="#f43f5e"/>
  <text x="94" y="207" font-size="8" fill="#f43f5e" font-weight="700">-0.4%</text>

  <!-- Annotation: Fast vs Slow recovery -->
  <rect x="70" y="368" width="450" height="1" fill="currentColor" opacity="0.15"/>
  <text x="70" y="384" font-size="8" fill="currentColor" opacity="0.6">Fast recovery (US 1933, US 2009): CPI back to +2% within 3-5 years. Slow recovery (France, Japan): 7-25 years.</text>

  <!-- Source -->
  <text x="295" y="396" text-anchor="middle" font-size="8" fill="var(--chart-muted, currentColor)">Source: Bordo, Lane &amp; Redish (2004), Reinhart &amp; Rogoff (2009), Atkeson &amp; Weber (2023)</text>
</svg>
