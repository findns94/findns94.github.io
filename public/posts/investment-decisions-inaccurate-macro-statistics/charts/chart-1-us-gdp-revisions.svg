<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380" role="img" aria-label="Horizontal bar chart showing US GDP revision magnitudes from 1996-2022 average. Advance to Third Estimate: 0.6 percentage points. Advance to Second Estimate: 0.5 percentage points. Second to Third Estimate: 0.3 percentage points.">
  <title>US GDP Revision Magnitudes (1996-2022 Average)</title>
  <desc>Horizontal bar chart comparing the mean absolute revision between three vintages of US quarterly GDP estimates over the 26-year period 1996-2022. The advance-to-third estimate revision averages 0.6 percentage points, advance-to-second averages 0.5 percentage points, and second-to-third averages 0.3 percentage points. Source: Bureau of Economic Analysis, 2024.</desc>
  <style>
    :root { --fg: #1f2937; --fg-min: #374151; --grid: rgba(0,0,0,0.08); --axis: rgba(0,0,0,0.32); }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #f3f4f6; --fg-min: #9ca3af; --grid: rgba(255,255,255,0.08); --axis: rgba(255,255,255,0.32); }
    }
    text { fill: var(--fg); }
    .tick { fill: var(--fg-min); opacity: 0.55; }
    .lbl { fill: var(--fg-min); opacity: 0.8; }
    .op35 { fill: var(--fg-min); opacity: 0.35; }
    .op70 { fill: var(--fg); opacity: 0.7; }
    .line-grid { stroke: var(--grid); stroke-width: 0.3; }
    .axis { stroke: var(--axis); stroke-width: 1; }
  </style>

  <!-- Y axis line -->
  <line class="axis" x1="160" y1="50" x2="160" y2="300"/>

  <!-- X axis line -->
  <line class="axis" x1="160" y1="300" x2="520" y2="300"/>

  <!-- X axis gridlines -->
  <line class="line-grid" x1="160" y1="300" x2="520" y2="300"/>
  <line class="line-grid" x1="250" y1="50" x2="250" y2="300"/>
  <line class="line-grid" x1="340" y1="50" x2="340" y2="300"/>
  <line class="line-grid" x1="430" y1="50" x2="430" y2="300"/>
  <line class="line-grid" x1="520" y1="50" x2="520" y2="300"/>

  <!-- X axis labels -->
  <text class="tick" x="160" y="318" text-anchor="middle" font-size="10">0</text>
  <text class="tick" x="250" y="318" text-anchor="middle" font-size="10">0.2</text>
  <text class="tick" x="340" y="318" text-anchor="middle" font-size="10">0.4</text>
  <text class="tick" x="430" y="318" text-anchor="middle" font-size="10">0.6</text>
  <text class="tick" x="520" y="318" text-anchor="middle" font-size="10">0.8</text>

  <!-- Bar 1: Advance to Third (0.6 pp) -->
  <rect x="160" y="80" width="240" height="36" rx="4" fill="#f97316"/>
  <text class="lbl" x="150" y="103" text-anchor="end" font-size="11">Advance to Third Est.</text>
  <text x="408" y="103" font-size="11" font-weight="800" fill="white">0.6 pp</text>

  <!-- Bar 2: Advance to Second (0.5 pp) -->
  <rect x="160" y="148" width="200" height="36" rx="4" fill="#38bdf8"/>
  <text class="lbl" x="150" y="171" text-anchor="end" font-size="11">Advance to Second Est.</text>
  <text x="368" y="171" font-size="11" font-weight="800" fill="white">0.5 pp</text>

  <!-- Bar 3: Second to Third (0.3 pp) -->
  <rect x="160" y="216" width="120" height="36" rx="4" fill="#a78bfa"/>
  <text class="lbl" x="150" y="239" text-anchor="end" font-size="11">Second to Third Est.</text>
  <text x="288" y="239" font-size="11" font-weight="800" fill="white">0.3 pp</text>

  <!-- Source attribution -->
  <text class="op35" x="280" y="372" text-anchor="middle" font-size="9">Source: Bureau of Economic Analysis (BEA), 2024</text>
</svg>
