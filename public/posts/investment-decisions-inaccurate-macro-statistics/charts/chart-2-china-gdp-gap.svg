<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380" role="img" aria-label="Line chart showing the gap between China's sum of provincial GDP and the national GDP total. In 2023 the gap was 2.5 trillion yuan. In 2024 the gap widened to 2.8 trillion yuan.">
  <title>China Provincial GDP Sum vs. National Total Gap</title>
  <desc>Line chart showing the discrepancy between the sum of China's 31 provincial-level GDP figures and the NBS national GDP total. In 2023, the provincial sum exceeded the national figure by approximately 2.5 trillion yuan. In 2024, the gap widened to approximately 2.8 trillion yuan. Source: National Bureau of Statistics (NBS) China, 2024.</desc>
  <style>
    :root { --fg: #1f2937; --fg-min: #374151; --grid: rgba(0,0,0,0.08); --axis: rgba(0,0,0,0.32); }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #f3f4f6; --fg-min: #9ca3af; --grid: rgba(255,255,255,0.08); --axis: rgba(255,255,255,0.32); }
    }
    text { fill: var(--fg); }
    .tick { fill: var(--fg-min); opacity: 0.55; }
    .lbl { fill: var(--fg-min); opacity: 0.8; }
    .op35 { fill: var(--fg-min); opacity: 0.35; }
    .op70 { fill: var(--fg); opacity: 0.7; }
    .line-grid { stroke: var(--grid); stroke-width: 0.3; }
    .axis { stroke: var(--axis); stroke-width: 1; }
  </style>

  <!-- Chart area: x=80 to x=520, y=40 to y=300 -->
  <!-- Scale: 0 at y=300, 3 at y=90. px_per_unit = (300-90)/3 = 70 -->

  <!-- Y axis line -->
  <line class="axis" x1="80" y1="40" x2="80" y2="300"/>

  <!-- X axis line -->
  <line class="axis" x1="80" y1="300" x2="520" y2="300"/>

  <!-- Y axis gridlines -->
  <line class="line-grid" x1="80" y1="300" x2="520" y2="300"/>
  <line class="line-grid" x1="80" y1="230" x2="520" y2="230"/>
  <line class="line-grid" x1="80" y1="160" x2="520" y2="160"/>
  <line class="line-grid" x1="80" y1="90" x2="520" y2="90"/>

  <!-- Y axis labels -->
  <text class="tick" x="70" y="304" text-anchor="end" font-size="10">0</text>
  <text class="tick" x="70" y="234" text-anchor="end" font-size="10">1</text>
  <text class="tick" x="70" y="164" text-anchor="end" font-size="10">2</text>
  <text class="tick" x="70" y="94" text-anchor="end" font-size="10">3</text>

  <!-- Y axis title -->
  <text class="tick" x="24" y="170" text-anchor="middle" font-size="10" transform="rotate(-90, 24, 170)">Gap (trillion yuan)</text>

  <!-- X axis labels -->
  <text class="lbl" x="200" y="318" text-anchor="middle" font-size="11">2023</text>
  <text class="lbl" x="400" y="318" text-anchor="middle" font-size="11">2024</text>

  <!-- Data: 2023=2.5T at x=200, 2024=2.8T at x=400 -->
  <!-- y = 300 - (value * 70): 2.5T = y125, 2.8T = y104 -->

  <!-- Area fill under line -->
  <path d="M200,125 L400,104 L400,300 L200,300 Z" fill="#f97316" opacity="0.08"/>

  <!-- Data line -->
  <polyline points="200,125 400,104" fill="none" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Data points -->
  <circle cx="200" cy="125" r="6" fill="#f97316"/>
  <circle cx="400" cy="104" r="6" fill="#f97316"/>

  <!-- Value labels -->
  <text x="200" y="113" text-anchor="middle" font-size="12" font-weight="800" fill="#f97316">2.5T</text>
  <text x="400" y="92" text-anchor="middle" font-size="12" font-weight="800" fill="#f97316">2.8T</text>

  <!-- National GDP reference labels -->
  <text class="tick" x="200" y="340" text-anchor="middle" font-size="9">National: 126.06T yuan</text>
  <text class="tick" x="400" y="340" text-anchor="middle" font-size="9">National: 134.9T yuan</text>

  <!-- Source attribution -->
  <text class="op35" x="280" y="372" text-anchor="middle" font-size="9">Source: National Bureau of Statistics (NBS) China, 2024</text>
</svg>
