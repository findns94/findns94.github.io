<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Horizontal bar chart comparing Metacritic and OpenCritic scores for featured RPGs. Baldur's Gate 3 leads at Metacritic 96 and OpenCritic 98%, followed by Baldur's Gate 2 at 95, Pillars of Eternity at 89, Planescape: Torment at 91, and Pathfinder: Wrath of the Righteous at 84.">
  <title>RPG Game Review Scores Comparison</title>
  <desc>Horizontal bar chart comparing Metacritic (out of 100) and OpenCritic (percentage) scores for six RPGs: Baldur's Gate 3, Baldur's Gate 2, Planescape: Torment, Pillars of Eternity, and Pathfinder: Wrath of the Righteous.</desc>
  <defs>
    <style>
      text { font-family: 'Inter', system-ui, sans-serif; fill: currentColor; }
      .title { font-size: 16px; font-weight: 700; }
      .subtitle { font-size: 11px; fill: #9ca3af; }
      .bar-label { font-size: 12px; font-weight: 500; }
      .value-label { font-size: 11px; font-weight: 600; fill: #ffffff; }
      .axis-label { font-size: 10px; fill: #9ca3af; }
      .legend-text { font-size: 11px; }
      .gridline { stroke: currentColor; opacity: 0.08; }
    </style>
  </defs>

  <!-- Title -->
  <text x="320" y="28" text-anchor="middle" class="title">Review Scores: Featured RPGs</text>
  <text x="320" y="44" text-anchor="middle" class="subtitle">Metacritic (out of 100) and OpenCritic Recommend (%)</text>

  <!-- Legend -->
  <rect x="180" y="52" width="14" height="14" rx="3" fill="#6366f1"/>
  <text x="198" y="64" class="legend-text" fill="#cbd5e1">Metacritic</text>
  <rect x="300" y="52" width="14" height="14" rx="3" fill="#10b981"/>
  <text x="318" y="64" class="legend-text" fill="#cbd5e1">OpenCritic</text>

  <!-- Chart area: x 150-620, y 80-380 -->
  <!-- Gridlines at 0, 20, 40, 60, 80, 100 -->
  <line x1="150" y1="80" x2="620" y2="80" class="gridline"/>
  <line x1="150" y1="152" x2="620" y2="152" class="gridline"/>
  <line x1="150" y1="224" x2="620" y2="224" class="gridline"/>
  <line x1="150" y1="296" x2="620" y2="296" class="gridline"/>
  <line x1="150" y1="368" x2="620" y2="368" class="gridline"/>

  <!-- Axis labels -->
  <text x="146" y="372" text-anchor="end" class="axis-label">0</text>
  <text x="146" y="300" text-anchor="end" class="axis-label">20</text>
  <text x="146" y="228" text-anchor="end" class="axis-label">40</text>
  <text x="146" y="156" text-anchor="end" class="axis-label">60</text>
  <text x="146" y="84" text-anchor="end" class="axis-label">80</text>

  <!-- Scale: 150 to 620 = 470px for 0-100. px_per_unit = 4.7 -->

  <!-- Row 1: Baldur's Gate 3 (Metacritic 96, OpenCritic 98) -->
  <text x="146" y="108" text-anchor="end" class="bar-label">BG3</text>
  <rect x="150" y="96" width="451.2" height="14" rx="4" fill="#6366f1"/>
  <text x="156" y="108" class="value-label" fill="#e0e7ff">96</text>
  <rect x="150" y="114" width="460.6" height="14" rx="4" fill="#10b981"/>
  <text x="156" y="126" class="value-label" fill="#d1fae5">98%</text>

  <!-- Row 2: Baldur's Gate 2 (Metacritic 95) -->
  <text x="146" y="150" text-anchor="end" class="bar-label">BG2</text>
  <rect x="150" y="138" width="446.5" height="14" rx="4" fill="#6366f1"/>
  <text x="156" y="150" class="value-label" fill="#e0e7ff">95</text>

  <!-- Row 3: Planescape: Torment (Metacritic 91) -->
  <text x="146" y="192" text-anchor="end" class="bar-label" font-size="11">Planescape</text>
  <rect x="150" y="180" width="427.7" height="14" rx="4" fill="#6366f1"/>
  <text x="156" y="192" class="value-label" fill="#e0e7ff">91</text>

  <!-- Row 4: Pillars of Eternity (Metacritic 89) -->
  <text x="146" y="234" text-anchor="end" class="bar-label" font-size="11">Pillars</text>
  <rect x="150" y="222" width="418.3" height="14" rx="4" fill="#6366f1"/>
  <text x="156" y="234" class="value-label" fill="#e0e7ff">89</text>

  <!-- Row 5: Pathfinder: WotR (Metacritic 84) -->
  <text x="146" y="276" text-anchor="end" class="bar-label" font-size="11">WotR</text>
  <rect x="150" y="264" width="394.8" height="14" rx="4" fill="#6366f1"/>
  <text x="156" y="276" class="value-label" fill="#e0e7ff">84</text>

  <!-- Source -->
  <text x="320" y="406" text-anchor="middle" class="subtitle">Source: Metacritic, OpenCritic — scores at latest release / re-evaluation</text>
</svg>
