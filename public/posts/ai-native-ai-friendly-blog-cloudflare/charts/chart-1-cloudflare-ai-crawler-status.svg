<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" role="img" aria-label="Chart: Cloudflare default AI crawler access status for new domains since July 2025. GPTBot, ClaudeBot, PerplexityBot, CCBot, and Google-Extended are blocked by default. Applebot-Extended and Googlebot are allowed.">
  <title>Cloudflare Default AI Crawler Access Status (New Domains, July 2025+)</title>
  <desc>Chart showing which AI crawlers Cloudflare blocks or allows by default on new domains. Five crawlers blocked, two allowed.</desc>
  <style>
    text { font-family: 'Inter', system-ui, sans-serif; fill: currentColor; }
    .hd { font-size: 12px; font-weight: 700; }
    .lb { font-size: 12px; }
    .ax { font-size: 10px; opacity: 0.6; }
    .src { font-size: 9px; opacity: 0.5; }
  </style>
  <text x="280" y="26" text-anchor="middle" font-size="14" font-weight="700">Cloudflare Default AI Crawler Access (New Domains)</text>
  <text x="280" y="42" text-anchor="middle" class="ax">Status since July 2025 - Security &gt; Bots &amp; AI Crawlers</text>
  <text x="130" y="70" text-anchor="middle" class="hd" fill="#f87171">BLOCKED</text>
  <text x="430" y="70" text-anchor="middle" class="hd" fill="#4ade80">ALLOWED</text>
  <line x1="280" y1="56" x2="280" y2="340" stroke="currentColor" stroke-opacity="0.15" stroke-dasharray="3,3"/>
  <rect x="120" y="84" width="158" height="26" rx="4" fill="#dc2626"/>
  <text x="130" y="101" class="lb" fill="#fff">GPTBot (OpenAI)</text>
  <rect x="135" y="120" width="143" height="26" rx="4" fill="#dc2626"/>
  <text x="145" y="137" class="lb" fill="#fff">ClaudeBot (Anthropic)</text>
  <rect x="108" y="156" width="170" height="26" rx="4" fill="#dc2626"/>
  <text x="118" y="173" class="lb" fill="#fff">PerplexityBot (Perplexity)</text>
  <rect x="149" y="192" width="129" height="26" rx="4" fill="#dc2626"/>
  <text x="159" y="209" class="lb" fill="#fff">CCBot (Common Crawl)</text>
  <rect x="124" y="228" width="154" height="26" rx="4" fill="#dc2626"/>
  <text x="134" y="245" class="lb" fill="#fff">Google-Extended (Google)</text>
  <rect x="282" y="270" width="150" height="26" rx="4" fill="#16a34a"/>
  <text x="292" y="287" class="lb" fill="#fff">Applebot-Extended</text>
  <rect x="282" y="304" width="120" height="26" rx="4" fill="#16a34a"/>
  <text x="292" y="321" class="lb" fill="#fff">Googlebot</text>
  <rect x="180" y="348" width="12" height="12" rx="2" fill="#dc2626"/>
  <text x="196" y="358" class="ax">Blocked by default</text>
  <rect x="320" y="348" width="12" height="12" rx="2" fill="#16a34a"/>
  <text x="336" y="358" class="ax">Allowed by default</text>
  <text x="280" y="374" text-anchor="middle" class="src">Source: Cloudflare, Security &gt; Bots &amp; AI Crawlers documentation (July 2025)</text>
</svg>