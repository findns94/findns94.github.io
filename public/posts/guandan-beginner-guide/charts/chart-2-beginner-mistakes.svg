<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" role="img" aria-label="Donut chart: Self-observed beginner mistake distribution in Guandan. Misjudging bomb timing 28 percent, failing to coordinate with partner 26 percent, playing at the wrong pace 22 percent, mishandling tribute cards 14 percent, not tracking key cards 10 percent." font-family="'Inter', system-ui, sans-serif" fill="currentColor">
  <title>Self-Observed Beginner Mistake Distribution</title>
  <desc>Donut chart showing the distribution of self-observed mistakes beginners make in Guandan: misjudging bomb timing 28%, failing to coordinate with partner 26%, playing at the wrong pace 22%, mishandling tribute cards 14%, not tracking key cards 10%.</desc>
  <text x="20" y="28" font-size="16" font-weight="700" fill="currentColor">Self-Observed Beginner Mistake Distribution</text>
  <text x="20" y="48" font-size="11" opacity="0.6" fill="currentColor">Frequency across common errors (observed sessions)</text>
  <path d="M 185.0,65.0 A 105,105 0 0 1 288.1,189.7 L 245.9,181.6 A 62,62 0 0 0 185.0,108.0 Z" fill="#f87171"/>
  <path d="M 288.1,189.7 A 105,105 0 0 1 158.9,271.7 L 169.6,230.1 A 62,62 0 0 0 245.9,181.6 Z" fill="#fb923c"/>
  <path d="M 158.9,271.7 A 105,105 0 0 1 80.2,163.4 L 123.1,166.1 A 62,62 0 0 0 169.6,230.1 Z" fill="#fbbf24"/>
  <path d="M 80.2,163.4 A 105,105 0 0 1 123.3,85.1 L 148.6,119.8 A 62,62 0 0 0 123.1,166.1 Z" fill="#34d399"/>
  <path d="M 123.3,85.1 A 105,105 0 0 1 185.0,65.0 L 185.0,108.0 A 62,62 0 0 0 148.6,119.8 Z" fill="#60a5fa"/>
  <text x="185" y="166" font-size="20" font-weight="700" text-anchor="middle" fill="currentColor">100%</text>
  <text x="185" y="184" font-size="10" text-anchor="middle" opacity="0.6" fill="currentColor">of errors</text>
  <rect x="350" y="82" width="12" height="12" rx="2" fill="#f87171"/>
  <text x="368" y="93" font-size="11" fill="currentColor">Misjudging bomb timing - 28%</text>
  <rect x="350" y="112" width="12" height="12" rx="2" fill="#fb923c"/>
  <text x="368" y="123" font-size="11" fill="currentColor">Failing to coordinate - 26%</text>
  <rect x="350" y="142" width="12" height="12" rx="2" fill="#fbbf24"/>
  <text x="368" y="153" font-size="11" fill="currentColor">Playing at wrong pace - 22%</text>
  <rect x="350" y="172" width="12" height="12" rx="2" fill="#34d399"/>
  <text x="368" y="183" font-size="11" fill="currentColor">Mishandling tribute cards - 14%</text>
  <rect x="350" y="202" width="12" height="12" rx="2" fill="#60a5fa"/>
  <text x="368" y="213" font-size="11" fill="currentColor">Not tracking key cards - 10%</text>
  <text x="20" y="368" font-size="10" opacity="0.5" fill="currentColor">Source: author observation across beginner sessions (2025)</text>
</svg>
