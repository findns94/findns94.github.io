<svg viewBox="0 0 560 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lollipop chart showing git bisect steps needed to find a regression: 1000 commits takes 10 steps, 5000 takes 12, 10000 takes 13, 15849 takes 14">
  <rect width="560" height="340" fill="#0d1117" rx="12"/>
  <text x="280" y="30" fill="#c9d1d9" font-family="system-ui,sans-serif" font-size="15" font-weight="600" text-anchor="middle">git bisect Finds Any Regression in ~log2(n) Steps</text>
  <text x="280" y="47" fill="#8b949e" font-family="system-ui,sans-serif" font-size="11" text-anchor="middle">Each step runs xfstests as the pass/fail oracle (2026)</text>

  <!-- x-axis -->
  <line x1="70" y1="280" x2="530" y2="280" stroke="#30363d" stroke-width="1"/>

  <!-- 1,000 commits -> 10 steps -->
  <line x1="110" y1="280" x2="110" y2="210" stroke="#58a6ff" stroke-width="2"/>
  <circle cx="110" cy="210" r="7" fill="#58a6ff"/>
  <text x="110" y="195" fill="#e6edf3" font-family="system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="middle">10</text>
  <text x="110" y="300" fill="#8b949e" font-family="system-ui,sans-serif" font-size="10" text-anchor="middle">1,000</text>
  <text x="110" y="315" fill="#64748b" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle">commits</text>

  <!-- 5,000 commits -> 12 steps -->
  <line x1="220" y1="280" x2="220" y2="168" stroke="#3fb950" stroke-width="2"/>
  <circle cx="220" cy="168" r="7" fill="#3fb950"/>
  <text x="220" y="153" fill="#e6edf3" font-family="system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="middle">12</text>
  <text x="220" y="300" fill="#8b949e" font-family="system-ui,sans-serif" font-size="10" text-anchor="middle">5,000</text>
  <text x="220" y="315" fill="#64748b" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle">commits</text>

  <!-- 10,000 commits -> 13 steps -->
  <line x1="330" y1="280" x2="330" y2="147" stroke="#d2a8ff" stroke-width="2"/>
  <circle cx="330" cy="147" r="7" fill="#d2a8ff"/>
  <text x="330" y="132" fill="#e6edf3" font-family="system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="middle">13</text>
  <text x="330" y="300" fill="#8b949e" font-family="system-ui,sans-serif" font-size="10" text-anchor="middle">10,000</text>
  <text x="330" y="315" fill="#64748b" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle">commits</text>

  <!-- 15,849 commits (kernel 7.1) -> 14 steps -->
  <line x1="450" y1="280" x2="450" y2="133" fill="none" stroke="#f0883e" stroke-width="2"/>
  <circle cx="450" cy="133" r="8" fill="#f0883e"/>
  <text x="450" y="118" fill="#e6edf3" font-family="system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="middle">14</text>
  <text x="450" y="300" fill="#f0883e" font-family="system-ui,sans-serif" font-size="10" font-weight="600" text-anchor="middle">15,849</text>
  <text x="450" y="315" fill="#64748b" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle">(kernel 7.1)</text>

  <!-- annotation -->
  <rect x="150" y="70" width="280" height="30" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="290" y="89" fill="#8b949e" font-family="system-ui,sans-serif" font-size="10" text-anchor="middle">Even the largest release needs only ~14 xfstests runs</text>
</svg>
