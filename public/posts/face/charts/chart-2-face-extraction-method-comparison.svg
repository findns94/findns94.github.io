<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" role="img" aria-label="Grouped bar chart comparing face extraction rates of OpenCV Haar features versus MTCNN on training and test sets. Haar training set 78.45%, Haar test set 77.7%. MTCNN training set 98.25%, MTCNN test set 98.55%.">
  <title>Face Extraction Method Comparison: Haar vs MTCNN</title>
  <desc>Grouped bar chart comparing the face extraction success rate of two methods on a 2,000-face dataset. OpenCV Haar cascade detected 1,569 of 2,000 training faces (78.45%) and 1,554 of 2,000 test faces (77.7%). MTCNN detected 1,965 of 2,000 training faces (98.25%) and 1,971 of 2,000 test faces (98.55%). MTCNN also rotates tilted faces to frontal, improving downstream comparison. Source: author course experiment, 2019.</desc>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" fill="currentColor" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700">Face Extraction Rate: Haar vs MTCNN</text>
  <text x="260" y="44" text-anchor="middle" fill="currentColor" font-family="'Inter', system-ui, sans-serif" font-size="11" opacity="0.45">Percentage of faces successfully detected in a 2,000-face dataset</text>

  <!-- Y-axis -->
  <line x1="70" y1="60" x2="70" y2="270" stroke="currentColor" opacity="0.3"/>
  <!-- X-axis -->
  <line x1="70" y1="270" x2="460" y2="270" stroke="currentColor" opacity="0.3"/>

  <!-- Y-axis grid + labels -->
  <g font-family="'Inter', system-ui, sans-serif" font-size="10" opacity="0.45" fill="currentColor">
    <line x1="70" y1="60" x2="460" y2="60" stroke="currentColor" opacity="0.08"/>
    <text x="62" y="64" text-anchor="end">100%</text>
    <line x1="70" y1="112" x2="460" y2="112" stroke="currentColor" opacity="0.08"/>
    <text x="62" y="116" text-anchor="end">75%</text>
    <line x1="70" y1="165" x2="460" y2="165" stroke="currentColor" opacity="0.08"/>
    <text x="62" y="169" text-anchor="end">50%</text>
    <line x1="70" y1="218" x2="460" y2="218" stroke="currentColor" opacity="0.08"/>
    <text x="62" y="222" text-anchor="end">25%</text>
    <text x="62" y="274" text-anchor="end">0%</text>
  </g>

  <!-- Y-axis mapping: 100% = y60, 0% = y270, range 210px -->
  <!-- value y = 270 - (value/100 * 210) -->
  <!-- 78.45% -> y = 270 - 164.7 = 105.3 -->
  <!-- 77.7% -> y = 270 - 163.2 = 106.8 -->
  <!-- 98.25% -> y = 270 - 206.3 = 63.7 -->
  <!-- 98.55% -> y = 270 - 207.0 = 63.0 -->

  <!-- Group 1: Training Set (x center ~175) -->
  <text x="175" y="290" text-anchor="middle" fill="currentColor" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600">Training Set</text>
  <!-- Haar train: 78.45%, bar from y105.3 to y270, height 164.7 -->
  <rect x="130" y="105" width="42" height="165" rx="4" fill="#a78bfa"/>
  <text x="151" y="98" text-anchor="middle" fill="currentColor" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700">78.45%</text>
  <!-- MTCNN train: 98.25%, bar from y63.7 to y270, height 206.3 -->
  <rect x="178" y="64" width="42" height="206" rx="4" fill="#22c55e"/>
  <text x="199" y="57" text-anchor="middle" fill="currentColor" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700">98.25%</text>

  <!-- Group 2: Test Set (x center ~355) -->
  <text x="355" y="290" text-anchor="middle" fill="currentColor" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600">Test Set</text>
  <!-- Haar test: 77.7%, bar from y106.8 to y270, height 163.2 -->
  <rect x="310" y="107" width="42" height="163" rx="4" fill="#a78bfa"/>
  <text x="331" y="100" text-anchor="middle" fill="currentColor" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700">77.7%</text>
  <!-- MTCNN test: 98.55%, bar from y63.0 to y270, height 207.0 -->
  <rect x="358" y="63" width="42" height="207" rx="4" fill="#22c55e"/>
  <text x="379" y="56" text-anchor="middle" fill="currentColor" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700">98.55%</text>

  <!-- Legend -->
  <rect x="150" y="308" width="12" height="12" rx="2" fill="#a78bfa"/>
  <text x="166" y="318" fill="currentColor" font-family="'Inter', system-ui, sans-serif" font-size="11" opacity="0.8">Haar (OpenCV)</text>
  <rect x="290" y="308" width="12" height="12" rx="2" fill="#22c55e"/>
  <text x="306" y="318" fill="currentColor" font-family="'Inter', system-ui, sans-serif" font-size="11" opacity="0.8">MTCNN</text>

  <!-- Source -->
  <text x="260" y="342" text-anchor="middle" fill="currentColor" font-family="'Inter', system-ui, sans-serif" font-size="10" opacity="0.35">Source: author course experiment (2,000-face dataset), 2019</text>
</svg>
