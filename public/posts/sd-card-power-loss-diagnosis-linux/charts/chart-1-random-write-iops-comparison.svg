<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Random 4K Write IOPS Comparison: Healthy vs Damaged SD Card">
  <title>Random 4K Write IOPS Comparison</title>
  <desc>Comparison of random 4K write IOPS between a healthy 16GB SD card and a damaged 64GB SD card. Healthy card: 340 IOPS. Damaged card: 38 IOPS. The damaged card is 8.9x slower.</desc>
  <defs>
    <style>
      text { font-family: 'Inter', system-ui, sans-serif; }
      .title { font-size: 16px; font-weight: 700; fill: #e2e8f0; }
      .subtitle { font-size: 12px; fill: #94a3b8; }
      .bar-label { font-size: 13px; fill: #e2e8f0; font-weight: 600; }
      .value-label { font-size: 14px; fill: #ffffff; font-weight: 700; }
      .axis-label { font-size: 11px; fill: #94a3b8; }
      .grid-line { stroke: #334155; stroke-width: 1; }
      .bar-healthy { fill: #22c55e; }
      .bar-damaged { fill: #ef4444; }
      .annotation { font-size: 12px; fill: #f59e0b; font-weight: 600; }
    </style>
  </defs>
  <rect width="640" height="400" fill="#0f172a" rx="8"/>
  <text x="320" y="35" text-anchor="middle" class="title">Random 4K Write IOPS Comparison</text>
  <text x="320" y="52" text-anchor="middle" class="subtitle">fio benchmark: iodepth=32, numjobs=4, bs=4k, direct=1</text>
  <line x1="140" y1="80" x2="140" y2="320" class="grid-line"/>
  <line x1="140" y1="320" x2="580" y2="320" class="grid-line"/>
  <text x="130" y="325" text-anchor="end" class="axis-label">0</text>
  <line x1="140" y1="280" x2="580" y2="280" class="grid-line" stroke-dasharray="4,4"/>
  <text x="130" y="285" text-anchor="end" class="axis-label">100</text>
  <line x1="140" y1="240" x2="580" y2="240" class="grid-line" stroke-dasharray="4,4"/>
  <text x="130" y="245" text-anchor="end" class="axis-label">200</text>
  <line x1="140" y1="200" x2="580" y2="200" class="grid-line" stroke-dasharray="4,4"/>
  <text x="130" y="205" text-anchor="end" class="axis-label">300</text>
  <line x1="140" y1="160" x2="580" y2="160" class="grid-line" stroke-dasharray="4,4"/>
  <text x="130" y="165" text-anchor="end" class="axis-label">400</text>
  <text x="130" y="125" text-anchor="end" class="axis-label">500</text>
  <rect x="140" y="100" width="394" height="50" rx="4" class="bar-healthy"/>
  <text x="150" y="130" class="bar-label">/dev/sdc (Healthy 16GB)</text>
  <text x="540" y="132" text-anchor="start" class="value-label">340 IOPS</text>
  <rect x="140" y="180" width="43" height="50" rx="4" class="bar-damaged"/>
  <text x="160" y="240" class="bar-label">/dev/sdd (Damaged 64GB)</text>
  <text x="190" y="212" text-anchor="start" class="value-label">38 IOPS</text>
  <line x1="540" y1="100" x2="540" y2="255" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="550" y="170" class="annotation">8.9x slower</text>
  <text x="320" y="360" text-anchor="middle" class="subtitle">Source: fio 3.33 benchmark on Ubuntu PC via USB 2.0 reader, 2026-09-02</text>
  <text x="320" y="380" text-anchor="middle" class="subtitle">Sequential write: both 13.8 MB/s (identical) | Random read: 1,256 vs 1,407 IOPS (similar)</text>
</svg>