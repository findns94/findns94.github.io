<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-label="AI advice departures from lifecycle theory showing four key gaps">
<title>AI Advice Departures from Lifecycle Theory</title>
<desc>Lollipop chart showing four systematic departures of AI advice from lifecycle theory. Portfolio rebalancing inertia: highest. High discount factor (excessive patience): high. Heuristic bunching at round numbers: moderate. Insufficient consumption smoothing: moderate.</desc>
<style>
  :root { --fg: #1f2937; --fg-min: #374151; --grid: rgba(0,0,0,0.08); --axis: rgba(0,0,0,0.32); }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #f3f4f6; --fg-min: #9ca3af; --grid: rgba(255,255,255,0.08); --axis: rgba(255,255,255,0.32); }
  }
  text { fill: var(--fg); }
  .tick { fill: var(--fg-min); opacity: 0.55; }
  .lbl { fill: var(--fg-min); opacity: 0.8; }
  .op35 { fill: var(--fg-min); opacity: 0.35; }
  .line-grid { stroke: var(--grid); stroke-width: 0.3; }
  .axis { stroke: var(--axis); stroke-width: 1; }
</style>
<g>
  <line class="line-grid" x1="200" y1="80" x2="580" y2="80"/>
  <line class="line-grid" x1="200" y1="140" x2="580" y2="140"/>
  <line class="line-grid" x1="200" y1="200" x2="580" y2="200"/>
  <line class="line-grid" x1="200" y1="260" x2="580" y2="260"/>
  <line class="line-grid" x1="200" y1="320" x2="580" y2="320"/>
</g>
<line class="axis" x1="200" y1="40" x2="200" y2="340"/>
<text class="tick" x="194" y="84" text-anchor="end" font-size="10">0</text>
<text class="tick" x="194" y="144" text-anchor="end" font-size="10">25</text>
<text class="tick" x="194" y="204" text-anchor="end" font-size="10">50</text>
<text class="tick" x="194" y="264" text-anchor="end" font-size="10">75</text>
<text class="tick" x="194" y="324" text-anchor="end" font-size="10">100</text>
<!-- Lollipop 1: Portfolio Rebalancing Inertia -->
<line x1="200" y1="70" x2="556" y2="70" stroke="#374151" stroke-width="1.5" opacity="0.3"/>
<circle cx="556" cy="70" r="7" fill="#fb7185"/>
<text class="lbl" x="190" y="74" text-anchor="end" font-size="10">Portfolio Rebalancing Inertia</text>
<text x="565" y="74" font-size="10" fill="#1f2937" font-weight="700">91</text>
<!-- Lollipop 2: High Discount Factor -->
<line x1="200" y1="140" x2="510" y2="140" stroke="#374151" stroke-width="1.5" opacity="0.3"/>
<circle cx="510" cy="140" r="7" fill="#f97316"/>
<text class="lbl" x="190" y="144" text-anchor="end" font-size="10">High Discount Factor (beta&gt;1)</text>
<text x="519" y="144" font-size="10" fill="#1f2937" font-weight="700">85</text>
<!-- Lollipop 3: Heuristic Bunching -->
<line x1="200" y1="210" x2="432" y2="210" stroke="#374151" stroke-width="1.5" opacity="0.3"/>
<circle cx="432" cy="210" r="7" fill="#facc15"/>
<text class="lbl" x="190" y="214" text-anchor="end" font-size="10">Heuristic Bunching</text>
<text x="441" y="214" font-size="10" fill="#1f2937" font-weight="700">72</text>
<!-- Lollipop 4: Consumption Smoothing Gap -->
<line x1="200" y1="280" x2="348" y2="280" stroke="#374151" stroke-width="1.5" opacity="0.3"/>
<circle cx="348" cy="280" r="7" fill="#a78bfa"/>
<text class="lbl" x="190" y="284" text-anchor="end" font-size="10">Consumption Smoothing Gap</text>
<text x="357" y="284" font-size="10" fill="#1f2937" font-weight="700">58</text>
<text class="op35" x="320" y="374" text-anchor="middle" font-size="10">Source: NBER Working Paper 35574, 2026. Scale: 0-100 departure severity index.</text>
</svg>
