<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-label="Chinese retail investor underperformance versus CSI 300 index">
<title>Chinese Retail Investor Underperformance vs CSI 300</title>
<desc>Grouped bar chart showing annualized return gap in percentage points between average Chinese retail investor and CSI 300 index. 2015-2017: 10.7pp gap. 2018-2020: 8.3pp. 2021-2023: 8.2pp. 2024-2025: 4.5pp. 10-year average: 7.9pp.</desc>
<style>
  :root { --fg: #1f2937; --fg-min: #374151; --grid: rgba(0,0,0,0.08); --axis: rgba(0,0,0,0.32); }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #f3f4f6; --fg-min: #9ca3af; --grid: rgba(255,255,255,0.08); --axis: rgba(255,255,255,0.32); }
  }
  text { fill: var(--fg); }
  .tick { fill: var(--fg-min); opacity: 0.55; }
  .lbl { fill: var(--fg-min); opacity: 0.8; }
  .op35 { fill: var(--fg-min); opacity: 0.35; }
  .line-grid { stroke: var(--grid); stroke-width: 0.3; }
  .axis { stroke: var(--axis); stroke-width: 1; }
</style>
<g>
  <line class="line-grid" x1="80" y1="80" x2="600" y2="80"/>
  <line class="line-grid" x1="80" y1="140" x2="600" y2="140"/>
  <line class="line-grid" x1="80" y1="200" x2="600" y2="200"/>
  <line class="line-grid" x1="80" y1="260" x2="600" y2="260"/>
  <line class="line-grid" x1="80" y1="320" x2="600" y2="320"/>
</g>
<line class="axis" x1="80" y1="320" x2="600" y2="320"/>
<line class="axis" x1="80" y1="80" x2="80" y2="320"/>
<text class="tick" x="74" y="84" text-anchor="end" font-size="10">12</text>
<text class="tick" x="74" y="144" text-anchor="end" font-size="10">9</text>
<text class="tick" x="74" y="204" text-anchor="end" font-size="10">6</text>
<text class="tick" x="74" y="264" text-anchor="end" font-size="10">3</text>
<text class="tick" x="74" y="324" text-anchor="end" font-size="10">0</text>
<!-- Bars -->
<rect x="140" y="87.6" width="60" height="232.4" fill="#fb7185" rx="2"/>
<text x="170" y="83" text-anchor="middle" font-size="10" fill="#1f2937" font-weight="700">10.7</text>
<text class="lbl" x="170" y="345" text-anchor="middle" font-size="9">2015-2017</text>
<rect x="240" y="129.2" width="60" height="190.8" fill="#f97316" rx="2"/>
<text x="270" y="125" text-anchor="middle" font-size="10" fill="#1f2937" font-weight="700">8.3</text>
<text class="lbl" x="270" y="345" text-anchor="middle" font-size="9">2018-2020</text>
<rect x="340" y="130.8" width="60" height="189.2" fill="#facc15" rx="2"/>
<text x="370" y="126" text-anchor="middle" font-size="10" fill="#1f2937" font-weight="700">8.2</text>
<text class="lbl" x="370" y="345" text-anchor="middle" font-size="9">2021-2023</text>
<rect x="440" y="226" width="60" height="94" fill="#a78bfa" rx="2"/>
<text x="470" y="222" text-anchor="middle" font-size="10" fill="#1f2937" font-weight="700">4.5</text>
<text class="lbl" x="470" y="345" text-anchor="middle" font-size="9">2024-2025</text>
<rect x="530" y="113.2" width="60" height="206.8" fill="#22c55e" rx="2"/>
<text x="560" y="109" text-anchor="middle" font-size="10" fill="#1f2937" font-weight="700">7.9</text>
<text class="lbl" x="560" y="345" text-anchor="middle" font-size="9">10yr Avg</text>
<text class="op35" x="320" y="374" text-anchor="middle" font-size="10">Source: Wind data, brokerage research reports. Gap estimated from trading cost and timing studies.</text>
</svg>
