<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" role="img" aria-label="Chart: Server utilization distribution. 30% of servers are comatose (zombie), 40% run at 5-15% utilization, 20% run at 15-40% utilization, only 10% run above 40% utilization.">
  <title>Data Center Server Utilization Distribution</title>
  <desc>Donut chart showing the distribution of server utilization in typical data centers. 30% of servers are comatose (drawing power but doing no useful work). 40% run at only 5-15% utilization. 20% run at 15-40% utilization. Only 10% run above 40% utilization.</desc>
  <style>
    text { font-family: 'Inter', system-ui, sans-serif; fill: currentColor; }
    .hd { font-size: 12px; font-weight: 700; }
    .lb { font-size: 11px; }
    .ax { font-size: 10px; opacity: 0.6; }
    .src { font-size: 9px; opacity: 0.5; }
    .val { font-size: 13px; font-weight: 700; }
  </style>
  <text x="280" y="26" text-anchor="middle" font-size="14" font-weight="700">Data Center Server Utilization</text>
  <text x="280" y="42" text-anchor="middle" class="ax">Average distribution across enterprise data centers</text>
  <!-- Donut chart -->
  <!-- Comatose: 30% -->
  <circle cx="220" cy="190" r="90" fill="none" stroke="#f87171" stroke-width="40" stroke-dasharray="170 565" stroke-dashoffset="0" transform="rotate(-90, 220, 190)"/>
  <!-- 5-15%: 40% -->
  <circle cx="220" cy="190" r="90" fill="none" stroke="#fbbf24" stroke-width="40" stroke-dasharray="226 565" stroke-dashoffset="-170" transform="rotate(-90, 220, 190)"/>
  <!-- 15-40%: 20% -->
  <circle cx="220" cy="190" r="90" fill="none" stroke="#60a5fa" stroke-width="40" stroke-dasharray="113 565" stroke-dashoffset="-396" transform="rotate(-90, 220, 190)"/>
  <!-- 40%+: 10% -->
  <circle cx="220" cy="190" r="90" fill="none" stroke="#4ade80" stroke-width="40" stroke-dasharray="57 565" stroke-dashoffset="-509" transform="rotate(-90, 220, 190)"/>
  <!-- Center text -->
  <text x="220" y="185" text-anchor="middle" font-size="20" font-weight="700">30%</text>
  <text x="220" y="205" text-anchor="middle" class="ax">comatose</text>
  <!-- Legend -->
  <rect x="360" y="100" width="14" height="14" rx="2" fill="#f87171"/>
  <text x="380" y="112" class="lb">Comatose (zombie): 30%</text>
  <rect x="360" y="130" width="14" height="14" rx="2" fill="#fbbf24"/>
  <text x="380" y="142" class="lb">5-15% utilization: 40%</text>
  <rect x="360" y="160" width="14" height="14" rx="2" fill="#60a5fa"/>
  <text x="380" y="172" class="lb">15-40% utilization: 20%</text>
  <rect x="360" y="190" width="14" height="14" rx="2" fill="#4ade80"/>
  <text x="380" y="202" class="lb">40%+ utilization: 10%</text>
  <!-- Key stats -->
  <text x="370" y="240" class="lb" font-weight="600">Cost per zombie server:</text>
  <text x="370" y="258" class="lb">$500-$1,000/year</text>
  <text x="370" y="276" class="lb">(power + cooling)</text>
  <text x="370" y="300" class="lb" font-weight="600">Global waste:</text>
  <text x="370" y="318" class="lb">~$15B/year in idle power</text>
  <!-- Source -->
  <text x="280" y="355" text-anchor="middle" class="src">Source: Jonathan Koomey (Stanford), Uptime Institute Annual Surveys, TSO Logic/Anthesis Group (2012-2024).</text>
</svg>