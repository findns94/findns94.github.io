<svg viewBox="0 0 560 380" xmlns="http://www.w3.org/2000/svg" style="max-width: 100%; height: auto; font-family: 'Inter', system-ui, sans-serif" role="img" aria-label="Horizontal bar chart showing enterprise AI agent adoption statistics in 2025">
  <title>Enterprise AI Agent Adoption Metrics (2025)</title>
  <desc>Bar chart showing: 81% of leaders expect agent integration, 72% enterprise AI adoption, 46% fully automate workflows, 33% scaled beyond pilots</desc>

  <!-- Grid lines -->
  <line x1="200" y1="50" x2="200" y2="320" stroke="currentColor" opacity="0.08" />
  <line x1="280" y1="50" x2="280" y2="320" stroke="currentColor" opacity="0.08" />
  <line x1="360" y1="50" x2="360" y2="320" stroke="currentColor" opacity="0.08" />
  <line x1="440" y1="50" x2="440" y2="320" stroke="currentColor" opacity="0.08" />
  <line x1="520" y1="50" x2="520" y2="320" stroke="currentColor" opacity="0.08" />

  <!-- X axis line -->
  <line x1="130" y1="320" x2="550" y2="320" stroke="currentColor" opacity="0.3" />

  <!-- Bar 1: 81% leader integration -->
  <rect x="130" y="70" width="340" height="40" rx="4" fill="#f97316" />
  <text x="125" y="95" text-anchor="end" font-size="11" fill="currentColor" opacity="0.8">Leader agent integration</text>
  <text x="480" y="95" font-size="12" font-weight="800" fill="white">81%</text>

  <!-- Bar 2: 72% enterprise adoption -->
  <rect x="130" y="130" width="302" height="40" rx="4" fill="#38bdf8" />
  <text x="125" y="155" text-anchor="end" font-size="11" fill="currentColor" opacity="0.8">Enterprise AI adoption</text>
  <text x="442" y="155" font-size="12" font-weight="800" fill="white">72%</text>

  <!-- Bar 3: 46% full automation -->
  <rect x="130" y="190" width="193" height="40" rx="4" fill="#a78bfa" />
  <text x="125" y="215" text-anchor="end" font-size="11" fill="currentColor" opacity="0.8">Full workflow automation</text>
  <text x="333" y="215" font-size="12" font-weight="800" fill="white">46%</text>

  <!-- Bar 4: 33% scaled -->
  <rect x="130" y="250" width="139" height="40" rx="4" fill="#22c55e" />
  <text x="125" y="275" text-anchor="end" font-size="11" fill="currentColor" opacity="0.8">Scaled beyond pilots</text>
  <text x="279" y="275" font-size="12" font-weight="800" fill="white">33%</text>

  <text x="280" y="372" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.35">Source: Microsoft Work Trend Index; McKinsey State of AI (2025)</text>
</svg>