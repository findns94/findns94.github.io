<svg viewBox="0 0 560 400" xmlns="http://www.w3.org/2000/svg" style="max-width: 100%; height: auto; font-family: 'Inter', system-ui, sans-serif" role="img" aria-label="Grouped bar chart showing generative AI value potential and automation potential by enterprise function">
  <title>Enterprise AI Value and Automation Potential by Function</title>
  <desc>Grouped bar chart comparing value potential and automation potential across IT Operations, Customer Service, Marketing and Sales, R and D, and Back-Office</desc>

  <!-- Y axis label -->
  <text x="10" y="20" font-size="9" fill="currentColor" opacity="0.45">Annual value (trillion USD)</text>

  <!-- Grid lines -->
  <line x1="110" y1="40" x2="110" y2="320" stroke="currentColor" opacity="0.3" />
  <line x1="130" y1="40" x2="530" y2="40" stroke="currentColor" opacity="0.06" />
  <line x1="130" y1="100" x2="530" y2="100" stroke="currentColor" opacity="0.06" />
  <line x1="130" y1="160" x2="530" y2="160" stroke="currentColor" opacity="0.06" />
  <line x1="130" y1="220" x2="530" y2="220" stroke="currentColor" opacity="0.06" />
  <line x1="130" y1="280" x2="530" y2="280" stroke="currentColor" opacity="0.06" />
  <line x1="130" y1="320" x2="530" y2="320" stroke="currentColor" opacity="0.3" />

  <!-- X axis labels -->
  <text x="110" y="55" text-anchor="end" font-size="9" fill="currentColor" opacity="0.7">1.0</text>
  <text x="110" y="115" text-anchor="end" font-size="9" fill="currentColor" opacity="0.7">0.8</text>
  <text x="110" y="175" text-anchor="end" font-size="9" fill="currentColor" opacity="0.7">0.6</text>
  <text x="110" y="235" text-anchor="end" font-size="9" fill="currentColor" opacity="0.7">0.4</text>
  <text x="110" y="295" text-anchor="end" font-size="9" fill="currentColor" opacity="0.7">0.2</text>
  <text x="110" y="335" text-anchor="end" font-size="9" fill="currentColor" opacity="0.7">0</text>

  <!-- IT Operations group: value $1.06T, auto 55% -->
  <rect x="140" y="271" width="44" height="49" rx="3" fill="#f97316" />
  <text x="162" y="290" text-anchor="middle" font-size="8" font-weight="800" fill="white">1.06T</text>
  <rect x="188" y="278" width="44" height="42" rx="3" fill="#f97316" opacity="0.4" />
  <text x="210" y="297" text-anchor="middle" font-size="8" font-weight="800" fill="#f97316">55%</text>
  <text x="185" y="338" text-anchor="middle" font-size="9" fill="currentColor" opacity="0.7">IT Ops</text>

  <!-- Customer Service group: value $0.97T, auto 65% -->
  <rect x="250" y="260" width="44" height="60" rx="3" fill="#38bdf8" />
  <text x="272" y="286" text-anchor="middle" font-size="8" font-weight="800" fill="white">0.97T</text>
  <rect x="298" y="264" width="44" height="56" rx="3" fill="#38bdf8" opacity="0.4" />
  <text x="320" y="290" text-anchor="middle" font-size="8" font-weight="800" fill="#38bdf8">65%</text>
  <text x="317" y="338" text-anchor="middle" font-size="9" fill="currentColor" opacity="0.7">Service</text>

  <!-- Marketing group: value $0.88T, auto 50% -->
  <rect x="360" y="274" width="44" height="46" rx="3" fill="#a78bfa" />
  <text x="382" y="293" text-anchor="middle" font-size="8" font-weight="800" fill="white">0.88T</text>
  <rect x="408" y="284" width="44" height="36" rx="3" fill="#a78bfa" opacity="0.4" />
  <text x="430" y="302" text-anchor="middle" font-size="8" font-weight="800" fill="#a78bfa">50%</text>
  <text x="407" y="338" text-anchor="middle" font-size="9" fill="currentColor" opacity="0.7">Mktg</text>

  <!-- R&D group: value $0.79T, auto 40% -->
  <rect x="430" y="285" width="44" height="35" rx="3" fill="#22c55e" />
  <text x="452" y="300" text-anchor="middle" font-size="7" font-weight="800" fill="white">0.79T</text>
  <text x="452" y="338" text-anchor="middle" font-size="9" fill="currentColor" opacity="0.7">R&amp;D</text>
  <!-- R&D automation bar (too small to label inside) -->
  <rect x="476" y="293" width="40" height="27" rx="3" fill="#22c55e" opacity="0.4" />

  <!-- Legend -->
  <rect x="180" y="365" width="12" height="12" rx="2" fill="#f97316" />
  <text x="198" y="375" font-size="10" fill="currentColor" opacity="0.8">Value potential (trillion USD)</text>

  <rect x="350" y="365" width="12" height="12" rx="2" fill="#f97316" opacity="0.4" />
  <text x="368" y="375" font-size="10" fill="currentColor" opacity="0.8">Task automation potential (%)</text>

  <text x="280" y="396" text-anchor="middle" font-size="9" fill="currentColor" opacity="0.35">Source: McKinsey Global Institute, Generative AI's Impact on Productivity at Scale (2024)</text>
</svg>